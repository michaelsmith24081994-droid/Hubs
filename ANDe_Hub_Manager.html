  .link:hover .lico{background:#fff;color:var(--teal-deep)}
  .link .arr{margin-left:auto;color:var(--ink-faint);font-size:13px;transition:.16s}
  .link:hover .arr{color:var(--teal);transform:translate(2px,-2px)}
  .foot{margin-top:30px;padding-top:18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-faint);font-weight:500}
  .cover{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 18px 11px;margin:0 0 22px;box-shadow:var(--shadow-soft)}
  .cover-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:9px}
  .cover-cap{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint)}
  .cover-read{font-size:13.5px;color:var(--ink-soft)}
  .cover-read #coverN{font-family:'Bricolage Grotesque',"Segoe UI",system-ui,-apple-system,sans-serif;font-size:19px;font-weight:700;color:var(--teal-deep);letter-spacing:-.02em}
  .cover-read #coverT{color:var(--ink);font-weight:700}
  .cover-bars{display:flex;align-items:flex-end;gap:3px;height:34px;margin-bottom:5px}
  .cbar{flex:1;background:var(--slate-wash);border-radius:3px 3px 0 0;min-height:5px;transition:background .12s}
  .cbar.active{background:var(--teal)}
  .cover-slider{width:100%;accent-color:var(--teal);height:18px;cursor:pointer;margin:0}
  .cover-ends{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-faint);margin-top:1px}
  .ts-btn{align-self:center;border:1px solid var(--line);background:#fff;color:var(--ink);font-family:'Hanken Grotesk',system-ui,sans-serif;font-weight:600;font-size:13px;padding:11px 17px;border-radius:14px;cursor:pointer;box-shadow:var(--shadow-soft);transition:.15s;white-space:nowrap}
  .ts-btn:hover{border-color:var(--teal);background:var(--teal-wash);color:var(--teal-deep)}
  .ts-cta{background:linear-gradient(145deg,var(--teal),var(--teal-deep));color:#fff;border-color:transparent;display:inline-flex;align-items:center;gap:8px;font-size:13.5px;padding:12px 18px;box-shadow:0 8px 18px -8px rgba(10,93,80,.75);animation:ctaPulse 2.6s ease-in-out infinite}
  .ts-cta:hover{background:linear-gradient(145deg,var(--teal-deep),var(--teal-deep));color:#fff;border-color:transparent;transform:translateY(-1px);box-shadow:0 11px 24px -8px rgba(10,93,80,.85);animation:none}
  .ts-cta svg{width:16px;height:16px;display:block;flex:none}
  @keyframes ctaPulse{0%,100%{box-shadow:0 8px 18px -8px rgba(10,93,80,.55)}50%{box-shadow:0 8px 22px -6px rgba(14,124,107,.95)}}
  .ts-panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:clamp(16px,3vw,24px);margin-bottom:22px}
  .ts-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .ts-h h3{font-family:'Bricolage Grotesque',"Segoe UI",system-ui,-apple-system,sans-serif;font-weight:700;font-size:21px;letter-spacing:-.02em}
  .ts-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .ts-table{border-collapse:collapse;width:100%;min-width:580px;font-size:13.5px}
  .ts-table th,.ts-table td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line-soft);white-space:nowrap}
  .ts-table thead th{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint)}
  .ts-table td:first-child,.ts-table th:first-child{position:sticky;left:0;background:var(--card);font-weight:600;z-index:1}
  .ts-table tbody tr:hover td{background:#faf9f5}
  .ts-table tbody tr:hover td:first-child{background:#faf9f5}
  .ts-num{font-variant-numeric:tabular-nums}
  .ts-muted{color:var(--ink-faint)}
  .ts-avg td{background:var(--teal-wash)!important;border-top:2px solid var(--teal);border-bottom:0;font-weight:700;color:var(--ink)}
  .ts-avg td:first-child{background:var(--teal-wash)!important;color:var(--teal-deep)}
  .ts-tot td{background:var(--slate-wash);border-bottom:0;font-weight:700;color:var(--ink)}
  .ts-tot td:first-child{background:var(--slate-wash);color:var(--ink-soft)}
  .ts-table td.ts-bad{color:#b23a2a;background:#fdeeec;font-weight:700}
  .ts-avg td.ts-bad{background:#f7d9d4!important;color:#a8341f}
  .ts-empty{padding:26px 8px;text-align:center;color:var(--ink-faint);font-size:14px}
  .ts-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:22px}
  .ts-card{background:linear-gradient(160deg,#fff,#fbfaf7);border:1px solid var(--line);border-radius:13px;padding:13px 15px}
  .ts-card .ck{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);margin-bottom:6px}
  .ts-card .cv{font-family:'Bricolage Grotesque',"Segoe UI",system-ui,-apple-system,sans-serif;font-size:25px;font-weight:700;letter-spacing:-.02em;color:var(--ink);line-height:1}
  .ts-card .csub{font-size:11px;color:var(--ink-faint);margin-top:4px}
  .ts-card.bad{border-color:#e8b4ab;background:linear-gradient(160deg,#fff,#fdeeec)}
  .ts-card.bad .cv{color:#b23a2a}
  .ts-chart-wrap{border:1px solid var(--line);border-radius:13px;padding:14px 16px;margin-bottom:22px;background:#fff}
  .ts-chart-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px;flex-wrap:wrap}
  .ts-chart-cap{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)}
  .ts-kpi-sel{display:flex;gap:5px;flex-wrap:wrap}
  .ts-kpi-sel button{border:1px solid var(--line);background:#fff;color:var(--ink-soft);font-size:12px;font-weight:600;padding:5px 10px;border-radius:8px;cursor:pointer;font-family:inherit}
  .ts-kpi-sel button:hover{border-color:var(--teal);color:var(--teal-deep)}
  .ts-kpi-sel button.active{background:var(--ink);color:#fff;border-color:var(--ink)}
  .ch-row{display:grid;grid-template-columns:118px 1fr 52px;align-items:center;gap:10px;margin-bottom:7px}
  .ch-name{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ch-track{position:relative;background:var(--slate-wash);border-radius:6px;height:18px}
  .ch-bar{height:100%;background:var(--teal);border-radius:6px;min-width:3px;transition:width .35s ease}
  .ch-bar.bad{background:#d6493a}
  .ch-target{position:absolute;top:-2px;bottom:-2px;width:2px;background:#b23a2a;opacity:.6}
  .ch-val{font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink-soft);text-align:right}
  .ts-legend{font-size:12px;color:var(--ink-faint);margin-top:12px;line-height:1.5}
  .ts-legend .sw{display:inline-block;width:10px;height:10px;border-radius:3px;background:#d6493a;margin-right:5px;vertical-align:middle}
  .ts-comments{margin-top:20px;display:grid;gap:13px}
  .ts-cmt{border-left:3px solid var(--teal);padding:1px 0 1px 13px}
  .ts-cmt .k{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint)}
  .ts-cmt .v{font-size:14px;color:var(--ink-soft);margin-top:2px}
  body{animation:fade .5s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="mark" id="markText">DB</div>
      <div><h1 id="brandName">Your Week</h1><div class="sub" id="brandSub"></div></div>
    </div>
    <nav class="days" id="days" aria-label="Day of week"></nav>
  </header>
  <section class="hero">
    <div class="hero-left">
      <div class="eyebrow">Your Week</div>
      <div class="day-row"><h2 id="dayName">MONDAY</h2><button class="ts-btn ts-cta" id="statsToggle">Team Stats</button></div>
      <div class="date" id="dayDate"></div>
    </div>
    <div class="hero-meta">
      <div class="stat on"><div class="n" id="statOn">0</div><div class="l">On shift</div></div>
      <div class="stat off"><div class="n" id="statOff">0</div><div class="l">Off</div></div>
      <div class="stat hol"><div class="n" id="statHol">0</div><div class="l">Holiday</div></div>
    </div>
  </section>
  <div id="boardView">
  <section class="cover" id="cover">
    <div class="cover-head"><span class="cover-cap">Cover at a glance</span><span class="cover-read"><span id="coverN">0</span> on at <span id="coverT">—</span></span></div>
    <div class="cover-bars" id="coverBars"></div>
    <input type="range" id="coverSlider" class="cover-slider" aria-label="Time of day">
    <div class="cover-ends"><span id="coverStart"></span><span id="coverEnd"></span></div>
  </section>
  <main class="grid">
    <div><section class="panel"><div class="panel-head"><h3><span class="dot t"></span>Staff Shifts</h3><span class="count" id="shiftCount">0 agents</span></div><div class="panel-body"><div id="smbWrap"></div><div id="shiftBody"></div></div></section></div>
    <div><section class="panel"><div class="panel-head"><h3><span class="dot a"></span>Reminders &amp; Business Updates</h3><span class="count" id="remCount">0 active</span></div><div class="panel-body" id="remBody"></div></section></div>
  </main>
  <section class="panel links-panel"><div class="panel-head"><h3><span class="dot s"></span>Useful Links</h3><span class="count">quick access</span></div><div class="panel-body" id="linkBody"></div></section>
  </div>
  <section class="ts-panel" id="statsView" style="display:none">
    <div class="ts-h"><h3 id="tsTitle">Team Stats</h3><button class="ts-btn" id="statsBack">← Back to board</button></div>
    <div class="ts-cards" id="tsCards"></div>
    <div class="ts-chart-wrap" id="tsChartWrap">
      <div class="ts-chart-head"><span class="ts-chart-cap">Per-agent breakdown</span><div class="ts-kpi-sel" id="tsKpiSel"></div></div>
      <div class="ts-chart" id="tsChart"></div>
    </div>
    <div class="ts-scroll"><table class="ts-table" id="tsTable"></table></div>
    <div class="ts-legend" id="tsLegend"></div>
    <div class="ts-comments" id="tsComments"></div>
  </section>
  <footer class="foot" id="foot"></footer>

<script>
(function(){
  "use strict";
  var DATA = __DATA_JSON__;
  var ORDER = ["Mon","Tue","Wed","Thu","Fri"];
  var FULL = {Mon:"Monday",Tue:"Tuesday",Wed:"Wednesday",Thu:"Thursday",Fri:"Friday"};
  var SECTIONS = ["Earlies","Mids","Lates","Flexi"];
  var CHIP = {"MTA":"mta","UW Fee":"mta","Refunds":"refund","Cancellations":"cancel","Info":"info"};
  var current = "Mon";

  function initials(n){ n=(n||"").trim(); if(!n) return "–"; var p=n.split(" ").filter(Boolean); var a=p[0]?p[0].charAt(0):""; var b=p.length>1?p[p.length-1].charAt(0):""; return (a+b).toUpperCase(); }
  function elc(t,c,tx){ var e=document.createElement(t); if(c)e.className=c; if(tx!=null)e.textContent=tx; return e; }
  function dateFor(commencing,idx){ if(!commencing) return ""; var d=new Date(commencing+"T00:00:00"); if(isNaN(d.getTime())) return ""; d.setDate(d.getDate()+idx); return d.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"}); }

  function renderTabs(){
    var nav=document.getElementById("days"); nav.innerHTML="";
    ORDER.forEach(function(d){
      var b=elc("button","day-pill",d); b.setAttribute("data-day",d);
      if(d===current) b.setAttribute("aria-current","true");
      b.addEventListener("click",function(){ current=d; renderTabs(); renderDay(); });
      nav.appendChild(b);
    });
  }
  function renderDay(){
    var idx=ORDER.indexOf(current);
    document.getElementById("dayName").textContent=(FULL[current]||current).toUpperCase();
    document.getElementById("dayDate").textContent=dateFor(DATA.week.commencing,idx);
    var rows=(DATA.shifts&&DATA.shifts[current])||[];
    var on=0,off=0,hol=0;
    rows.forEach(function(r){ var s=r.status||"On"; if(s==="Off")off++; else if(s==="Holiday")hol++; else on++; });
    document.getElementById("statOn").textContent=on;
    document.getElementById("statOff").textContent=off;
    document.getElementById("statHol").textContent=hol;
    document.getElementById("shiftCount").textContent=rows.length+(rows.length===1?" agent":" agents");
    var body=document.getElementById("shiftBody"); body.innerHTML="";
    if(!rows.length){ body.appendChild(elc("div","empty","No shifts entered for "+(FULL[current]||current)+".")); }
    else {
      SECTIONS.forEach(function(sec){
        var inSec=rows.filter(function(r){ var s=(SECTIONS.indexOf(r.section)>=0)?r.section:"Mids"; return s===sec; });
        if(!inSec.length) return;
        var g=elc("div","shift-group"); g.appendChild(elc("div","group-label",sec));
        inSec.forEach(function(r){
          var row=elc("div","shift-row");
          var p=elc("div","person"); p.appendChild(elc("div","avatar",initials(r.person))); p.appendChild(elc("span","nm",r.person||""));
          row.appendChild(p);
          var st=r.status||"On",pill;
          if(st==="Off") pill=elc("span","pill off","OFF");
          else if(st==="Holiday") pill=elc("span","pill hol","HOLIDAY");
          else pill=elc("span","pill time",r.shift||"On");
          row.appendChild(pill); g.appendChild(row);
        });
        body.appendChild(g);
      });
    }
    var smbWrap=document.getElementById("smbWrap"); smbWrap.innerHTML="";
    var smb=DATA.smb&&DATA.smb[current];
    if(smb){ var s=elc("div","smb"); s.appendChild(elc("span","tag","SMB / DNR")); s.appendChild(elc("span","who",smb)); smbWrap.appendChild(s); }
    renderCover();
  }
  function parseShift(str){
    if(!str) return null;
    var s=String(str).toLowerCase().replace(/[\u2013\u2014]/g,"-");
    var re=/(\d{1,2})(?::|\.)?(\d{2})?\s*(am|pm)?/g, m, t=[];
    while((m=re.exec(s)) && t.length<2){
      var h=parseInt(m[1],10); if(isNaN(h)) continue;
      if(m[3]==="pm" && h<12) h+=12; if(m[3]==="am" && h===12) h=0;
      t.push(h + (m[2]?parseInt(m[2],10)/60:0));
    }
    if(t.length<2) return null;
    var start=t[0], end=t[1]; if(end<=start) end+=12;
    return {start:start,end:end};
  }
  function secHours(r){ if(r.status && r.status!=="On") return null; var s=r.section; if(s==="Earlies") return {start:8,end:16}; if(s==="Mids") return {start:10,end:18}; if(s==="Lates") return {start:12,end:20}; return parseShift(r.shift); }
  function coverAt(rows,tt){ var n=0; rows.forEach(function(r){ var p=secHours(r); if(p && tt>=p.start && tt<p.end) n++; }); return n; }
  function fmtHM(v){ var h=Math.floor(v/2), m=(v%2)*30; return (h<10?"0":"")+h+":"+(m===0?"00":"30"); }
  function updateCover(){
    var sl=document.getElementById("coverSlider"); var v=parseInt(sl.value,10);
    var rows=DATA.shifts[current]||[];
    document.getElementById("coverN").textContent=coverAt(rows,v/2);
    document.getElementById("coverT").textContent=fmtHM(v);
    var lo=parseInt(sl.min,10)/2; var bars=document.getElementById("coverBars").children;
    for(var i=0;i<bars.length;i++){ bars[i].className="cbar"+((lo+i)===Math.floor(v/2)?" active":""); }
  }
  function renderCover(){
    var wrap=document.getElementById("cover");
    var rows=DATA.shifts[current]||[];
    var onRows=rows.filter(function(r){ return (!r.status||r.status==="On"); }); var spans=onRows.map(secHours).filter(Boolean);
    if(!onRows.length){ wrap.style.display="none"; return; }
    wrap.style.display="";
    var minS=24,maxE=0; spans.forEach(function(p){ if(p.start<minS)minS=p.start; if(p.end>maxE)maxE=p.end; });
    if(!spans.length){ minS=8; maxE=20; } var lo=Math.floor(minS), hi=Math.ceil(maxE);
    var bars=document.getElementById("coverBars"); bars.innerHTML="";
    var counts=[]; for(var h=lo;h<hi;h++){ counts.push(coverAt(rows,h+0.5)); }
    var maxc=Math.max.apply(null,counts.concat([1]));
    counts.forEach(function(c,idx){ var b=elc("div","cbar"); b.style.height=Math.max(5,Math.round(c/maxc*32))+"px"; b.title=(lo+idx)+":00 — "+c+" on"; bars.appendChild(b); });
    var sl=document.getElementById("coverSlider"); sl.min=lo*2; sl.max=hi*2; sl.step=1;
    var now=new Date(); var nowv=Math.round((now.getHours()+now.getMinutes()/60)*2);
    sl.value=(nowv>=lo*2 && nowv<=hi*2)?nowv:Math.round((lo+(hi-lo)/2)*2);
    document.getElementById("coverStart").textContent=fmtHM(lo*2);
    document.getElementById("coverEnd").textContent=fmtHM(hi*2);
    updateCover();
  }
  function renderReminders(){
    var body=document.getElementById("remBody"); body.innerHTML="";
    var list=(DATA.reminders||[]).filter(function(r){ return (r.title || (r.lines&&r.lines.join("").trim())); });
    document.getElementById("remCount").textContent=list.length+(list.length===1?" update":" updates");
    if(!list.length){ body.appendChild(elc("div","empty","No reminders this week.")); return; }
    list.forEach(function(r){
      var card=elc("div","reminder");
      var cat=(r.category||"").trim(); if(cat){ var top=elc("div","r-top"); top.appendChild(elc("span","chip "+(CHIP[cat]||"info"),cat)); card.appendChild(top); }
      if(r.title) card.appendChild(elc("h4",null,r.title));
      (r.lines||[]).forEach(function(ln){ if(String(ln).trim()!=="") card.appendChild(elc("p",null,ln)); });
      body.appendChild(card);
    });
  }
  function renderLinks(){
    var groups=["Brand Portals","Systems & Reference"];
    var wrap=document.getElementById("linkBody"); wrap.innerHTML="";
    if(!(DATA.links||[]).length){ wrap.appendChild(elc("div","empty","No links added.")); return; }
    groups.forEach(function(gr){
      var items=(DATA.links||[]).filter(function(l){ return (l.group||"Systems & Reference")===gr && (l.name||l.url); });
      if(!items.length) return;
      var sec=elc("div","link-section"); sec.appendChild(elc("div","group-label",gr));
      var grid=elc("div","link-grid");
      items.forEach(function(l){
        var a=document.createElement("a"); a.className="link"; a.href=l.url||"#"; a.target="_blank"; a.rel="noopener";
        a.appendChild(elc("span","lico",initials(l.name||l.url)));
        a.appendChild(document.createTextNode(l.name||l.url||"Link"));
        a.appendChild(elc("span","arr","↗"));
        grid.appendChild(a);
      });
      sec.appendChild(grid); wrap.appendChild(sec);
    });
  }

  // ---- Team Stats ----
  var KPI=[
    {id:"chats",label:"Total Chats Completed",short:"Chats",type:"int",sum:true},
    {id:"emails",label:"Total Emails Completed",short:"Emails",type:"int",sum:true},
    {id:"resp",label:"Average Response Time",short:"Avg Resp",type:"dur",lower:true,target:60},
    {id:"handle",label:"Average Chat Handle Time",short:"Avg Handle",type:"dur",lower:true,target:900},
    {id:"awol",label:"AWOL Instances",short:"AWOL",type:"int",lower:true},
    {id:"breaks",label:"Unscheduled Breaks Time",short:"Unsch. Breaks",type:"dur",lower:true,target:600}
  ];
  function kpiById(id){ for(var i=0;i<KPI.length;i++){ if(KPI[i].id===id) return KPI[i]; } return null; }
  function numericOf(k,raw){ if(raw===undefined||String(raw).trim()==="") return null; return k.type==="int"?(isNaN(parseInt(raw,10))?null:parseInt(raw,10)):parseDur(raw); }
  function isBreach(id,num){ if(num===null||isNaN(num)) return false; switch(id){ case "resp": return num>=60; case "handle": return num>=900; case "awol": return num>0; case "breaks": return num>600; default: return false; } }
  function parseDur(str){
    if(str===undefined||str===null) return null; str=String(str).trim(); if(!str) return null;
    if(str.indexOf(":")>=0){ var p=str.split(":").map(function(x){return parseInt(x,10);}); if(p.some(function(n){return isNaN(n);})) return null;
      if(p.length===2) return p[0]*60+p[1]; if(p.length===3) return p[0]*3600+p[1]*60+p[2]; return p[0]*60; }
    var n=parseFloat(str); return isNaN(n)?null:n*60; // bare number = minutes
  }
  function fmtDur(sec){ sec=Math.round(sec); var h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60; var pad=function(n){return (n<10?"0":"")+n;}; return h>0?(h+":"+pad(m)+":"+pad(s)):(m+":"+pad(s)); }
  function statAgents(){
    var by=(DATA.stats&&DATA.stats.byName)||{};
    return Object.keys(by).filter(function(n){ var v=by[n]||{}; return KPI.some(function(k){ return String(v[k.id]||"").trim()!==""; }); }).sort(function(a,b){return a.localeCompare(b);});
  }
  function meanOf(names,k){ var by=DATA.stats.byName, vals=[]; names.forEach(function(n){ var num=numericOf(k,(by[n]||{})[k.id]); if(num!==null) vals.push(num); }); if(!vals.length) return null; return vals.reduce(function(a,b){return a+b;},0)/vals.length; }
  function sumOf(names,k){ var by=DATA.stats.byName, tot=null; names.forEach(function(n){ var num=numericOf(k,(by[n]||{})[k.id]); if(num!==null){ tot=(tot||0)+num; } }); return tot; }
  function fmtVal(k,num){ if(num===null) return "—"; return k.type==="int"?String(Math.round(num)):fmtDur(num); }

  var chartKPI="chats";
  function renderCards(names){
    var wrap=document.getElementById("tsCards"); wrap.innerHTML="";
    KPI.forEach(function(k){
      var headline, sub, breach=false;
      if(k.sum){ var t=sumOf(names,k); headline=(t===null?"—":String(t)); sub="total across team"; }
      else { var m=meanOf(names,k); headline=fmtVal(k,m); sub="team average"; breach=isBreach(k.id, m); }
      if(k.id==="awol"){ var ta=sumOf(names,k); headline=(ta===null?"—":String(ta)); sub="instances this week"; breach=(ta!==null&&ta>0); }
      var card=elc("div","ts-card"+(breach?" bad":""));
      card.appendChild(elc("div","ck",k.short));
      card.appendChild(elc("div","cv",headline));
      card.appendChild(elc("div","csub",sub));
      wrap.appendChild(card);
    });
  }
  function renderKpiSel(){
    var sel=document.getElementById("tsKpiSel"); sel.innerHTML="";
    KPI.forEach(function(k){
      var b=elc("button",null,k.short); if(k.id===chartKPI) b.className="active";
      b.addEventListener("click",function(){ chartKPI=k.id; renderKpiSel(); renderChart(statAgents()); });
      sel.appendChild(b);
    });
  }
  function renderChart(names){
    var k=kpiById(chartKPI), wrap=document.getElementById("tsChart"); wrap.innerHTML="";
    var by=DATA.stats.byName;
    var rows=names.map(function(n){ return {name:n,num:numericOf(k,(by[n]||{})[k.id])}; }).filter(function(r){ return r.num!==null; });
    if(!rows.length){ wrap.appendChild(elc("div","ts-muted","No figures entered for "+k.label+".")); return; }
    rows.sort(function(a,b){ return k.lower?(a.num-b.num):(b.num-a.num); });
    var max=Math.max.apply(null,rows.map(function(r){return r.num;}).concat(k.target?[k.target]:[]));
    max=max*1.08||1;
    rows.forEach(function(r){
      var row=elc("div","ch-row"); row.appendChild(elc("div","ch-name",r.name));
      var track=elc("div","ch-track");
      var bar=elc("div","ch-bar"+(isBreach(k.id,r.num)?" bad":"")); bar.style.width=Math.max(2,(r.num/max*100))+"%"; track.appendChild(bar);
      if(k.target){ var tg=elc("div","ch-target"); tg.style.left=(k.target/max*100)+"%"; tg.title="Target"; track.appendChild(tg); }
      row.appendChild(track);
      row.appendChild(elc("div","ch-val",fmtVal(k,r.num)));
      wrap.appendChild(row);
    });
  }
  function renderTeamStats(){
    var title=document.getElementById("tsTitle");
    var wc=""; if(DATA.week.commencing){ var d=new Date(DATA.week.commencing+"T00:00:00"); if(!isNaN(d.getTime())) wc=" — week commencing "+d.toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"}); }
    title.textContent="Team Stats"+wc;
    var tbl=document.getElementById("tsTable"), cmt=document.getElementById("tsComments"), leg=document.getElementById("tsLegend");
    tbl.innerHTML=""; cmt.innerHTML=""; leg.innerHTML="";
    var names=statAgents();
    document.getElementById("tsCards").innerHTML=""; document.getElementById("tsChart").innerHTML="";
    document.getElementById("tsChartWrap").style.display=names.length?"":"none";
    if(!names.length){ var tr=elc("tr"); var td=elc("td","ts-empty","No team stats have been entered for this week."); td.colSpan=KPI.length+1; tr.appendChild(td); tbl.appendChild(tr); return; }
    renderCards(names); renderKpiSel(); renderChart(names);
    var thead=elc("thead"), hr=elc("tr"); hr.appendChild(elc("th",null,"Agent"));
    KPI.forEach(function(k){ hr.appendChild(elc("th",null,k.label)); });
    thead.appendChild(hr); tbl.appendChild(thead);
    var tb=elc("tbody");
    names.forEach(function(n){
      var v=DATA.stats.byName[n]||{}, tr=elc("tr"); tr.appendChild(elc("td",null,n));
      KPI.forEach(function(k){ var raw=String(v[k.id]||"").trim(); var num=numericOf(k,raw);
        var td=elc("td","ts-num",raw||"—"); if(!raw) td.className="ts-num ts-muted"; else if(isBreach(k.id,num)) td.className="ts-num ts-bad"; tr.appendChild(td); });
      tb.appendChild(tr);
    });
    var ar=elc("tr","ts-avg"); ar.appendChild(elc("td",null,"Team average"));
    KPI.forEach(function(k){ var m=meanOf(names,k); var td=elc("td","ts-num",fmtVal(k,m)); if(m!==null && isBreach(k.id,m)) td.className="ts-num ts-bad"; ar.appendChild(td); });
    tb.appendChild(ar);
    var tr2=elc("tr","ts-tot"); tr2.appendChild(elc("td",null,"Team total"));
    KPI.forEach(function(k){ var t=sumOf(names,k); tr2.appendChild(elc("td","ts-num", t===null?"—":fmtVal(k,t))); });
    tb.appendChild(tr2);
    tbl.appendChild(tb);
    leg.innerHTML='<span class="sw"></span> Red flags a figure over target — response ≥ 1:00, handle ≥ 15:00, AWOL above 0, unscheduled breaks over 10:00. The line on each bar marks the target.';
    var comments=(DATA.stats&&DATA.stats.comments)||{};
    KPI.forEach(function(k){ var c=String(comments[k.id]||"").trim(); if(!c) return; var box=elc("div","ts-cmt"); box.appendChild(elc("div","k",k.label)); box.appendChild(elc("div","v",c)); cmt.appendChild(box); });
  }
  var STATS_ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><line x1="6" y1="20" x2="6" y2="13"></line><line x1="12" y1="20" x2="12" y2="6"></line><line x1="18" y1="20" x2="18" y2="10"></line></svg>';
  function statsBtnLabel(open){ return open ? "← Back to board" : (STATS_ICON+" Team Stats"); }
  var statsOpen=false;
  function setStats(open){
    statsOpen=open;
    document.getElementById("boardView").style.display=open?"none":"";
    document.getElementById("statsView").style.display=open?"":"none";
    var tb=document.getElementById("statsToggle"); tb.innerHTML=statsBtnLabel(open); tb.classList.toggle("ts-cta",!open);
    if(open) renderTeamStats();
    window.scrollTo(0,0);
  }
  document.getElementById("statsToggle").innerHTML=statsBtnLabel(false);
  document.getElementById("statsToggle").addEventListener("click",function(){ setStats(!statsOpen); });
  document.getElementById("statsBack").addEventListener("click",function(){ setStats(false); });

  document.getElementById("brandName").textContent=DATA.week.team||"Your Week";
  document.getElementById("brandSub").textContent=DATA.week.sub||"";
  document.getElementById("markText").textContent=initials(DATA.week.team||"Your Week");
  var fparts=[];
  if(DATA.week.commencing){ var dd=new Date(DATA.week.commencing+"T00:00:00"); if(!isNaN(dd.getTime())) fparts.push("Week commencing "+dd.toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"})); }
  if(DATA.week.postedBy) fparts.push("posted by "+DATA.week.postedBy);
  document.getElementById("foot").textContent=fparts.join("   ·   ");

  var withData=ORDER.filter(function(d){ return ((DATA.shifts&&DATA.shifts[d]&&DATA.shifts[d].length)||(DATA.smb&&DATA.smb[d])); });
  function pickToday(){
    var t=new Date(); var key=null;
    if(DATA.week.commencing){
      var c=new Date(DATA.week.commencing+"T00:00:00");
      if(!isNaN(c.getTime())){
        var diff=Math.floor((new Date(t.getFullYear(),t.getMonth(),t.getDate()) - new Date(c.getFullYear(),c.getMonth(),c.getDate()))/86400000);
        if(diff>=0 && diff<=4) key=ORDER[diff];
      }
    }
    if(!key){ var dow=t.getDay(); if(dow>=1 && dow<=5) key=ORDER[dow-1]; }
    return key;
  }
  var todayKey=pickToday();
  if(todayKey && withData.indexOf(todayKey)>=0) current=todayKey;
  else if(withData.length && withData.indexOf(current)===-1) current=withData[0];
  document.getElementById("coverSlider").addEventListener("input",updateCover);
  renderTabs(); renderDay(); renderReminders(); renderLinks();
})();
<\/script>
</body>
