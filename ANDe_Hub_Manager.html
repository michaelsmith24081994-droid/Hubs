<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AND·e · Hub</title>
<meta name="theme-color" content="#08080d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* ===== duo accent (live-customizable; JS sets a1/a2 + derived) ===== */
    --a1:#ff2d8e; --a1-rgb:255,45,142; --a1-deep:#b4226a;
    --a2:#22e6c1; --a2-rgb:34,230,193; --a2-deep:#159e93;
    --accent:var(--a1); --accent-rgb:var(--a1-rgb);
    --accent-2:var(--a2); --accent-2-rgb:var(--a2-rgb);
    /* ===== surfaces: glass over deep indigo ===== */
    --bg:#0c0820; --bg2:rgba(255,255,255,.035);
    --card:rgba(255,255,255,.05); --card-2:rgba(255,255,255,.08);
    --ink:#f3f1ff; --ink-soft:#b6b0d6; --ink-faint:#7f789c;
    --line:rgba(255,255,255,.1); --line-soft:rgba(255,255,255,.06);
    /* legacy aliases so existing markup just works */
    --teal:var(--a1); --teal-deep:var(--a2); --teal-bright:var(--a2); --teal-wash:rgba(var(--a2-rgb),.14);
    --amber:#ffb24d; --amber-bright:#ffc266; --amber-wash:rgba(255,178,77,.15);
    --coral:#ff7a5c; --red:#ff5d7a; --red-wash:rgba(255,93,122,.14);
    --blue:#5b8cff; --blue-wash:rgba(91,140,255,.16); --grad-blue:linear-gradient(135deg,#5b8cff,#2f6fe0);
    --disp:'Space Grotesk',"Segoe UI",system-ui,-apple-system,sans-serif;
    --body:'Inter',system-ui,-apple-system,sans-serif;
    --grad-teal:linear-gradient(135deg,var(--a1),var(--a2));
    --grad-warm:linear-gradient(135deg,#ffc266,#ff7a3c);
    --grad-ink:linear-gradient(160deg,rgba(var(--a1-rgb),.18),rgba(var(--a2-rgb),.10));
    --sh-sm:0 1px 2px rgba(0,0,0,.4);
    --sh:0 6px 18px rgba(0,0,0,.35),0 20px 50px -24px rgba(0,0,0,.85);
    --sh-lift:0 18px 50px -18px rgba(var(--a1-rgb),.6);
    --reveal-ease:cubic-bezier(.22,.7,.2,1);
    --topbar-h:66px;
  }
  body.light{
    --bg:#ffffff; --bg2:#ffffff; --card:#ffffff; --card-2:#ffffff;
    --ink:#15132b; --ink-soft:#56536e; --ink-faint:#9a98ad;
    --line:rgba(20,16,40,.11); --line-soft:rgba(20,16,40,.06);
    --teal-wash:rgba(var(--a2-rgb),.14); --amber-wash:rgba(255,178,77,.18);
    --red-wash:rgba(255,93,122,.12); --blue-wash:rgba(91,140,255,.14);
    --sh-sm:0 1px 2px rgba(20,16,40,.05); --sh:0 1px 3px rgba(20,16,40,.05),0 16px 38px -22px rgba(20,16,40,.22);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-font-smoothing:antialiased;scroll-behavior:smooth}
  body{font-family:var(--body);color:var(--ink);background:var(--bg);line-height:1.5;min-height:100vh;overflow-x:hidden}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:
    radial-gradient(900px 600px at 84% -12%,rgba(var(--a1-rgb),.30),transparent 58%),
    radial-gradient(760px 600px at 6% 6%,rgba(var(--a2-rgb),.18),transparent 56%),
    radial-gradient(700px 700px at 50% 120%,rgba(var(--a1-rgb),.12),transparent 60%),
    linear-gradient(165deg,#140c30,#0a0618 70%);}
  body.light::before{background:
    radial-gradient(760px 520px at 88% -14%,rgba(var(--a1-rgb),.09),transparent 56%),
    radial-gradient(640px 500px at 2% 2%,rgba(var(--a2-rgb),.07),transparent 54%),
    #ffffff;}
  .ambient{position:fixed;inset:-12%;z-index:0;pointer-events:none;opacity:.42;mix-blend-mode:screen}
  .ambient svg{width:100%;height:100%}
  .ambient .ln{fill:none;stroke:rgba(var(--a2-rgb),.5);stroke-width:1}
  @keyframes drift{from{transform:translate3d(0,0,0)}to{transform:translate3d(-2.5%,-1.5%,0)}}
  .ambient{animation:drift 40s ease-in-out infinite alternate}

  /* ===== shell: topbar + view ===== */
  .app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}
  .topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:18px;padding:0 clamp(16px,3vw,30px);height:var(--topbar-h);
    background:rgba(12,8,32,.62);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);border-bottom:1px solid var(--line)}
  body.light .topbar{background:rgba(255,255,255,.9)}
  .brand{display:flex;align-items:center;gap:12px;flex:0 1 auto;min-width:0}
  .brand .mk{width:40px;height:40px;border-radius:12px;background:var(--grad-teal);display:grid;place-items:center;color:#fff;font-family:var(--disp);font-weight:700;font-size:22px;padding-bottom:3px;box-shadow:0 10px 26px -8px rgba(var(--a1-rgb),.8),inset 0 1px 0 rgba(255,255,255,.3)}
  .brand .bt h1{font-family:var(--disp);font-weight:600;font-size:17px;letter-spacing:.03em;color:var(--ink);white-space:nowrap}
  .brand .bt h1 .ip{color:var(--a2);font-weight:700;margin:0 1px}
  .brand .who{font-size:11px;color:var(--ink-faint);white-space:nowrap}
  @media(max-width:600px){.brand .bt{display:none}}

  nav.menu{position:relative;display:flex;align-items:center;gap:2px;flex:1 1 0;min-width:0;justify-content:center;overflow-x:auto;overflow-y:visible;scrollbar-width:none;height:100%;-ms-overflow-style:none}
  nav.menu::-webkit-scrollbar{display:none}
  .navi{position:relative;z-index:1;display:inline-flex;align-items:center;gap:7px;border:0;background:transparent;cursor:pointer;font-family:var(--body);font-weight:500;font-size:13.5px;color:var(--ink-soft);padding:9px 11px;border-radius:11px;white-space:nowrap;transition:.18s var(--reveal-ease)}
  .navi:hover{color:var(--ink)}
  .navi.active{color:var(--ink);font-weight:600}
  .navi .ic{font-size:14px;opacity:.85}
  @media(max-width:980px){.navi .lbl{display:none}.navi{padding:10px 12px}.navi .ic{font-size:17px;opacity:1}.navi.active .lbl{display:inline;font-size:13px}}
  .nav-ind{position:absolute;bottom:8px;left:0;height:3px;width:0;border-radius:3px;background:var(--grad-teal);box-shadow:0 0 14px 1px rgba(var(--a1-rgb),.8);transition:left .34s var(--reveal-ease),width .34s var(--reveal-ease),opacity .2s;opacity:0;z-index:0}

  .topactions{display:flex;align-items:center;gap:8px;flex:0 0 auto;justify-content:flex-end}
  .iconbtn{width:40px;height:40px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);font-size:17px;cursor:pointer;display:grid;place-items:center;transition:.15s;backdrop-filter:blur(6px)}
  .iconbtn:hover{border-color:var(--a1);color:var(--ink);background:rgba(var(--a1-rgb),.14)}
  .iconbtn svg{width:18px;height:18px;display:block}
  .iconbtn.on{border-color:var(--a2);color:var(--a2);background:rgba(var(--a2-rgb),.14)}
  .moreWrap{position:relative}
  .moremenu{position:absolute;right:0;top:48px;min-width:190px;background:var(--card-2);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);padding:7px;display:none;flex-direction:column;gap:3px;z-index:60}
  .moremenu.show{display:flex;animation:pop .16s var(--reveal-ease) both}
  .moremenu button{display:flex;align-items:center;gap:9px;border:0;background:transparent;color:var(--ink-soft);font-family:var(--body);font-weight:600;font-size:13.5px;text-align:left;padding:10px 12px;border-radius:9px;cursor:pointer;transition:.13s}
  .moremenu button:hover{background:var(--card);color:var(--ink)}
  @media(max-width:600px){.brand .mk{width:36px;height:36px;font-size:19px}.topbar{gap:10px}}

  /* ===== main ===== */
  main.view{position:relative;z-index:1;padding:clamp(20px,3vw,40px) clamp(16px,3vw,42px);max-width:1240px;width:100%;margin:0 auto}
  section{animation:secEnter .5s var(--reveal-ease) both}
  @keyframes secEnter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .reveal{opacity:0;transform:translateY(22px);transition:opacity .65s var(--reveal-ease),transform .65s var(--reveal-ease)}
  .reveal.in{opacity:1;transform:none}
  @media(prefers-reduced-motion:reduce){.reveal{opacity:1!important;transform:none!important;transition:none}section,.ambient,.scard,.pill,.item,.modal,.pal{animation:none!important}html{scroll-behavior:auto}.nav-ind{transition:opacity .2s}}

  .vhead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:28px}
  .vhead .eyebrow{font-size:11px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--a2);display:flex;align-items:center;gap:9px;margin-bottom:11px}
  .vhead .eyebrow::before{content:"";width:24px;height:2px;border-radius:2px;background:var(--grad-teal)}
  .vhead h2{font-family:var(--disp);font-weight:700;font-size:clamp(32px,5.4vw,50px);letter-spacing:-.035em;line-height:.96}
  .vhead p.lede{color:var(--ink-soft);font-size:14.5px;margin-top:11px;max-width:64ch}
  .vhead p.lede b{color:var(--ink)}
  .vhead .actions{display:flex;gap:9px;flex-wrap:wrap}

  .btn{font-family:var(--body);font-weight:600;font-size:13.5px;cursor:pointer;border-radius:12px;padding:10px 16px;border:1px solid var(--line);background:var(--card);color:var(--ink);transition:.16s var(--reveal-ease);display:inline-flex;align-items:center;gap:7px;backdrop-filter:blur(6px)}
  .btn:hover{border-color:var(--a1);color:var(--ink);transform:translateY(-1px);box-shadow:0 10px 24px -14px rgba(var(--a1-rgb),.8)}
  .btn.primary{background:#ffffff;color:#15132b;border-color:rgba(0,0,0,.06);box-shadow:0 8px 22px -12px rgba(0,0,0,.6)}
  .btn.primary:hover{background:#ffffff;color:#15132b;border-color:rgba(0,0,0,.06);transform:translateY(-1px);box-shadow:0 12px 28px -12px rgba(0,0,0,.72)}
  .btn.warm{background:#ffffff;color:#15132b;border-color:rgba(0,0,0,.06);box-shadow:0 8px 22px -12px rgba(0,0,0,.6)}
  .btn.warm:hover{background:#ffffff;color:#15132b;border-color:rgba(0,0,0,.06);transform:translateY(-1px);box-shadow:0 12px 28px -12px rgba(0,0,0,.72)}
  .btn.blue{background:var(--grad-blue);color:#fff;border-color:transparent}
  .btn.blue:hover{color:#fff}
  .btn.sm{padding:7px 12px;font-size:12.5px;border-radius:10px}

  /* hero gradient stat cards */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:14px;margin-bottom:18px}
  .cards.hero-row{grid-template-columns:repeat(auto-fit,minmax(270px,1fr));margin-bottom:14px}
  .scard{position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px 22px;box-shadow:var(--sh-sm);overflow:hidden;backdrop-filter:blur(14px)}
  .scard::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.06),transparent 42%);pointer-events:none}
  .scard .k{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-faint);margin-bottom:10px}
  .scard .v{font-family:var(--disp);font-weight:700;font-size:32px;letter-spacing:-.03em;line-height:1}
  .scard .v.grad{background:var(--grad-teal);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .scard .sub{font-size:12px;color:var(--ink-faint);margin-top:8px}
  .scard.click{cursor:pointer;transition:.18s var(--reveal-ease)}
  .scard.click:hover{transform:translateY(-3px);box-shadow:var(--sh);border-color:rgba(var(--a1-rgb),.5)}
  .scard.fill{border:0;color:#fff;padding:24px 26px;backdrop-filter:none;-webkit-backdrop-filter:none}
  .scard.fill::after{background:linear-gradient(180deg,rgba(255,255,255,.16),transparent 46%)}
  .scard.fill .k{color:rgba(255,255,255,.86)}
  .scard.fill .sub{color:rgba(255,255,255,.82)}
  .scard.fill .v.big{font-size:clamp(42px,6.4vw,60px);letter-spacing:-.045em}
  .scard.fill .v .vu{font-size:.36em;font-weight:600;opacity:.85;letter-spacing:0;margin-left:2px}
  .scard.fill-a{background-color:var(--a1);background-image:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 22px 54px -22px rgba(var(--a1-rgb),.75)}
  .scard.fill-b{background-color:var(--a2);background-image:linear-gradient(135deg,var(--a2),var(--a1));box-shadow:0 22px 54px -22px rgba(var(--a2-rgb),.6)}
  .scard.fill[data-wm]::before{content:attr(data-wm);position:absolute;right:2px;bottom:-30px;font-size:150px;line-height:1;opacity:.14;font-family:var(--disp);pointer-events:none}
  .scard.fill.click:hover{transform:translateY(-3px);filter:brightness(1.05)}

  .pillrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(152px,1fr));gap:13px;margin-bottom:8px}
  .pill{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--sh-sm);cursor:pointer;transition:.18s var(--reveal-ease);overflow:hidden;backdrop-filter:blur(12px)}
  .pill::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--ink-faint)}
  .pill.good::before{background:var(--grad-teal)} .pill.bad::before{background:linear-gradient(180deg,#ff7a93,#e0455f)} .pill.neutral::before{background:linear-gradient(180deg,#8e88a8,#615b78)}
  .pill:hover{transform:translateY(-3px);box-shadow:var(--sh);border-color:rgba(var(--a1-rgb),.45)}
  .pill .pl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);margin-bottom:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pill .pv{font-family:var(--disp);font-weight:700;font-size:28px;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
  .pill.bad .pv{color:var(--red)}
  .pill .pf{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:11.5px;color:var(--ink-faint)}
  #dashPills{grid-template-columns:repeat(auto-fit,minmax(196px,1fr))}
  #dashPills .pl{white-space:normal;overflow:visible;text-overflow:clip;min-height:26px}
  .trend{font-weight:700;padding:2px 8px;border-radius:20px;font-size:11px}
  .trend.up{background:var(--teal-wash);color:var(--a2)} .trend.down{background:var(--red-wash);color:var(--red)} .trend.flat{background:rgba(255,255,255,.08);color:var(--ink-faint)}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh);overflow:hidden;margin-bottom:20px;backdrop-filter:blur(14px)}
  .panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:17px 21px;border-bottom:1px solid var(--line-soft)}
  .panel-h h3{font-family:var(--disp);font-weight:600;font-size:16px;letter-spacing:-.01em}
  .panel-b{padding:16px 20px}
  .grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;align-items:start}
  @media(max-width:900px){.grid2{grid-template-columns:1fr}}

  .cal-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .cal-head .mlbl{font-family:var(--disp);font-weight:600;font-size:16px}
  .cal-nav{display:flex;gap:6px}
  .cal-nav button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--card-2);cursor:pointer;font-size:14px;color:var(--ink-soft)}
  .cal-nav button:hover{border-color:var(--a1);color:var(--a2)}
  .cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;padding:4px 0 2px}
  .cal-dow{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);text-align:center;padding:4px 0}
  .cal-day{min-width:0;overflow:hidden;min-height:64px;border:1px solid var(--line-soft);border-radius:11px;padding:6px 6px 4px;cursor:pointer;background:var(--bg2);transition:.14s;display:flex;flex-direction:column;gap:3px}
  .cal-day:hover{border-color:var(--a1);box-shadow:var(--sh-sm)}
  .cal-day.out{opacity:.4}
  .cal-day.today{border-color:var(--a1);background:rgba(var(--a1-rgb),.12)}
  .cal-day .dn{font-size:12px;font-weight:700;color:var(--ink-soft)}
  .cal-day.today .dn{color:var(--a2)}
  .ev-pill{font-size:9.5px;font-weight:700;color:#fff;border-radius:5px;padding:2px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
  .ev-pill.shift{background:var(--a1)} .ev-pill.meeting{background:var(--amber);color:#231405} .ev-pill.desk{background:var(--blue)}
  .ev-more{font-size:9.5px;font-weight:700;color:var(--ink-faint)}
  .cal-legend{display:flex;gap:14px;margin-top:10px;font-size:11.5px;color:var(--ink-soft)}
  .cal-legend span{display:inline-flex;align-items:center;gap:6px}
  .dot{width:9px;height:9px;border-radius:3px} .dot.shift{background:var(--a1)} .dot.meeting{background:var(--amber)} .dot.desk{background:var(--blue)}

  .qgroup{margin-bottom:24px}
  .qhead{display:flex;align-items:center;gap:11px;margin:4px 2px 12px;font-family:var(--disp);font-weight:600;font-size:15px}
  .qhead .cnt{font-family:var(--body);font-size:11.5px;font-weight:700;color:var(--a2);background:var(--teal-wash);padding:2px 9px;border-radius:20px}
  .item{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:11px;box-shadow:var(--sh-sm);cursor:pointer;transition:.16s var(--reveal-ease);backdrop-filter:blur(12px)}
  .item:hover{border-color:rgba(var(--a1-rgb),.45);box-shadow:var(--sh);transform:translateY(-2px)}
  .item .top{display:flex;align-items:center;gap:10px;margin-bottom:7px;flex-wrap:wrap}
  .item .date{font-size:12px;font-weight:600;color:var(--ink-faint);font-variant-numeric:tabular-nums}
  .cat{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:var(--amber-wash);color:var(--amber);padding:3px 9px;border-radius:7px}
  .cat.teal{background:var(--teal-wash);color:var(--a2)}
  .cat.blue{background:var(--blue-wash);color:var(--blue)}
  .item h4{font-family:var(--disp);font-weight:600;font-size:16px;letter-spacing:-.01em;margin-bottom:4px}
  .item .detail{font-size:13.5px;color:var(--ink-soft);white-space:pre-wrap;word-wrap:break-word}
  .item .detail strong{color:var(--ink)}
  .item .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
  .tg{font-size:11px;font-weight:600;background:rgba(255,255,255,.07);color:var(--ink-soft);padding:3px 9px;border-radius:7px}
  .item .ref{font-size:12px;color:var(--a2);margin-top:8px;word-break:break-word}
  .item .ref a{color:var(--a2)}
  .empty{text-align:center;color:var(--ink-faint);padding:38px 16px}
  .empty .big{font-family:var(--disp);font-size:17px;color:var(--ink-soft);margin-bottom:6px}

  .att-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .att-thumb{width:64px;height:64px;border-radius:10px;object-fit:cover;border:1px solid var(--line);cursor:pointer;transition:.14s}
  .att-thumb:hover{transform:scale(1.04);border-color:var(--a1)}
  .att-file{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--a2);background:var(--teal-wash);border-radius:9px;padding:7px 11px;text-decoration:none}
  .att-file:hover{filter:brightness(1.1)}

  .collapse-h{display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none}
  .tbl-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:14px;margin-top:14px}
  table.tbl{border-collapse:collapse;width:100%;font-size:13.5px;min-width:560px}
  table.tbl th,table.tbl td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line-soft);white-space:nowrap}
  table.tbl thead th{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);background:var(--bg2)}
  table.tbl td:first-child,table.tbl th:first-child{position:sticky;left:0;background:#181233;font-weight:600}
  body.light table.tbl td:first-child,body.light table.tbl th:first-child{background:#fff}
  table.tbl tbody tr:hover td{background:rgba(255,255,255,.04)}
  td.num{font-variant-numeric:tabular-nums} td.bad{color:var(--red);background:var(--red-wash)!important;font-weight:700}

  .calpop-card{width:100%;max-width:880px;background:var(--card-2);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:22px;box-shadow:0 50px 120px -30px rgba(0,0,0,.9);animation:pop .24s var(--reveal-ease);overflow:hidden}

  .calpop-b{padding:18px 22px}
  .cal-big .cal-grid{gap:8px}

  .cal-big .ev-pill{font-size:11px;padding:3px 7px}

  /* ===== team sync ===== */
  body.role-agent .mgr-only{display:none}
  body.role-manager .agent-only{display:none}
  .fb-nav{position:relative}
  .fb-dot{display:none;width:8px;height:8px;border-radius:50%;background:var(--a1);box-shadow:0 0 8px 1px var(--a1);margin-left:2px}
  .fb-dot.on{display:inline-block}
  .sync-pill{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);color:var(--ink-soft)}
  .sync-pill .dotc{width:9px;height:9px;border-radius:50%;background:var(--ink-faint)}
  .sync-pill.ok .dotc{background:#22e6c1;box-shadow:0 0 8px 1px #22e6c1}
  .sync-pill.off .dotc{background:#ff5d7a}
  .team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
  .agent-card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px;box-shadow:var(--sh-sm);cursor:pointer;transition:.16s var(--reveal-ease);backdrop-filter:blur(12px)}
  .agent-card:hover{transform:translateY(-3px);box-shadow:var(--sh);border-color:rgba(var(--a1-rgb),.45)}
  .agent-card .ac-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .agent-card .ac-av{width:46px;height:46px;border-radius:50%;flex:none;background:var(--grad-teal) center/cover no-repeat;display:grid;place-items:center;color:#fff;font-family:var(--disp);font-weight:700;font-size:18px}
  .agent-card .ac-name{font-family:var(--disp);font-weight:600;font-size:16px}
  .agent-card .ac-role{font-size:12px;color:var(--ink-faint)}
  .agent-card .ac-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center}
  .agent-card .ac-stat{background:var(--bg2);border:1px solid var(--line-soft);border-radius:11px;padding:9px 6px}
  .agent-card .ac-stat .v{font-family:var(--disp);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
  .agent-card .ac-stat .l{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);margin-top:3px}
  .agent-card .ac-flag{position:absolute;top:14px;right:16px;font-size:11px;font-weight:700;color:var(--a2)}
  .ac-stale{font-size:10.5px;color:var(--ink-faint);margin-top:10px}
  .fb-note{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--a1);border-radius:0 14px 14px 0;padding:14px 16px;margin-bottom:11px;box-shadow:var(--sh-sm)}
  .fb-note .fh{display:flex;align-items:center;gap:10px;margin-bottom:6px;font-size:12px;color:var(--ink-faint)}
  .fb-note .fh b{color:var(--a2);font-weight:700}
  .fb-note .ft{font-size:14px;color:var(--ink);white-space:pre-wrap}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--bg2)}
  .seg button{border:0;background:transparent;color:var(--ink-soft);font-family:var(--body);font-weight:600;font-size:13px;padding:9px 16px;cursor:pointer}
  .seg button.on{background:var(--grad-teal);color:#fff}


  /* ===== password lock + edition badge ===== */
  #lockScreen{position:fixed;inset:0;z-index:120;display:none;align-items:center;justify-content:center;padding:24px;
    background:radial-gradient(900px 600px at 80% -10%,rgba(var(--a1-rgb),.3),transparent 58%),radial-gradient(760px 600px at 6% 6%,rgba(var(--a2-rgb),.18),transparent 56%),linear-gradient(165deg,#140c30,#0a0618 70%)}
  #lockScreen.show{display:flex}
  body.locked{overflow:hidden}
  .lock-card{width:100%;max-width:380px;background:var(--card-2);backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:22px;box-shadow:0 50px 120px -30px rgba(0,0,0,.9);padding:30px 28px;text-align:center}
  .lock-card .mk{width:54px;height:54px;border-radius:15px;background:var(--grad-teal);display:grid;place-items:center;color:#fff;font-family:var(--disp);font-weight:700;font-size:28px;margin:0 auto 16px;box-shadow:0 12px 30px -8px rgba(var(--a1-rgb),.8)}

  .ed-badge.manager{background:rgba(var(--a1-rgb),.15);color:var(--a1)}

  .navi .ic svg{width:16px;height:16px;display:block}

  .mgr-chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--a2);background:var(--teal-wash);border-radius:7px;padding:3px 9px;margin-top:6px}

  .agent-card.slim{padding:16px 18px}

  .syncbtn.spin{animation:spin360 .8s linear infinite} @keyframes spin360{to{transform:rotate(360deg)}}

  .seg.sm button{padding:6px 12px;font-size:12px}

  details.collapse{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:12px;background:var(--bg2)}

  .reco-card .reco-from{font-size:12px;color:var(--ink-soft)}
  .fb-note.fb-coach{border-left-color:var(--a2)}

  .theme-row{display:flex;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid var(--line-soft)}

  .theme-main{flex:1;min-width:0}
  .theme-name{font-weight:600;font-size:14px;margin-bottom:5px}
  .theme-bar{height:7px;border-radius:4px;background:var(--bg2);overflow:hidden;margin-bottom:5px}

  .theme-sub{font-size:11.5px;color:var(--ink-faint)}
  .coach-row{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--line-soft)}

  .shift-banner{display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:14px;margin-bottom:10px;background:linear-gradient(120deg,rgba(var(--a1-rgb),.18),rgba(var(--a2-rgb),.13));border:1px solid rgba(var(--a2-rgb),.45);flex-wrap:wrap}
  .shift-banner .shift-tag{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#07121a;background:linear-gradient(90deg,var(--a1),var(--a2));padding:4px 10px;border-radius:7px}

<script>
"use strict";
(function(){
  var HUB_EDITION="manager"; if(HUB_EDITION!=="manager"&&HUB_EDITION!=="agent") HUB_EDITION="agent";
  var KEY="managerHub.v3", DB="managerHubDB", STORE="kv", IDKEY="state", useLS=false;

  /* ---------- helpers ---------- */
  function pad(n){ return (n<10?"0":"")+n; }
  function todayISO(off){ var d=new Date(); if(off) d.setDate(d.getDate()+off); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function mondayOf(iso){ var d=iso?new Date(iso+"T00:00:00"):new Date(); if(isNaN(d.getTime())) d=new Date(); var day=(d.getDay()+6)%7; d.setDate(d.getDate()-day); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  function mdToHtml(s){ s=esc(s); s=s.replace(/\*\*([^*\n]+)\*\*/g,"<strong>$1</strong>"); s=s.replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<em>$2</em>"); s=s.replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>'); return s.replace(/\n/g,"<br>"); }
  function fmtDate(iso){ if(!iso) return ""; var d=new Date(iso+"T00:00:00"); if(isNaN(d.getTime())) return iso; return d.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}); }
  function fmtShort(iso){ if(!iso) return ""; var d=new Date(iso+"T00:00:00"); if(isNaN(d.getTime())) return iso; return d.toLocaleDateString("en-GB",{day:"numeric",month:"short"}); }
  function quarterKey(iso){ var d=new Date(iso+"T00:00:00"); if(isNaN(d.getTime())) return {label:"Undated",sort:0}; var hf=d.getMonth()<6?1:2; var m=hf===1?"Jan–Jun":"Jul–Dec"; return {label:"H"+hf+" "+d.getFullYear()+" · "+m,sort:d.getFullYear()*10+hf}; }
  function fmtDurType(raw){ raw=String(raw); if(/^\d{1,2}:\d{0,2}$/.test(raw)) return raw; var d=raw.replace(/[^0-9]/g,"").slice(0,4); if(d.length<=2) return d; return d.slice(0,2)+":"+d.slice(2); }
  function parseDur(str){ if(str==null) return null; str=String(str).trim(); if(!str) return null; if(str.indexOf(":")>=0){ var p=str.split(":").map(function(x){return parseInt(x,10);}); if(p.some(function(n){return isNaN(n);})) return null; if(p.length===2) return p[0]*60+p[1]; if(p.length===3) return p[0]*3600+p[1]*60+p[2]; return p[0]*60; } var n=parseFloat(str); return isNaN(n)?null:n*60; }
  function fmtDur(sec){ sec=Math.round(sec); var h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60; return h>0?(h+":"+pad(m)+":"+pad(s)):(m+":"+pad(s)); }
  function uid(p){ return (p||"id")+Date.now()+Math.floor(Math.random()*9999); }
  function toast(m){ var t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(function(){ t.classList.remove("show"); },2800); }
  function doCopy(text,msg){ if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(String(text||"")).then(function(){ toast(msg||"Copied."); },function(){ toast("Couldn't copy."); }); } else toast("Copy not supported here."); }
  function copySnippet(text,msg){
    text=String(text||"");
    var ph=[]; (text.match(/\{[^{}\n]{1,40}\}/g)||[]).forEach(function(p){ if(ph.indexOf(p)<0) ph.push(p); });
    if(!ph.length){ doCopy(text,msg); return; }
    var fields=ph.map(function(p,i){ return '<label class="fld"><span class="lab">'+esc(p.slice(1,-1))+'</span><input class="in" data-ph="'+i+'" autocomplete="off"></label>'; }).join("");
    openModal('<div class="modal-h"><h3>Fill in the blanks</h3><button class="x" id="mX">\u2715</button></div><div class="modal-b">'+fields+'<label class="fld"><span class="lab">Preview</span><div id="phPrev" style="border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px;white-space:pre-wrap;color:var(--ink-soft)"></div></label></div><div class="modal-f"><span></span><div style="display:flex;gap:9px"><button class="btn" id="mCancel">Cancel</button><button class="btn primary" id="mSave">Copy</button></div></div>');
    function filled(){ var out=text; modalInner.querySelectorAll("[data-ph]").forEach(function(inp){ var p=ph[parseInt(inp.getAttribute("data-ph"),10)]; if(inp.value) out=out.split(p).join(inp.value); }); return out; }
    function prevDraw(){ document.getElementById("phPrev").textContent=filled(); }
    modalInner.querySelectorAll("[data-ph]").forEach(function(inp){ inp.addEventListener("input",prevDraw); inp.addEventListener("keydown",function(e){ if(e.key==="Enter"){ e.preventDefault(); document.getElementById("mSave").click(); } }); });
    prevDraw();
    document.getElementById("mX").onclick=closeModal; document.getElementById("mCancel").onclick=closeModal;
    document.getElementById("mSave").onclick=function(){ doCopy(filled(),msg); closeModal(); };
    setTimeout(function(){ var f=modalInner.querySelector("[data-ph]"); if(f) f.focus(); },50);
  }
  function byId(arr,id){ for(var i=0;i<(arr||[]).length;i++){ if(arr[i].id===id) return arr[i]; } return null; }
  function toastAction(m,label,fn){ var t=document.getElementById("toast"); t.textContent=m; var b=document.createElement("button"); b.textContent=label; b.onclick=function(){ clearTimeout(toast._t); t.classList.remove("show"); fn(); }; t.appendChild(b); t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(function(){ t.classList.remove("show"); },6500); }
  function numericOf(k,raw){ if(raw===undefined||raw===null||String(raw).trim()==="") return null; return k.type==="dur"?parseDur(raw):(isNaN(parseFloat(raw))?null:parseFloat(raw)); }
  function fmtKpi(k,num){ if(num===null||num===undefined||isNaN(num)) return "—"; return k.type==="dur"?fmtDur(num):String(Math.round(num)); }
  function kpiBreach(k,num){ if(num===null||isNaN(num)||!k.lower||k.target===null||k.target===undefined) return false; return num>k.target; }
  function avg(arr){ var n=arr.filter(function(x){return x!=null;}); return n.length?n.reduce(function(a,b){return a+b;},0)/n.length:null; }
  function aggVal(k,nums){ var v=nums.filter(function(n){return n!=null;}); if(!v.length) return null; return k.type==="int"? v.reduce(function(a,b){return a+b;},0) : avg(v); }
  function weeksSorted(){ return state.stats.weeks.slice().sort(function(a,b){return (a.weekOf||"").localeCompare(b.weekOf||"");}); }

  /* ---------- persistence (IndexedDB w/ localStorage fallback) ---------- */
  function idbOpen(){ return new Promise(function(res,rej){ var r=indexedDB.open(DB,1); r.onupgradeneeded=function(){ r.result.createObjectStore(STORE); }; r.onsuccess=function(){ res(r.result); }; r.onerror=function(){ rej(r.error); }; }); }
  function idbGetFrom(dbName){ return new Promise(function(res){ try{ var r=indexedDB.open(dbName,1); r.onupgradeneeded=function(){ try{ r.result.createObjectStore(STORE); }catch(e){} }; r.onsuccess=function(){ try{ var db=r.result; if(!db.objectStoreNames.contains(STORE)){ res(null); return; } var t=db.transaction(STORE,"readonly").objectStore(STORE).get(IDKEY); t.onsuccess=function(){ res(t.result||null); }; t.onerror=function(){ res(null); }; }catch(e){ res(null); } }; r.onerror=function(){ res(null); }; }catch(e){ res(null); } }); }
  function idbGet(){ return idbOpen().then(function(db){ return new Promise(function(res,rej){ var t=db.transaction(STORE,"readonly").objectStore(STORE).get(IDKEY); t.onsuccess=function(){ res(t.result); }; t.onerror=function(){ rej(t.error); }; }); }); }
  function idbSet(v){ return idbOpen().then(function(db){ return new Promise(function(res,rej){ var tx=db.transaction(STORE,"readwrite"); tx.objectStore(STORE).put(v,IDKEY); tx.oncomplete=function(){ res(); }; tx.onerror=function(){ rej(tx.error); }; }); }); }
  function idbGetKey(k){ return idbOpen().then(function(db){ return new Promise(function(res,rej){ var t=db.transaction(STORE,"readonly").objectStore(STORE).get(k); t.onsuccess=function(){ res(t.result); }; t.onerror=function(){ rej(t.error); }; }); }); }
  function idbSetKey(k,v){ return idbOpen().then(function(db){ return new Promise(function(res,rej){ var tx=db.transaction(STORE,"readwrite"); tx.objectStore(STORE).put(v,k); tx.oncomplete=function(){ res(); }; tx.onerror=function(){ rej(tx.error); }; }); }); }
  var saveT;
  var pubT;
  function save(){ clearTimeout(saveT); saveT=setTimeout(function(){ if(useLS){ try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){ toast("Storage full — remove some large attachments."); } } else { idbSet(state).catch(function(){ toast("Couldn't save — try Backup to be safe."); }); } },400);
    if(typeof TEAM!=="undefined" && TEAM.dir && state.config.teamRole==="agent" && state.config.name){ clearTimeout(pubT); pubT=setTimeout(function(){ publishSummary(true); },2500); } }

  /* ---------- state ---------- */
  function defaultConfig(){ return {
    role:"Live chat agent",
    evidenceCats:["Customer feedback","Above & beyond","Process improvement","Quality / compliance","Productivity","Difficult case handled","Learning","Teamwork"],
    kbCats:["Process","Canned replies","Systems & portals","FAQs","Personal tips"],
    auditForms:["New business","MTA","Renewal","Cancellation","Complaint","Payment"],
    brands:["KFI","TYA","TMI","ASN","LMI","KIN"],
    theme:"dark", accent:"#ff2d8e", accent2:"#22e6c1", name:"", avatar:"",
    teamRole:"agent", agentId:"", teamFolder:"", autoPull:true, managerName:"", managerId:"", lockHash:"", lockSalt:"", recoveryQ:"", recoveryHash:"", recoverySalt:"", lastResetTs:"",
    kpis:[
      {id:"chats",label:"Chats",type:"int",target:null,lower:false},
      {id:"emails",label:"Emails",type:"int",target:null,lower:false},
      {id:"resp",label:"Avg response",type:"dur",target:60,lower:true},
      {id:"handle",label:"Avg handle",type:"dur",target:900,lower:true},
      {id:"awol",label:"AWOL",type:"int",target:0,lower:true},
      {id:"breaks",label:"Unsched. breaks",type:"dur",target:600,lower:true}
    ]
  };}
  function seed(){ return {
    v:3, config:defaultConfig(), meta:{}, teamInbox:{notes:[],stats:[],audits:[],updatedAt:""},
    evidence:[], stats:{weeks:[]}, kb:[], events:[], notes:[], brandRows:[], tasks:[], goals:[], learning:[], audits:[], recognitionsGiven:[], coaching:[], buzz:[], links:[], contacts:[], coachThread:[], timeOwedReq:[], toHandled:{}, admins:{}, assignedAgents:[], yourWeek:ywSeed()
  };}
  function ensureAtt(arr){ (arr||[]).forEach(function(x){ if(!Array.isArray(x.attachments)) x.attachments=[]; }); return arr||[]; }
  function migrate(s){
    if(!s||typeof s!=="object") return seed();
    var base=seed(); s.v=3;
    s.config=Object.assign(defaultConfig(), s.config||{});
    if(!s.config.accent) s.config.accent="#ff2d8e";
    if(!s.config.accent2) s.config.accent2="#22e6c1";
    if(s.config.teamRole!=="manager") s.config.teamRole="agent";
    if(Array.isArray(s.config.kpis)) s.config.kpis.forEach(function(k){ if(k && (k.id==="breaks" || /unsched|break/i.test(k.label||""))){ k.type="dur"; k.sumDur=true; if(k.target==null) k.target=600; k.lower=true; } });
    if(typeof s.config.agentId!=="string") s.config.agentId="";
    if(typeof s.config.autoPull!=="boolean") s.config.autoPull=true;
    if(!s.teamInbox||typeof s.teamInbox!=="object") s.teamInbox={notes:[],stats:[],audits:[],recognitions:[],updatedAt:""};
    if(!Array.isArray(s.teamInbox.recognitions)) s.teamInbox.recognitions=[];
    if(!Array.isArray(s.recognitionsGiven)) s.recognitionsGiven=[];
    if(!Array.isArray(s.coaching)) s.coaching=[];
    if(!Array.isArray(s.buzz)) s.buzz=[];
    if(!Array.isArray(s.links)) s.links=[];
    if(!Array.isArray(s.contacts)) s.contacts=[];
    if(!Array.isArray(s.coachThread)) s.coachThread=[];
    if(!Array.isArray(s.timeOwedReq)) s.timeOwedReq=[];
    if(!s.toHandled||typeof s.toHandled!=="object") s.toHandled={};
    if(!s.admins||typeof s.admins!=="object") s.admins={};
    if(!Array.isArray(s.assignedAgents)) s.assignedAgents=[];
    s.yourWeek=ywEnsure(s.yourWeek);
    if(s.teamInbox&&!Array.isArray(s.teamInbox.coachMsgs)) s.teamInbox.coachMsgs=[];
    if(s.teamInbox&&!Array.isArray(s.teamInbox.timeOwed)) s.teamInbox.timeOwed=[];
    if(s.teamInbox&&!Array.isArray(s.teamInbox.timeOwedAcks)) s.teamInbox.timeOwedAcks=[];
    if(!s.meta||typeof s.meta!=="object") s.meta={};
    if(!Array.isArray(s.brandRows)) s.brandRows=base.brandRows;
    ["evidence","kb","tasks","goals","learning"].forEach(function(k){ if(!Array.isArray(s[k])) s[k]=base[k]; else ensureAtt(s[k]); });
    if(!s.stats||!Array.isArray(s.stats.weeks)) s.stats={weeks:[]};
    if(!Array.isArray(s.events)) s.events=[];
    if(!Array.isArray(s.audits)) s.audits=base.audits; else ensureAtt(s.audits);
    if(!Array.isArray(s.notes)){ if(Array.isArray(s.diary)){ s.notes=s.diary.map(function(d){return {id:d.id||uid("n"),date:d.date,title:"",text:d.text||"",attachments:[]};}); } else s.notes=base.notes; }
    ensureAtt(s.notes);
    return s;
  }
  var state=seed();

  /* ---------- modal + widgets ---------- */
  var modal=document.getElementById("modal"), modalInner=document.getElementById("modalInner");
  function openModal(html){ modalInner.innerHTML=html; modal.classList.add("show"); }
  function closeModal(){ modal.classList.remove("show"); modalInner.innerHTML=""; }
  modal.addEventListener("click",function(e){ if(e.target===modal) closeModal(); });
  document.addEventListener("keydown",function(e){ if(e.key==="Escape"){ if(document.getElementById("lightbox").classList.contains("show")) closeLightbox(); else if(modal.classList.contains("show")) closeModal(); } });
  function openLightbox(src){ document.getElementById("lightboxImg").src=src; document.getElementById("lightbox").classList.add("show"); }
  function closeLightbox(){ document.getElementById("lightbox").classList.remove("show"); }
  document.getElementById("lightbox").addEventListener("click",closeLightbox);

  function tagWidget(boxEl, arr, onChange){
    var inp=boxEl.querySelector("input");
    function render(){ [].slice.call(boxEl.querySelectorAll(".chip")).forEach(function(c){c.remove();}); arr.forEach(function(t,i){ var c=document.createElement("span"); c.className="chip"; c.textContent=t; var b=document.createElement("button"); b.textContent="✕"; b.addEventListener("click",function(){ arr.splice(i,1); render(); }); c.appendChild(b); boxEl.insertBefore(c,inp); }); if(onChange) onChange(); }
    function add(v){ v=(v||"").trim().replace(/,$/,""); if(v && arr.indexOf(v)<0){ arr.push(v); render(); } }
    inp.addEventListener("keydown",function(e){ if(e.key==="Enter"||e.key===","){ e.preventDefault(); add(this.value); this.value=""; } else if(e.key==="Backspace"&&!this.value&&arr.length){ arr.pop(); render(); } });
    inp.addEventListener("blur",function(){ if(this.value.trim()){ add(this.value); this.value=""; } });
    render(); return { flush:function(){ if(inp.value.trim()){ add(inp.value); inp.value=""; } }, add:add, render:render };

    var monthLbl=calMonth.toLocaleDateString("en-GB",{month:"long",year:"numeric"});

  function generateCheckpoint(half){

    L.push("");

    else { L.push("[No evidence logged in this period yet — add your most satisfying moments here.]"); }
    L.push(""); L.push("**Most challenging aspects**"); L.push("");
    var breached=[];
    state.config.kpis.forEach(function(k){ var a=avg(weeks.map(function(w){ return numericOf(k,(w.vals||{})[k.id]); })); if(a!=null && kpiBreach(k,a)) breached.push(k.label); });
    if(weeks.length && breached.length) L.push("Your figures suggest the toughest areas were: "+breached.join(", ")+". [Reflect on why, and what you did to address it.]");
    else L.push("[Add what you found most challenging this period.]");
    L.push(""); L.push("## OKR Reflection (stats)");

    if(weeks.length){
      state.config.kpis.forEach(function(k){
        var nums=weeks.map(function(w){ return numericOf(k,(w.vals||{})[k.id]); }).filter(function(n){ return n!=null; });
        if(!nums.length){ L.push("**"+k.label+"** — [No figures recorded this period.]"); return; }
        var a=aggVal(k,nums), mn=Math.min.apply(null,nums), mx=Math.max.apply(null,nums);
        var line="**"+k.label+"** — "+(k.type==="int"?"total ":"average ")+fmtKpi(k,a)+" across "+nums.length+" week"+(nums.length===1?"":"s")+" (per week "+fmtKpi(k,mn)+"–"+fmtKpi(k,mx)+")";
        if(k.target!=null) line+= kpiBreach(k,a)? ", which is over your "+fmtKpi(k,k.target)+" target" : ", within your "+fmtKpi(k,k.target)+" target";

    if(auIn.length){
      var asc=auIn.map(function(a){ return typeof a.score==="number"?a.score:parseFloat(a.score); }).filter(function(n){ return !isNaN(n); });
      var avgA=asc.length?Math.round(avg(asc)):null;
      var passN=auIn.filter(function(a){return a.result==="pass";}).length, failN=auIn.filter(function(a){return a.result==="fail";}).length, revN=auIn.filter(function(a){return a.result==="review";}).length;

      L.push("**Audit performance** — average score "+(avgA!=null?avgA+"%":"n/a")+" across "+auIn.length+" audit"+(auIn.length===1?"":"s")+" ("+passN+" pass / "+failN+" fail"+(revN?(" / "+revN+" under review"):"")+")."+(topM.length?(" Most common areas to improve: "+topM.join(", ")+"."):"")+" [Add a line of reflection.]");
    }
    else if(!state.config.kpis.some(function(k){ return /audit/i.test(k.label); })) L.push("**Audit performance** — [No audits logged this period — add them in the Audits section, or note your QA score here.]");
    L.push(""); L.push("## Our Values");
    CHK_VALUES.forEach(function(v){
      L.push(""); L.push("### "+v.name+" — *how do you feel you are doing in demonstrating this value?*"); L.push("");
      L.push("I demonstrate "+v.name+" through "+v.desc+".");

  /* ================= TRENDS (team view) ================= */
  function mondayKey(d){ return (typeof mondayOf==="function")?mondayOf(d):d; }
  function prevBounds(){ var n=new Date(); n.setHours(0,0,0,0);
    if(teamRange==="month") return {s:new Date(n.getFullYear(),n.getMonth()-1,1), e:new Date(n.getFullYear(),n.getMonth(),1)};
    if(teamRange==="half"){ return n.getMonth()<6?{s:new Date(n.getFullYear()-1,6,1), e:new Date(n.getFullYear(),0,1)}:{s:new Date(n.getFullYear(),0,1), e:new Date(n.getFullYear(),6,1)}; }
    if(teamRange==="year") return {s:new Date(n.getFullYear()-1,0,1), e:new Date(n.getFullYear(),0,1)};
    return null; }
  function inPrev(d){ var b=prevBounds(); if(!b||!d) return false; var dt=new Date(d); return !isNaN(dt)&&dt>=b.s&&dt<b.e; }
  function winSpan(keys){ if(!keys.length) return "no data"; var n=keys.length; return n+" wk"+(n===1?"":"s")+(n>1?(" · "+fmtShort(keys[0])+"–"+fmtShort(keys[n-1])):(" · "+fmtShort(keys[0]))); }
  function teamAuditTrend(){ var byWk={}; TEAMROSTER.forEach(function(a){ (a.audits||[]).forEach(function(x){ if(x.score==null||!x.date) return; var wk=mondayKey(x.date); (byWk[wk]=byWk[wk]||[]).push(x.score); }); });
    var keys=trendSlice(Object.keys(byWk));
    var points=keys.map(function(k){ var arr=byWk[k]; var avg=Math.round(arr.reduce(function(s,v){return s+v;},0)/arr.length); return {label:fmtShort(k),value:avg,disp:avg+"%"}; });
    var all=[]; keys.forEach(function(k){ byWk[k].forEach(function(v){all.push(v);}); });
    var agg=all.length?Math.round(all.reduce(function(s,v){return s+v;},0)/all.length):null;
    return {points:points, value:agg, disp:agg!=null?agg+"%":"—", sub:"avg of "+all.length+" audits · "+winSpan(keys), pct:true, kind:"audit"}; }
  function teamPassRateTrend(){ var byWk={}; TEAMROSTER.forEach(function(a){ (a.audits||[]).forEach(function(x){ if(!x.date||(x.result!=="pass"&&x.result!=="fail")) return; var wk=mondayKey(x.date); var o=byWk[wk]=byWk[wk]||{p:0,t:0}; o.t++; if(x.result==="pass") o.p++; }); });
    var keys=trendSlice(Object.keys(byWk));
    var points=keys.map(function(k){ var o=byWk[k]; var v=Math.round(o.p/o.t*100); return {label:fmtShort(k),value:v,disp:v+"%"}; });
    var tp=0,tt=0; keys.forEach(function(k){ tp+=byWk[k].p; tt+=byWk[k].t; });
    var agg=tt?Math.round(tp/tt*100):null;
    return {points:points, value:agg, disp:agg!=null?agg+"%":"—", sub:tp+" of "+tt+" passed · "+winSpan(keys), pct:true, kind:"pass"}; }
  function teamKpiTrend(k){ var byWk={}; TEAMROSTER.forEach(function(a){ (a.weeks||[]).forEach(function(w){ var v=numOf(k,(w.vals||{})[k.id]); if(v==null) return; (byWk[w.weekOf]=byWk[w.weekOf]||[]).push(v); }); });
    var isCount=k.type!=="dur", sumDur=(k.id==="breaks"||k.sumDur), keys=trendSlice(Object.keys(byWk));
    var points=keys.map(function(key){ var arr=byWk[key]; var tot=arr.reduce(function(s,v){return s+v;},0); var val=(isCount||sumDur)?tot:Math.round(tot/arr.length); return {label:fmtShort(key),value:val,disp:isCount?String(Math.round(val)):fmtKpiVal(k,val)}; });
    var all=[]; keys.forEach(function(key){ byWk[key].forEach(function(v){all.push(v);}); });
    var aggVal=null, disp="—", sub="no data · "+winSpan(keys);
    if(all.length){ if(isCount||sumDur){ var sum=all.reduce(function(s,v){return s+v;},0); aggVal=sum; disp=isCount?String(Math.round(sum)):fmtKpiVal(k,Math.round(sum)); sub="team total · "+winSpan(keys); } else { var mean=all.reduce(function(s,v){return s+v;},0)/all.length; aggVal=mean; disp=fmtKpiVal(k,Math.round(mean)); sub="team avg · "+winSpan(keys); } }
    return {points:points, value:aggVal, disp:disp, sub:sub, lower:k.lower, kind:"kpi", kpiId:k.id, isCount:isCount}; }
  function trendBars(points){ if(!points.length) return '<div class="empty" style="padding:14px">Not enough history yet \u2014 a few weeks of data will fill this in.</div>';
    var max=Math.max.apply(null,points.map(function(p){return p.value;}))||1;
    return '<div class="bars">'+points.map(function(p){ var h=Math.max(4,Math.round(p.value/max*130)); return '<div class="bcol"><div class="bv">'+esc(p.disp)+'</div><div class="bar" style="height:'+h+'px"></div><div class="bl">'+esc(p.label)+'</div></div>'; }).join("")+'</div>'; }
  function trendArrow(cur,prev){ if(cur==null||prev==null) return ''; var d=cur-prev; if(Math.abs(d)<0.5) return ' <span class="trend flat">\u2192 0</span>'; var up=d>0; return ' <span class="trend '+(up?"up":"down")+'">'+(up?"\u25b2":"\u25bc")+' '+(up?"+":"")+Math.round(d)+'</span>'; }
  function sparkline(points,opts){ opts=opts||{}; var col=opts.color||"var(--a2)";
    if(!points || points.length<2) return '<div style="height:34px"></div>';
    var vals=points.map(function(p){return p.value;}); var mn=Math.min.apply(null,vals), mx=Math.max.apply(null,vals), rng=(mx-mn)||1, n=points.length, W=100,H=30;
    var pts=points.map(function(p,i){ var x=(i/(n-1))*W; var y=H-((p.value-mn)/rng)*(H-7)-3.5; return [x,y]; });
    var line=pts.map(function(p,i){return (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1);}).join(' ');
    var area='M0 '+H+' '+pts.map(function(p){return 'L'+p[0].toFixed(1)+' '+p[1].toFixed(1);}).join(' ')+' L'+W+' '+H+' Z';
    var last=pts[n-1];
    return '<svg viewBox="0 0 100 30" preserveAspectRatio="none" style="width:100%;height:34px;display:block;overflow:visible">'
      +'<path d="'+area+'" fill="'+col+'" opacity="0.13"/>'
      +'<path d="'+line+'" fill="none" stroke="'+col+'" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>'
      +'<circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="2.4" fill="'+col+'"/></svg>'; }
  function trendDelta(cur,prev,lowerBetter,pct){ if(cur==null||prev==null) return ''; var d=cur-prev; if(Math.abs(d)<0.5) return '<span class="trend flat">\u2192 0</span>'; var improving=lowerBetter?d<0:d>0; var v=(d>0?"+":"")+Math.round(d)+(pct?"%":""); return '<span class="trend '+(improving?"up":"down")+'">'+(d>0?"\u25b2":"\u25bc")+' '+v+'</span>'; }
  function trendCard(title, A){ if(!A || !A.points || !A.points.length) return '';
    var pts=A.points, first=pts[0], last=pts[pts.length-1];
    var delta=pts.length>1? trendDelta(last.value, first.value, !!A.lower, !!A.pct) : '';
    var dataAttr=A.kind?(' data-trend="'+A.kind+'"'+(A.kpiId?(' data-kpi="'+esc(A.kpiId)+'"'):'')):'';
    return '<div class="tcard'+(A.kind?' click':'')+'"'+dataAttr+'><div class="tc-lbl" title="'+esc(title)+'">'+esc(title)+'</div>'
      +'<div class="tc-row"><span class="tc-val">'+esc(A.disp)+'</span>'+delta+'</div>'
      +sparkline(pts,{})
      +'<div class="tc-foot">'+esc(A.sub||"")+(A.kind?' \u00b7 tap to break down':'')+'</div></div>'; }
  function teamTrendsHTML(){

  function bigTrendChart(points, col){ col=col||"var(--a2)";

  /* per-agent breakdown + expanded chart \u2014 aggregated over the SELECTED window */
  function openTrendBreakdown(kind, kpiId){
    var defs=teamKpiDefs(), title, overallDisp, note="", rows=[], span="";
    var kk=kind==="kpi"?defs.filter(function(d){return d.id===kpiId;})[0]:null;
    if(kind==="kpi"&&!kk){ toast("Unknown metric."); return; }
    var A=kind==="audit"?teamAuditTrend():kind==="pass"?teamPassRateTrend():teamKpiTrend(kk);
    if(kind==="audit" || kind==="pass"){
      var byWk={}; TEAMROSTER.forEach(function(a){ (a.audits||[]).forEach(function(x){ if(!x.date) return; if(kind==="audit"&&x.score==null) return; if(kind==="pass"&&x.result!=="pass"&&x.result!=="fail") return; var wk=mondayKey(x.date); (byWk[wk]=byWk[wk]||[]).push({a:a,x:x}); }); });
      var keys=trendSlice(Object.keys(byWk)); if(!keys.length){ toast("No audit data in "+trendWinLabel()+"."); return; }
      span=winSpan(keys); var inWin={}; keys.forEach(function(k){ inWin[k]=1; });
      var per={}; keys.forEach(function(wk){ byWk[wk].forEach(function(o){ var id=o.a.agentId; per[id]=per[id]||{name:o.a.agentName||id, scores:[], p:0, f:0}; if(kind==="audit"&&o.x.score!=null) per[id].scores.push(o.x.score); if(kind==="pass"){ if(o.x.result==="pass") per[id].p++; else if(o.x.result==="fail") per[id].f++; } }); });
      if(kind==="audit"){ title="Team audit score"; var all=[]; Object.keys(per).forEach(function(id){ var s=per[id].scores; if(!s.length) return; var avg=Math.round(s.reduce(function(x,y){return x+y;},0)/s.length); s.forEach(function(v){all.push(v);}); rows.push({name:per[id].name, disp:avg+"%", sub:s.length+" audit"+(s.length===1?"":"s")}); });
        overallDisp=all.length?Math.round(all.reduce(function(x,y){return x+y;},0)/all.length)+"%":"\u2014"; note="Overall = mean of every audit score in the window ("+all.length+" audits). Each agent's value is their own average over the window."; }
      else { title="Audit pass rate"; var tp=0,tf=0; Object.keys(per).forEach(function(id){ var o=per[id], t=o.p+o.f; if(!t) return; tp+=o.p; tf+=o.f; rows.push({name:o.name, disp:Math.round(o.p/t*100)+"%", sub:o.p+" pass \u00b7 "+o.f+" fail"}); });
        overallDisp=(tp+tf)?Math.round(tp/(tp+tf)*100)+"%":"\u2014"; note="Overall = total passes \u00f7 (passes + fails) over the window ("+tp+" / "+(tp+tf)+")."; }
    } else {
      var k=defs.filter(function(d){return d.id===kpiId;})[0]; if(!k){ toast("Unknown metric."); return; }
      var byWk2={}; TEAMROSTER.forEach(function(a){ (a.weeks||[]).forEach(function(w){ var v=numOf(k,(w.vals||{})[k.id]); if(v==null) return; (byWk2[w.weekOf]=byWk2[w.weekOf]||[]).push({id:a.agentId,name:a.agentName||a.agentId, v:v}); }); });

      if(!/^\d{4}-\d{2}-\d{2}$/.test(wk)){ var d=new Date(wk); if(isNaN(d.getTime())) continue; wk=d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
      var vals={};
      cols.forEach(function(c,idx){ if(idx===dateIdx) return; var k=kpiById[c]; if(!k) return; var raw=(parts[idx]||"").trim(); if(raw==="") return; vals[k.id]=raw; });
      var existing=state.stats.weeks.filter(function(w){return w.weekOf===wk;})[0];
      if(existing){ existing.vals=Object.assign(existing.vals||{},vals); updated++; }
      else { state.stats.weeks.push({id:uid("w"),weekOf:wk,vals:vals}); added++; }
    }
    if(!added&&!updated){ toast("No rows matched — check the date format."); return; }
    save(); closeModal(); toast("Imported "+added+" new, "+updated+" updated."); if(renderers.stats) renderers.stats();
  }

  /* ----- manager: team freshness + outlier flags + coaching count ----- */
  function enhAgentHealth(a){
    // Composite: pass rate (0.4) + audit average (0.3) + % of KPIs on target (0.3),
    // re-weighted across whichever components have data. Better signal than audit score alone.
    var au=fAudits(a), avg=auAvgOf(au), rate=passRateOf(au);
    var defs=(a.kpiDefs&&a.kpiDefs.length)?a.kpiDefs:teamKpiDefs(), wk=fWeeks(a), onT=0, cnt=0;
    defs.forEach(function(k){ if(k.target==null) return; var vals=[]; wk.forEach(function(w){ var v=numOf(k,(w.vals||{})[k.id]); if(v!=null) vals.push(v); }); if(!vals.length) return; cnt++; var mean=vals.reduce(function(s,v){return s+v;},0)/vals.length; if(k.lower?mean<=k.target:mean>=k.target) onT++; });
    var statsPct=cnt?Math.round(onT/cnt*100):null;
    var parts=[], w=[];
    if(rate!=null){ parts.push(rate); w.push(0.4); }
    if(avg!=null){ parts.push(avg); w.push(0.3); }
    if(statsPct!=null){ parts.push(statsPct); w.push(0.3); }
    if(!parts.length) return null;
    var wsum=w.reduce(function(s,v){return s+v;},0);
    var score=Math.round(parts.reduce(function(s,v,i){return s+v*w[i];},0)/wsum);
    return {score:score, avg:avg, rate:rate, statsPct:statsPct, onT:onT, cnt:cnt};
  }
  function enhAgentFlags(a){
    var flags=[];
    var days=a.updatedAt?Math.floor((Date.now()-new Date(a.updatedAt).getTime())/86400000):999;
    if(days>=7) flags.push('<span class="enh-flag stale" title="No fresh share in '+days+' days">stale '+days+'d</span>');
    try{
      if(typeof inPrev==="function"){ var au=fAudits(a), avg=auAvgOf(au); var pv=[]; (a.audits||[]).forEach(function(x){ if(inPrev(x.date)&&x.score!=null) pv.push(x.score); });
        var pa=pv.length?Math.round(pv.reduce(function(s,v){return s+v;},0)/pv.length):null;
        if(avg!=null && pa!=null && avg<pa-3) flags.push('<span class="enh-flag warn">declining</span>'); }
    }catch(e){}
    var oc=(state.coaching||[]).filter(function(c){ return c.agentId===a.agentId && c.status!=="resolved"; }).length;
    if(oc) flags.push('<span class="enh-flag warn">'+oc+' open coaching</span>');
    return flags.join("");
  }
  function enhWrapTeam(){
    if(renderers.team && !renderers.team._enh){
      var orig=renderers.team;
      renderers.team=function(){ orig.apply(this,arguments); enhTeamCards(); enh11Button(); try{ publishManagerPresence(); }catch(e){} };
      renderers.team._enh=true;
    }
  }
  function enhTeamCards(){
    var grid=document.getElementById("teamGrid"); if(!grid||typeof TEAMROSTER==="undefined") return;
    grid.querySelectorAll(".agent-card[data-aid]").forEach(function(card){
      if(card.querySelector(".enh-cardmeta")) return;
      var a=null; for(var i=0;i<TEAMROSTER.length;i++){ if(TEAMROSTER[i].agentId===card.getAttribute("data-aid")){ a=TEAMROSTER[i]; break; } }
      if(!a) return;
      var meta=document.createElement("div"); meta.className="enh-cardmeta"; meta.style.cssText="margin-top:10px;padding-top:10px;border-top:1px solid var(--line-soft)";
      var flags=enhAgentFlags(a);
      meta.innerHTML='<div style="font-size:11.5px;color:var(--ink-faint)">shared '+esc(fmtAgo(a.updatedAt))+'</div>'+(flags?('<div style="margin-top:2px">'+flags+'</div>'):'');
      card.appendChild(meta);
    });
  }
  /* ----- manager: coaching aging ----- */
  function enhWrapCoaching(){
    if(renderers.coaching && !renderers.coaching._enh){
      var orig=renderers.coaching;
      renderers.coaching=function(){ orig.apply(this,arguments); enhCoachingAging(); };
      renderers.coaching._enh=true;
    }
  }
  function enhCoachingAging(){
    var sec=document.getElementById("sec-coaching"); if(!sec) return;
    sec.querySelectorAll("[data-edit]").forEach(function(b){
      var card=b.closest(".item"); if(!card||card.querySelector(".enh-age")) return;
      var id=b.getAttribute("data-edit");
      var c=(state.coaching||[]).filter(function(x){return x.id===id;})[0]; if(!c||c.status==="resolved"||!c.created) return;
      var days=Math.floor((Date.now()-new Date(c.created+"T00:00:00").getTime())/86400000); if(isNaN(days)) return;
      var cls=days>=14?"bad":days>=7?"warn":"ok";
      var s=document.createElement("span"); s.className="enh-flag enh-age "+cls; s.textContent="open "+days+"d"; s.style.marginLeft="6px";
      var top=card.querySelector(".top")||card; top.appendChild(s);
    });
  }
  /* ----- manager: recognition equity ----- */
  function enhWrapRecognition(){
    if(renderers.recognition && !renderers.recognition._enh){
      var orig=renderers.recognition;
      renderers.recognition=function(){ orig.apply(this,arguments); if(isManager()) enhEquity(); };
      renderers.recognition._enh=true;
    }
  }
  function enhEquity(){
    var sec=document.getElementById("sec-recognition"); if(!sec||sec.querySelector(".enh-equity-card")) return;
    var counts={}, given=state.recognitionsGiven||[];
    given.forEach(function(r){ var n=r.agentName||r.agentId||"?"; counts[n]=(counts[n]||0)+1; });
    var roster=(typeof TEAMROSTER!=="undefined"?TEAMROSTER:[]);
    roster.forEach(function(a){ var n=a.agentName||a.agentId; if(counts[n]==null) counts[n]=0; });
    var entries=Object.keys(counts).map(function(n){return {n:n,c:counts[n]};}).sort(function(a,b){return b.c-a.c;});
    if(!entries.length) return;
    var max=Math.max.apply(null,entries.map(function(e){return e.c;}))||1;
    var none=entries.filter(function(e){return e.c===0;}).length;
    var card=document.createElement("div"); card.className="enh-card enh-equity-card";
    card.innerHTML='<h3>Recognition equity</h3><div style="font-size:13px;color:var(--ink-soft)">Make sure praise is spread fairly'
      +(none?(' — <b style="color:var(--ink)">'+none+'</b> agent'+(none===1?"":"s")+' haven’t been recognised yet'):'')+'.</div>'
      +'<div class="enh-equity">'+entries.map(function(e){
        return '<div class="row"><span class="nm">'+esc(e.n)+'</span><span class="bar" style="width:'+Math.max(3,Math.round(e.c/max*180))+'px'+(e.c===0?';background:var(--line);min-width:0;width:0':'')+'"></span><span class="ct">'+e.c+'</span></div>';
      }).join("")+'</div>';
    sec.appendChild(card);
  }
  /* ----- manager: 1:1 prep packet ----- */
  function enh11Button(){
    var actions=document.querySelector("#sec-team .vhead .actions");
    if(!actions || typeof teamSel==="undefined" || !teamSel || document.getElementById("enh11")) return;
    var b=document.createElement("button"); b.className="btn"; b.id="enh11"; b.textContent="📋 1:1 prep";
    b.title="Build a one-page briefing for your next 1:1"; actions.insertBefore(b, actions.firstChild);
    b.onclick=function(){ enhOpen11(teamSel); };
  }
  function enhBuild11(a){
    var L=[]; var name=a.agentName||a.agentId;
    L.push("# 1:1 prep — "+name);
    L.push("_"+(a.role||"Agent")+" · "+(typeof rangeLabel==="function"?rangeLabel():"")+" · generated "+fmtDate(todayISO())+"_");
    L.push("");
    try{
      var au=fAudits(a), wk=fWeeks(a), avg=auAvgOf(au), rate=passRateOf(au);
      L.push("## Performance");
      L.push("- Audit average: "+(avg!=null?avg+"%":"—")+"  |  Pass rate: "+(rate!=null?rate+"%":"—")+"  |  "+au.length+" audits, "+wk.length+" weeks");
      var fails=au.filter(function(x){return x.result==="fail";});
      if(fails.length){ L.push("- Recent audit fails:"); fails.slice(-5).forEach(function(x){ L.push("  - "+fmtShort(x.date)+" · "+(x.form||"Audit")+(x.score!=null?(" ("+x.score+"%)"):"")+(x.notes?(" — "+x.notes):"")); }); }
      var defs=(a.kpiDefs&&a.kpiDefs.length)?a.kpiDefs:(typeof teamKpiDefs==="function"?teamKpiDefs():[]);
      var statLines=defs.map(function(k){ var vals=[]; wk.forEach(function(w){ var v=numOf(k,(w.vals||{})[k.id]); if(v!=null) vals.push(v); }); if(!vals.length) return null;
        var mean=vals.reduce(function(s,v){return s+v;},0)/vals.length; var onT=k.target!=null?(k.lower?mean<=k.target:mean>=k.target):null;
        return "- "+k.label+": "+(k.type==="dur"?(typeof fmtKpiVal==="function"?fmtKpiVal(k,Math.round(mean)):Math.round(mean)):(Math.round(mean*10)/10))+(k.target!=null?(" (target "+(typeof fmtKpiVal==="function"?fmtKpiVal(k,k.target):k.target)+(onT?" ✓":" ✗")+")"):""); }).filter(Boolean);
      if(statLines.length){ L.push(""); L.push("## Stats — "+(typeof rangeLabel==="function"?rangeLabel():"period")); statLines.forEach(function(s){L.push(s);}); }
    }catch(e){}
    var open=(state.coaching||[]).filter(function(c){return c.agentId===a.agentId && c.status!=="resolved";});
    if(open.length){ L.push(""); L.push("## Open coaching"); open.forEach(function(c){ var d=c.created?Math.floor((Date.now()-new Date(c.created+"T00:00:00").getTime())/86400000):null; L.push("- "+(c.focus||"Coaching")+(d!=null?(" (open "+d+"d)"):"")+(c.note?(" — "+c.note):"")); }); }
    if(a.goals&&a.goals.length){ L.push(""); L.push("## Development goals"); a.goals.forEach(function(g){ L.push("- ["+(g.status==="dn"?"done":g.status==="ip"?"in progress":"not started")+"] "+(g.title||"")+(g.due?(" (due "+fmtShort(g.due)+")"):"")); }); }
    L.push(""); L.push("## Talking points / actions");
    L.push("- ");
    return L.join("\n");
  }
  function enhOpen11(aid){
    var a=null; for(var i=0;i<TEAMROSTER.length;i++){ if(TEAMROSTER[i].agentId===aid){ a=TEAMROSTER[i]; break; } }
    if(!a){ toast("Select an agent first."); return; }
    var md=enhBuild11(a);
    openModal('<h3 style="font-family:var(--disp);margin-bottom:6px">1:1 prep — '+esc(a.agentName||a.agentId)+'</h3>'
      +'<p style="font-size:13px;color:var(--ink-soft);margin-bottom:10px">An auto-assembled briefing pulling their stats, audits, open coaching and goals. Copy it, download it, or paste into your notes.</p>'
      +'<textarea id="enh11Txt" class="ta" style="width:100%;min-height:240px;font-family:monospace;font-size:12.5px">'+esc(md)+'</textarea>'
      +'<div style="display:flex;gap:8px;margin-top:12px"><span style="flex:1"></span><button class="btn" id="enh11Close">Close</button><button class="btn" id="enh11Dl">Download</button><button class="btn primary" id="enh11Copy">Copy</button></div>');
    document.getElementById("enh11Close").onclick=closeModal;
    document.getElementById("enh11Copy").onclick=function(){ var t=document.getElementById("enh11Txt"); t.select(); try{ document.execCommand("copy"); }catch(e){} if(navigator.clipboard){ navigator.clipboard.writeText(t.value).catch(function(){}); } toast("Copied to clipboard."); };
    document.getElementById("enh11Dl").onclick=function(){ download("1to1 "+((a.agentName||a.agentId).replace(/\s+/g,"_"))+" "+todayISO()+".md", document.getElementById("enh11Txt").value, "text/markdown"); };
  }

  function boot(){
    if(!("indexedDB" in window)){ useLS=true; try{ var ls=localStorage.getItem(KEY); state=ls?migrate(JSON.parse(ls)):seed(); }catch(e){ state=seed(); } save(); start(); return; }
    idbGet().then(function(v){
      if(v){ state=migrate(v); save(); start(); return; }
      // new manager store empty: one-time migrate from the legacy shared store, then legacy localStorage
      idbGetFrom("agentHubDB").then(function(legacy){
        if(legacy){ state=migrate(legacy); }
        else { try{ var old=localStorage.getItem(KEY)||localStorage.getItem("agentHub.v3")||localStorage.getItem("agentHub.v2"); state=old?migrate(JSON.parse(old)):seed(); }catch(e){ state=seed(); } }
        save(); start();
      });
    }).catch(function(){ useLS=true; try{ var ls=localStorage.getItem(KEY)||localStorage.getItem("agentHub.v3"); state=ls?migrate(JSON.parse(ls)):seed(); }catch(e){ state=seed(); } start(); });
  }
  boot();
})();
</script>

  @media(max-width:920px){.grid{grid-template-columns:1fr}}

  .pill.time{background:#eaeef2;color:var(--ink);border:1px solid #dde3ea} .pill.off{background:var(--slate-wash);color:var(--slate)} .pill.hol{background:var(--amber-wash);color:var(--amber)}

  .link{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:#fff;border-radius:11px;padding:11px 13px;transition:.16s;font-weight:600;font-size:13.5px}
  .link:hover{border-color:var(--teal);background:var(--teal-wash);transform:translateY(-1px);box-shadow:0 6px 16px -10px rgba(14,124,107,.5)}
