<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DigiPet · Tamer</title>
<meta name="theme-color" content="#0d1326">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b1020; --bg2:#121a33; --panel:#161f3c; --panel2:#1d2950;
    --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16);
    --ink:#eef2ff; --ink-soft:#9aa6cc; --ink-faint:#6b7699;
    --acc:#ff8a3d; --acc2:#ffb15c; --blue:#5b8cff; --teal:#27e0c4; --pink:#ff5d92;
    --good:#37d67a; --bad:#ff5168;
    --r:18px; --sh:0 14px 40px -16px rgba(0,0,0,.7);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:'Outfit',system-ui,-apple-system,sans-serif;color:var(--ink);
    background:
      radial-gradient(120% 90% at 15% -10%,rgba(91,140,255,.18),transparent 55%),
      radial-gradient(120% 90% at 100% 0%,rgba(255,138,61,.16),transparent 50%),
      linear-gradient(180deg,#0c1224,#080c18 70%);
    min-height:100vh;overflow-x:hidden;
  }
  .app{max-width:980px;margin:0 auto;padding:18px 16px 40px;}
  .hidden{display:none!important;}

  /* ---------- shared bits ---------- */
  h1.title{font-size:26px;font-weight:800;letter-spacing:.3px;}
  .sub{color:var(--ink-soft);font-size:14px;margin-top:2px;}
  .head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px;gap:12px;}
  .logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:1px;}
  .logo .dot{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--acc),var(--pink));
    box-shadow:0 6px 16px -6px var(--acc);display:grid;place-items:center;font-size:15px;}
  .btn{border:none;border-radius:14px;padding:13px 18px;font-family:inherit;font-weight:700;font-size:15px;
    cursor:pointer;transition:transform .08s,filter .15s,background .2s;color:#fff;}
  .btn:active{transform:translateY(1px) scale(.99);}
  .btn.primary{background:linear-gradient(135deg,var(--acc),#ff6f3d);box-shadow:0 12px 26px -10px var(--acc);}
  .btn.primary:disabled{filter:grayscale(.6) brightness(.7);cursor:not-allowed;box-shadow:none;}
  .btn.ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--line2);}
  .btn.sm{padding:9px 12px;font-size:13px;border-radius:11px;}

  .card{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);
    border-radius:var(--r);box-shadow:var(--sh);}
  .card .ttl{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;letter-spacing:1.5px;
    text-transform:uppercase;color:var(--ink-soft);padding:14px 16px 0;}
  .card .ttl b{color:var(--acc2);}

  /* ---------- creation layout ---------- */

  .preview{display:grid;place-items:center;padding:18px 10px 6px;}
  canvas.device{width:150px;height:206px;image-rendering:pixelated;}

  .rowctrl{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 14px;}
  .rowctrl .lab{font-size:13px;color:var(--ink-soft);font-weight:600;min-width:54px;}
  .stepper{display:flex;align-items:center;gap:8px;flex:1;justify-content:center;}
  .stepper .name{min-width:96px;text-align:center;font-weight:700;font-size:14px;}
  .arrow{width:34px;height:34px;border-radius:10px;background:var(--panel2);border:1px solid var(--line2);
    color:var(--ink);font-size:17px;cursor:pointer;display:grid;place-items:center;}
  .arrow:active{transform:scale(.94);}
  .swatch{width:30px;height:30px;border-radius:9px;border:2px solid var(--line2);cursor:pointer;flex:0 0 auto;
    box-shadow:inset 0 0 0 2px rgba(0,0,0,.25);}
  .swatch.wheelbtn{background:conic-gradient(#ff5168,#ffb15c,#37d67a,#27e0c4,#5b8cff,#b06bff,#ff5d92,#ff5168);}

  .dots{display:flex;gap:6px;justify-content:center;padding:6px 0 12px;}
  .dots i{width:8px;height:8px;border-radius:50%;background:var(--line2);transition:.2s;}
  .dots i.on{background:var(--acc);width:20px;border-radius:5px;}

  .namebar{margin-top:16px;display:flex;gap:12px;align-items:center;}
  .namebar input{flex:1;background:var(--panel);border:1px solid var(--line2);border-radius:14px;
    padding:15px 16px;color:var(--ink);font-family:inherit;font-size:16px;font-weight:600;outline:none;}
  .namebar input:focus{border-color:var(--acc);}
  .namebar input::placeholder{color:var(--ink-faint);}

  .devname{text-align:center;font-weight:800;font-size:15px;margin-top:2px;}
  .devseries{text-align:center;color:var(--ink-faint);font-size:12px;margin-top:1px;}

  /* ---------- color wheel modal ---------- */
  .modal{position:fixed;inset:0;background:rgba(4,7,16,.72);backdrop-filter:blur(4px);z-index:50;
    display:grid;place-items:center;padding:20px;}
  .wheelbox{background:var(--panel);border:1px solid var(--line2);border-radius:20px;padding:20px;width:300px;
    box-shadow:var(--sh);text-align:center;}
  .wheelbox h3{font-size:14px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-soft);margin-bottom:14px;}
  .wheelwrap{position:relative;width:220px;height:220px;margin:0 auto;}
  canvas.wheel{width:220px;height:220px;cursor:crosshair;border-radius:50%;}
  .wheelcursor{position:absolute;width:16px;height:16px;border:3px solid #fff;border-radius:50%;
    transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 0 0 1px rgba(0,0,0,.6);}
  .brightrow{display:flex;align-items:center;gap:10px;margin:16px 0 6px;}
  .brightrow input{flex:1;}
  .chip{width:30px;height:30px;border-radius:8px;border:2px solid var(--line2);}
  input[type=range]{-webkit-appearance:none;height:8px;border-radius:6px;
    background:linear-gradient(90deg,#000,#fff);outline:none;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;
    background:#fff;border:2px solid var(--acc);cursor:pointer;}
  .wheelbtns{display:flex;gap:10px;margin-top:8px;}
  .wheelbtns .btn{flex:1;}

  /* ---------- home dashboard ---------- */
  #home .tamerbar{display:flex;align-items:center;gap:14px;padding:14px;}
  #home .who{flex:1;}
  #home .who .nm{font-size:20px;font-weight:800;}
  #home .who .rk{color:var(--acc2);font-size:13px;font-weight:700;letter-spacing:.5px;}
  #home canvas.deviceMini{width:54px;height:74px;image-rendering:pixelated;flex:0 0 auto;}
  .dash{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px;}
  @media (max-width:560px){ .dash{grid-template-columns:repeat(2,1fr);} }
  .tile{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);
    border-radius:16px;padding:18px 14px;cursor:pointer;transition:transform .1s,border-color .15s;
    display:flex;flex-direction:column;gap:8px;min-height:104px;}
  .tile:active{transform:translateY(2px);}
  .tile:hover{border-color:var(--line2);}
  .tile .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;}
  .tile .ic svg{width:22px;height:22px;}
  .tile .tn{font-weight:700;font-size:15px;}
  .tile .td{font-size:12px;color:var(--ink-faint);}
  .tile .soon{font-size:10px;font-weight:800;color:var(--acc2);letter-spacing:1px;}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);opacity:0;
    background:var(--panel2);border:1px solid var(--line2);color:var(--ink);padding:12px 18px;border-radius:14px;
    font-weight:600;z-index:60;transition:.25s;pointer-events:none;box-shadow:var(--sh);}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="app">

  <!-- ============================ CREATOR ============================ -->
  <section id="creator">
    <div class="head">
      <div>
        <h1 class="title">Begin Your Journey</h1>
        <div class="sub">Choose your name and Digivice model to start.</div>
      </div>
      <div class="logo"><span class="dot">◆</span> DIGI·PET</div>
    </div>

    <div class="card" style="max-width:500px;margin:0 auto;">
      <div class="ttl"><b>◆</b> Setup</div>

      <div style="padding:16px 14px">
        <label style="display:block;font-size:13px;color:var(--ink-soft);font-weight:600;margin-bottom:8px;letter-spacing:.5px">Your Name</label>
        <input id="nameInput" maxlength="12" placeholder="Enter your name…" autocomplete="off" style="width:100%">
      </div>

      <div class="preview"><canvas class="device" id="devCanvas" width="64" height="88"></canvas></div>
      <div class="devname" id="devName">Digivice</div>
      <div class="devseries" id="devSeries">Adventure</div>
      <div class="dots" id="devDots"></div>

      <div class="rowctrl">
        <button class="arrow" data-step="device" data-d="-1">‹</button>
        <div class="stepper"><span class="name" style="min-width:120px">Model</span></div>
        <button class="arrow" data-step="device" data-d="1">›</button>
      </div>

      <div class="rowctrl" style="justify-content:center;gap:12px;padding-bottom:16px">
        <span class="lab" style="min-width:auto">Colour</span>
        <div class="swatch wheelbtn" id="devColor" title="Device colour" style="width:34px;height:34px"></div>
        <span id="devHex" style="font-size:12px;color:var(--ink-faint);font-weight:700">#5b8cff</span>
      </div>

      <div style="padding:0 14px 14px">
        <button class="btn primary" id="beginBtn" disabled style="width:100%">Begin Adventure ›</button>
      </div>
    </div>
  </section>

  <!-- ============================ HOME ============================ -->
  <section id="home" class="hidden">
    <div class="head">
      <div class="logo"><span class="dot">◆</span> DIGI·PET</div>
      <button class="btn ghost sm" id="editBtn">Edit Setup</button>
    </div>
    <div class="card tamerbar">
      <div class="who">
        <div class="nm" id="homeName">—</div>
        <div class="rk" id="homeRank">Rookie Tamer · Lv.1</div>
        <div class="sub" id="homeDev">—</div>
      </div>
      <canvas class="deviceMini" id="homeDev2" width="64" height="88"></canvas>
    </div>
    <div class="dash" id="dash"></div>
  </section>

  <!-- color wheel modal -->
  <div class="modal hidden" id="wheelModal">
    <div class="wheelbox">
      <h3 id="wheelTitle">Pick a colour</h3>
      <div class="wheelwrap">
        <canvas class="wheel" id="wheelCv" width="220" height="220"></canvas>
        <div class="wheelcursor" id="wheelCur"></div>
      </div>
      <div class="brightrow">
        <span style="font-size:12px;color:var(--ink-faint)">Bright</span>
        <input type="range" id="brightSlider" min="20" max="100" value="100">
        <div class="chip" id="wheelChip"></div>
      </div>
      <div class="wheelbtns">
        <button class="btn ghost" id="wheelCancel">Cancel</button>
        <button class="btn primary" id="wheelApply">Apply</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
"use strict";
/* ========================================================================
   DigiPet — Setup + home dashboard.
   Simplified name entry + Digivice model selection with HSV colour wheel.
   Saves to localStorage.
   ====================================================================== */

/* ---------- option data ---------- */
const DEVICES = [
  {id:'classic', n:'D-1 Classic',  series:'Adventure', def:'#e8eef7', screen:'#9bbc0f'},
  {id:'d3',      n:'D-3',          series:'Adventure 02', def:'#ffffff', screen:'#79d2ff'},
  {id:'dark',    n:'D-Ark',        series:'Tamers', def:'#2b3550', screen:'#7fe0c0'},
  {id:'scanner', n:'D-Scanner',    series:'Frontier', def:'#9a9aa6', screen:'#ffd23f'},
  {id:'xros',    n:'Xros Loader',  series:'Xros Wars', def:'#e23b3b', screen:'#bff0ff'},
  {id:'vital',   n:'Vital Bracelet',series:'Modern', def:'#1c1c22', screen:'#39ff9d'},
];

/* ---------- creation state ---------- */
let T = {
  name:'', devIdx:0, devColor:DEVICES[0].def,
};
const SAVE_KEY = 'digipet.tamer.v3';

/* ===================================================================== */
/*  PIXEL HELPERS                                                         */
/* ===================================================================== */
function px(c,x,y,w,h,col){ c.fillStyle=col; c.fillRect(x,y,w,h); }
function shade(hex,amt){ // darken (amt<0) / lighten (amt>0) a #rrggbb by amt (-1..1)
  const n=parseInt(hex.slice(1),16);
  const R=(n>>16)&255, G=(n>>8)&255, B=n&255;
  const ch=v => amt<0 ? Math.round(v*(1+amt)) : Math.round(v+(255-v)*amt);
  return 'rgb('+ch(R)+','+ch(G)+','+ch(B)+')';
}

/* ===================================================================== */
/*  UTILITY FUNCTIONS                                                     */
/* ===================================================================== */
function px(c,x,y,w,h,col){ c.fillStyle=col; c.fillRect(x,y,w,h); }
function shade(hex,amt){
  const n=parseInt(hex.slice(1),16);
  const R=(n>>16)&255, G=(n>>8)&255, B=n&255;
  const ch=v => amt<0 ? Math.round(v*(1+amt)) : Math.round(v+(255-v)*amt);
  return 'rgb('+ch(R)+','+ch(G)+','+ch(B)+')';
}

/* ===================================================================== */
/*  DIGIVICE  (logical 64x88)                                            */
/* ===================================================================== */
function drawDevice(canvas, idx, color, frame){
  const c=canvas.getContext('2d'); c.imageSmoothingEnabled=false;
  const W=canvas.width,H=canvas.height; c.clearRect(0,0,W,H);
  const dev=DEVICES[idx]; const body=color, bodySh=shade(color,-0.28), bodyLt=shade(color,0.25);
  const scr=dev.screen, OL='#0c0e16';
  const cx=W/2;
  function rrect(x,y,w,h,r,col){ c.fillStyle=col;
    c.beginPath(); c.moveTo(x+r,y);
    c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r);
    c.closePath(); c.fill();
  }
  function screen(x,y,w,h,r){ rrect(x-1,y-1,w+2,h+2,r+1,'#0b0f1a'); rrect(x,y,w,h,r,scr);
    // subtle scanline + a pixel pet egg
    c.fillStyle='rgba(0,0,0,.08)'; for(let i=0;i<h;i+=3) c.fillRect(x,y+i,w,1);
    const ex=x+w/2-3, ey=y+h/2-4; c.fillStyle='rgba(0,0,0,.55)';
    c.fillRect(ex,ey,6,8); c.fillRect(ex-1,ey+2,8,4); c.fillRect(ex+1,ey-1,2,1);
  }
  c.save();
  switch(dev.id){
    case 'classic':{ // egg-ish oval body
      rrect(cx-18,8,36,72,18,bodySh); rrect(cx-18,6,36,72,18,body); rrect(cx-15,9,30,30,14,bodyLt);
      px(c,cx-2,4,4,5,bodySh); // top nub
      screen(cx-12,16,24,22,6);
      // 3 buttons
      px(c,cx-9,46,7,7,bodySh); px(c,cx+2,46,7,7,bodySh); px(c,cx-3,58,7,7,bodySh);
      rrect(cx-9,45,7,7,3,bodyLt); rrect(cx+2,45,7,7,3,bodyLt); rrect(cx-3,57,7,7,3,bodyLt);
      break; }
    case 'd3':{ // rounded rect + side grips, round screen
      rrect(cx-19,8,38,72,14,bodySh); rrect(cx-19,6,38,72,14,body);
      rrect(cx-22,24,5,26,3,bodySh); rrect(cx+17,24,5,26,3,bodySh); // grips
      c.fillStyle='#0b0f1a'; c.beginPath(); c.arc(cx,30,15,0,7); c.fill();
      c.fillStyle=scr; c.beginPath(); c.arc(cx,30,13,0,7); c.fill();
      const ex=cx-3,ey=26; c.fillStyle='rgba(0,0,0,.5)'; c.fillRect(ex,ey,6,8);
      px(c,cx-3,52,6,6,bodyLt); px(c,cx-10,58,5,5,bodySh); px(c,cx+5,58,5,5,bodySh);
      break; }
    case 'dark':{ // D-Ark: body + circular dial right + trigger
      rrect(cx-17,8,34,70,10,bodySh); rrect(cx-17,6,34,70,10,body);
      screen(cx-11,14,20,20,4);
      c.fillStyle=bodyLt; c.beginPath(); c.arc(cx+9,52,9,0,7); c.fill();
      c.fillStyle=bodySh; c.beginPath(); c.arc(cx+9,52,9,0,7); c.stroke?0:0;
      c.fillStyle=bodySh; c.beginPath(); c.arc(cx+9,52,4,0,7); c.fill();
      rrect(cx-13,46,10,8,3,bodySh);  // left button
      px(c,cx-1,74,4,8,bodySh);       // trigger
      break; }
    case 'scanner':{ // Frontier flip scanner
      rrect(cx-16,30,32,50,8,bodySh); rrect(cx-16,28,32,50,8,body);  // base
      rrect(cx-16,8,32,24,8,bodyLt); rrect(cx-16,8,32,22,8,body);    // flip top
      screen(cx-11,38,22,18,4);
      px(c,cx-2,12,4,12,bodySh);
      px(c,cx-9,62,7,6,bodySh); px(c,cx+2,62,7,6,bodySh);
      break; }
    case 'xros':{ // phone-like big screen
      rrect(cx-18,6,36,76,9,bodySh); rrect(cx-18,4,36,76,9,body);
      screen(cx-13,14,26,40,4);
      c.fillStyle=bodySh; for(let i=0;i<3;i++) c.fillRect(cx-4+i*4,60,2,2); // speaker
      rrect(cx-6,66,12,8,4,bodyLt);
      break; }
    case 'vital':{ // round watch face + band
      rrect(cx-10,2,20,18,6,bodySh); rrect(cx-10,70,20,18,6,bodySh);   // bands
      c.fillStyle=body; c.beginPath(); c.arc(cx,44,22,0,7); c.fill();
      c.fillStyle=bodyLt; c.beginPath(); c.arc(cx,44,22,Math.PI,Math.PI*1.6); c.fill();
      c.fillStyle='#0b0f1a'; c.beginPath(); c.arc(cx,44,16,0,7); c.fill();
      c.fillStyle=scr; c.beginPath(); c.arc(cx,44,14,0,7); c.fill();
      const ex=cx-3,ey=40; c.fillStyle='rgba(0,0,0,.5)'; c.fillRect(ex,ey,6,8);
      px(c,cx+20,40,5,8,bodySh); // crown
      break; }
  }
  c.restore();
}

/* ===================================================================== */
/*  COLOUR WHEEL (HSV)                                                    */
/* ===================================================================== */
function hsv2rgb(h,s,v){ h/=60; const i=Math.floor(h)%6, f=h-Math.floor(h);
  const p=v*(1-s), q=v*(1-s*f), t=v*(1-s*(1-f)); let r,g,b;
  [[v,t,p],[q,v,p],[p,v,t],[p,q,v],[t,p,v],[v,p,q]][i].forEach((x,j)=>{ if(j===0)r=x; if(j===1)g=x; if(j===2)b=x; });
  return [Math.round(r*255),Math.round(g*255),Math.round(b*255)];
}
function rgb2hex(r,g,b){ return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join(''); }
function hex2hsv(hex){
  const n=parseInt(hex.slice(1),16); let r=(n>>16)/255,g=((n>>8)&255)/255,b=(n&255)/255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn; let h=0;
  if(d){ if(mx===r)h=((g-b)/d)%6; else if(mx===g)h=(b-r)/d+2; else h=(r-g)/d+4; h*=60; if(h<0)h+=360; }
  return [h, mx?d/mx:0, mx];
}
const wheelCv=document.getElementById('wheelCv'), wheelCtx=wheelCv.getContext('2d');
let wheelState={h:210,s:.6,v:1,onApply:null};
function renderWheel(v){
  const w=wheelCv.width,h=wheelCv.height,cx=w/2,cy=h/2,R=cx-2;
  const img=wheelCtx.createImageData(w,h),d=img.data;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const dx=x-cx,dy=y-cy,r=Math.sqrt(dx*dx+dy*dy),i=(y*w+x)*4;
    if(r>R){ d[i+3]=0; continue; }
    let hue=(Math.atan2(dy,dx)*180/Math.PI+360)%360, sat=Math.min(1,r/R);
    const [rr,gg,bb]=hsv2rgb(hue,sat,v);
    d[i]=rr;d[i+1]=gg;d[i+2]=bb;d[i+3]=255;
  }
  wheelCtx.putImageData(img,0,0);
}
function placeCursor(){
  const R=wheelCv.width/2-2, cx=wheelCv.width/2, cy=wheelCv.height/2;
  const ang=wheelState.h*Math.PI/180, rad=wheelState.s*R;
  const cur=document.getElementById('wheelCur');
  const rect=110; // display px radius (canvas shown at 220)
  const scale=220/wheelCv.width;
  cur.style.left=(cx+Math.cos(ang)*rad)*scale+'px';
  cur.style.top=(cy+Math.sin(ang)*rad)*scale+'px';
}
function wheelHex(){ const [r,g,b]=hsv2rgb(wheelState.h,wheelState.s,wheelState.v); return rgb2hex(r,g,b); }
function updateWheelChip(){ const hex=wheelHex();
  document.getElementById('wheelChip').style.background=hex;
  if(wheelState.live) wheelState.live(hex);
}
function openWheel(title, startHex, onLive, onApply){
  const [h,s,v]=hex2hsv(startHex);
  wheelState={h,s,v,live:onLive,onApply};
  document.getElementById('wheelTitle').textContent=title;
  document.getElementById('brightSlider').value=Math.round(v*100);
  renderWheel(v); placeCursor(); updateWheelChip();
  document.getElementById('wheelModal').classList.remove('hidden');
}
function pickFromEvent(e){
  const r=wheelCv.getBoundingClientRect();
  const sx=wheelCv.width/r.width;
  const x=(e.clientX-r.left)*sx, y=(e.clientY-r.top)*sx;
  const cx=wheelCv.width/2,cy=wheelCv.height/2,R=cx-2;
  const dx=x-cx,dy=y-cy; let rr=Math.sqrt(dx*dx+dy*dy);
  wheelState.h=(Math.atan2(dy,dx)*180/Math.PI+360)%360;
  wheelState.s=Math.min(1,rr/R);
  placeCursor(); updateWheelChip();
}
let wheelDrag=false;
wheelCv.addEventListener('pointerdown',e=>{wheelDrag=true;pickFromEvent(e);wheelCv.setPointerCapture(e.pointerId);});
wheelCv.addEventListener('pointermove',e=>{ if(wheelDrag)pickFromEvent(e); });
wheelCv.addEventListener('pointerup',()=>wheelDrag=false);
document.getElementById('brightSlider').addEventListener('input',e=>{
  wheelState.v=e.target.value/100; renderWheel(wheelState.v); updateWheelChip();
});
document.getElementById('wheelApply').addEventListener('click',()=>{
  if(wheelState.onApply) wheelState.onApply(wheelHex());
  document.getElementById('wheelModal').classList.add('hidden');
});
document.getElementById('wheelCancel').addEventListener('click',()=>{
  if(wheelState.cancel) wheelState.cancel();
  document.getElementById('wheelModal').classList.add('hidden');
});

/* ===================================================================== */
/*  CREATION UI WIRING                                                    */
/* ===================================================================== */
const devCanvas=document.getElementById('devCanvas');
let animFrame=0;
function renderCreator(){
  drawDevice(devCanvas, T.devIdx, T.devColor, animFrame);
  document.getElementById('devColor').style.background = T.devColor;
  document.getElementById('devName').textContent = DEVICES[T.devIdx].n;
  document.getElementById('devSeries').textContent = DEVICES[T.devIdx].series;
  document.getElementById('devHex').textContent = T.devColor;
  // device dots
  const dd=document.getElementById('devDots'); dd.innerHTML='';
  DEVICES.forEach((d,i)=>{ const e=document.createElement('i'); if(i===T.devIdx)e.className='on'; dd.appendChild(e); });
}

// device stepper
document.querySelectorAll('.arrow[data-step]').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const d=parseInt(btn.dataset.d), step=btn.dataset.step;
    if(step==='device'){ const L=DEVICES.length; T.devIdx=(T.devIdx+d+L)%L; T.devColor=DEVICES[T.devIdx].def; }
    renderCreator();
  });
});

// device color wheel
document.getElementById('devColor').addEventListener('click',()=>{
  const prev=T.devColor;
  openWheel('Device colour', T.devColor, hex=>{T.devColor=hex;renderCreator();}, hex=>{T.devColor=hex;renderCreator();});
  wheelState.cancel=()=>{T.devColor=prev;renderCreator();};
});

// name + begin
const nameInput=document.getElementById('nameInput'), beginBtn=document.getElementById('beginBtn');
nameInput.addEventListener('input',()=>{ T.name=nameInput.value.trim(); beginBtn.disabled=T.name.length<1; });
beginBtn.addEventListener('click',()=>{ saveTamer(); showHome(); toast('Welcome, '+T.name+'!'); });

/* ===================================================================== */
/*  HOME DASHBOARD                                                        */
/* ===================================================================== */
const DASH=[
  {id:'partner',n:'My Partner',d:'Raise your Digimon',ic:'<path d="M12 21s-7-4.3-9.3-8.6C1.2 9.6 2.7 6 6 6c2 0 3 1.2 4 2.5C11 7.2 12 6 14 6c3.3 0 4.8 3.6 3.3 6.4C19 16.7 12 21 12 21z"/>',col:'var(--pink)',soon:true},
  {id:'battle',n:'Battle',d:'Fight wild Digimon',ic:'<path d="M4 20l8-8M14 6l4-4 2 2-4 4M14 6l4 4M20 20l-8-8" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>',col:'var(--bad)',soon:true},
  {id:'adventure',n:'Adventure',d:'Explore the Digital World',ic:'<path d="M12 2l2.5 7H22l-6 4.5 2.3 7L12 16l-6.3 4.5L8 13.5 2 9h7.5z" stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round"/>',col:'var(--teal)',soon:true},
  {id:'items',n:'Items',d:'Bag & supplies',ic:'<path d="M6 8h12l-1 12H7L6 8zM9 8V6a3 3 0 016 0v2" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>',col:'var(--acc2)',soon:true},
  {id:'card',n:'Tamer Card',d:'View your profile',ic:'<path d="M3 6h18v12H3zM7 10h4M7 14h8" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>',col:'var(--blue)',soon:false},
  {id:'settings',n:'Settings',d:'Edit tamer / reset',ic:'<path d="M12 9a3 3 0 100 6 3 3 0 000-6zM19 12a7 7 0 00-.1-1l2-1.5-2-3.4-2.3 1a7 7 0 00-1.7-1L16.5 2h-4l-.4 2.6a7 7 0 00-1.7 1l-2.3-1-2 3.4L8 11a7 7 0 000 2l-2 1.5 2 3.4 2.3-1a7 7 0 001.7 1l.4 2.6h4l.4-2.6a7 7 0 001.7-1l2.3 1 2-3.4L19 13z" stroke="currentColor" stroke-width="1.6" fill="none"/>',col:'var(--ink-soft)',soon:false},
];
function buildDash(){
  const d=document.getElementById('dash'); d.innerHTML='';
  DASH.forEach(t=>{
    const el=document.createElement('div'); el.className='tile';
    el.innerHTML=`<div class="ic" style="background:color-mix(in srgb, ${t.col} 18%, transparent);color:${t.col}">
      <svg viewBox="0 0 24 24" fill="${t.id==='partner'?t.col:'none'}">${t.ic}</svg></div>
      <div class="tn">${t.n}</div><div class="td">${t.d}</div>
      ${t.soon?'<div class="soon">COMING SOON</div>':''}`;
    el.addEventListener('click',()=>handleTile(t.id));
    d.appendChild(el);
  });
}
function handleTile(id){
  if(id==='settings'){ if(confirm('Edit your tamer? (Your current look will load into the creator.)')){ showCreator(); } return; }
  if(id==='card'){ toast(T.name+' · '+DEVICES[T.devIdx].n+' tamer'); return; }
  toast('"'+DASH.find(x=>x.id===id).n+'" arrives in the next update!');
}
function showHome(){
  document.getElementById('creator').classList.add('hidden');
  document.getElementById('home').classList.remove('hidden');
  document.getElementById('homeName').textContent=T.name;
  document.getElementById('homeDev').textContent=DEVICES[T.devIdx].n+' · '+DEVICES[T.devIdx].series;
  drawDevice(document.getElementById('homeDev2'), T.devIdx, T.devColor, 0);
  buildDash();
}
function showCreator(){
  document.getElementById('home').classList.add('hidden');
  document.getElementById('creator').classList.remove('hidden');
  nameInput.value=T.name||''; beginBtn.disabled=!(T.name&&T.name.length);
  renderCreator();
}
document.getElementById('editBtn').addEventListener('click',showCreator);

/* ---------- persistence ---------- */
function saveTamer(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(T)); }catch(e){} }
function loadTamer(){ try{ const r=localStorage.getItem(SAVE_KEY); if(r){ T=Object.assign(T,JSON.parse(r)); return true; } }catch(e){} return false; }

/* ---------- toast ---------- */
let toastT=null;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200); }

/* ---------- boot + idle animation ---------- */
function loop(){ animFrame++;
  requestAnimationFrame(loop);
}
(function boot(){
  const had=loadTamer();
  renderCreator();
  if(had && T.name){ showHome(); } else { showCreator(); }
  requestAnimationFrame(loop);
})();
</script>
