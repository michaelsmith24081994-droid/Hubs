<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DigiPet · Virtual Monster</title>
<meta name="theme-color" content="#1b2a17">
<style>
  :root{
    --shell:#f5a623; --shell-2:#e8930c; --shell-dark:#b46d05;
    --lcd:#9bbc0f; --lcd-dark:#0f380f; --lcd-mid:#306230; --lcd-light:#8bac0f;
    --btn:#2b2b33; --btn-face:#3a3a45; --ink:#1c1c22;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
    background:radial-gradient(120% 120% at 50% 0%,#2a3142,#10131c 70%);
    color:#e9eef5;display:flex;align-items:center;justify-content:center;
    min-height:100vh;padding:14px;overflow-x:hidden;
  }
  .device{
    width:min(420px,96vw);
    background:linear-gradient(160deg,var(--shell),var(--shell-2) 55%,var(--shell-dark));
    border-radius:46% 46% 44% 44%/30% 30% 60% 60%;
    padding:26px 24px 30px;
    box-shadow:0 24px 60px -18px rgba(0,0,0,.8),inset 0 3px 8px rgba(255,255,255,.45),inset 0 -10px 24px rgba(0,0,0,.28);
    position:relative;
  }
  .brand{
    text-align:center;font-weight:800;letter-spacing:3px;color:#5a3a02;
    font-size:13px;margin-bottom:12px;text-shadow:0 1px 0 rgba(255,255,255,.4);
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .brand b{color:#7a4d02;}
  .screen-frame{
    background:#2c2c31;border-radius:14px;padding:14px;
    box-shadow:inset 0 4px 12px rgba(0,0,0,.7),0 2px 0 rgba(255,255,255,.2);
  }
  .screen-inner{
    background:#1a1f12;border-radius:6px;padding:8px;position:relative;overflow:hidden;
  }
  canvas#lcd{
    width:100%;display:block;image-rendering:pixelated;border-radius:3px;
    background:var(--lcd);
  }
  /* top status row icons (rendered above canvas) */
  .toast{
    position:absolute;left:50%;top:8px;transform:translateX(-50%);
    background:rgba(15,56,15,.92);color:var(--lcd);font-size:12px;font-weight:700;
    padding:4px 10px;border-radius:4px;border:1px solid var(--lcd-mid);
    pointer-events:none;opacity:0;transition:opacity .25s;white-space:nowrap;z-index:5;
    image-rendering:pixelated;
  }
  .toast.show{opacity:1;}
  /* function icon ring */
  .icons{
    display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:16px;
  }
  .ico{
    background:linear-gradient(180deg,#fff5e0,#f2d79c);
    border:none;border-radius:11px;padding:8px 4px 6px;cursor:pointer;
    box-shadow:0 3px 0 var(--shell-dark),0 5px 8px rgba(0,0,0,.25);
    transition:transform .08s,box-shadow .08s;display:flex;flex-direction:column;
    align-items:center;gap:3px;color:#5a3a02;position:relative;
  }
  .ico:active{transform:translateY(3px);box-shadow:0 0 0 var(--shell-dark);}
  .ico svg{width:24px;height:24px;}
  .ico span{font-size:9px;font-weight:800;letter-spacing:.3px;}
  .ico .badge{
    position:absolute;top:-5px;right:-5px;background:#e23b3b;color:#fff;
    min-width:16px;height:16px;border-radius:9px;font-size:10px;font-weight:800;
    display:none;align-items:center;justify-content:center;padding:0 4px;
    box-shadow:0 1px 3px rgba(0,0,0,.4);
  }
  .ico.alert{animation:pulse 1s infinite;}
  .ico.alert .badge{display:flex;}
  @keyframes pulse{50%{box-shadow:0 3px 0 var(--shell-dark),0 0 0 4px rgba(226,59,59,.5);}}
  .ico.on{background:linear-gradient(180deg,#bfe06a,#8fbf2f);color:#1c3a00;}
  .ftr{display:flex;justify-content:space-between;align-items:center;margin-top:14px;
    font-size:11px;color:#6b4502;font-weight:700;}
  .pill{background:rgba(255,255,255,.35);border:none;border-radius:20px;padding:6px 12px;
    cursor:pointer;font-weight:800;color:#5a3a02;font-size:11px;}
  .pill:active{transform:translateY(1px);}
  /* overlay menus drawn over screen for food/battle selection use simple buttons under screen */
  .tray{display:none;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:10px;}
  .tray.show{display:flex;}
  .tray button{
    background:#243018;color:var(--lcd);border:1px solid var(--lcd-mid);border-radius:6px;
    padding:7px 11px;font-weight:700;font-size:12px;cursor:pointer;font-family:inherit;
  }
  .tray button:active{background:var(--lcd-mid);}
  .hint{text-align:center;font-size:11px;color:#7a4d02;margin-top:10px;min-height:14px;font-weight:600;}
  @media (max-width:380px){ .ico span{font-size:8px;} }
</style>
</head>

  <div class="brand"><b>◆</b> DIGI&middot;PET <b>◆</b></div>

</div>

   ========================================================================== */

/* ---------- tiny pixel-art helpers --------------------------------------- */
// Sprites are arrays of 16 strings of length 16. '#'=dark, 'o'=mid shade, '.'/' '=off.
function drawSprite(art, px, py, scale, flip, color){
  color = color || DARK;
  for(let y=0;y<art.length;y++){
    const row = art[y];
    for(let x=0;x<row.length;x++){
      const c = row[x];
      if(c===' '||c==='.') continue;
      ctx.fillStyle = (c==='o') ? MID : color;
      const dx = flip ? (15-x) : x;
      ctx.fillRect(px+dx*scale, py+y*scale, scale, scale);
    }
  }
}

function textWidth(s,sc){ sc=sc||1; return s.length*6*sc; }
function drawText(s, x, y, sc, color){
  sc = sc||1; color = color||DARK; s = String(s).toUpperCase();
  let cx = x;
  for(const ch of s){
    const g = FONT[ch] || FONT['?'];
    for(let r=0;r<7;r++) for(let c=0;c<5;c++)
      if(g[r][c]==='1'){ ctx.fillStyle=color; ctx.fillRect(cx+c*sc, y+r*sc, sc, sc); }
    cx += 6*sc;
  }
  return cx;
}
function drawTextCenter(s,y,sc,color){ drawText(s, (SCREEN_W-textWidth(s,sc))/2, y, sc, color); }

/* ---------- game configuration / pacing ---------------------------------- */
const CFG = {
  hungerDrop: 95,    // sec to lose 1 hunger heart
  strDrop: 130,      // sec to lose 1 strength heart
  poopEvery: 150,    // sec between droppings
  callCheck: 60,     // sec a need can go unanswered before a care mistake
  // active-age (sec) required IN a stage before it may digivolve
  stageDur: { 1:50, 2:110, 3:240, 4:480, 5:780 },
  maxStat: 4,
  offlineCap: 6*3600 // cap offline catch-up at 6h
};

/* ---------- save / state ------------------------------------------------- */
const SAVE_KEY = 'digipet.save.v1';
let S = null;       // game state
let sound = true;

function freshPet(){
  return {
    species:'egg', born:Date.now(), lastTick:Date.now(),
    ageSec:0, stageSec:0,
    hunger:CFG.maxStat, strength:CFG.maxStat, weight:20, effort:0,
    hp:10, maxhp:10,
    poop:0, sick:false, asleep:false, lightOn:true, injured:false,
    careMistakes:0, wins:0, battles:0, trainCount:0, overfeed:0,
    hungerOwe:0, strOwe:0, alive:true, hatched:false,
    needTimer:0, // sec a need has been unmet
    items:{ meat:5, vita:2, potion:2, weight:1 },
  };
}
function load(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(raw){ S = JSON.parse(raw); sound = S._sound!==false; return; }
  }catch(e){}
  S = freshPet();
}
function save(){ try{ S._sound = sound; localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }

/* ---------- audio (simple vpet blips) ------------------------------------ */
let actx=null;
function beep(freq,dur,type){
  if(!sound) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain();
    o.type=type||'square'; o.frequency.value=freq;
    g.gain.value=0.05; o.connect(g); g.connect(actx.destination);
    o.start(); g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime+(dur||0.08));
    o.stop(actx.currentTime+(dur||0.08));
  }catch(e){}
}
const sfx = {
  ok:()=>{ beep(660,.06); setTimeout(()=>beep(880,.08),60); },
  no:()=>{ beep(200,.12,'sawtooth'); },
  eat:()=>{ beep(520,.05); setTimeout(()=>beep(420,.05),70); },
  hit:()=>{ beep(150,.07,'sawtooth'); },
  win:()=>{ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.12),i*110)); },
  evo:()=>{ [392,523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.14),i*130)); },
  call:()=>{ beep(880,.1); setTimeout(()=>beep(880,.1),160); },
};

/* ---------- needs / care logic ------------------------------------------- */
function needsAttention(){
  if(!S.alive || S.species==='egg') return false;
  return S.hunger<=0 || S.strength<=0 || S.sick || S.poop>0;
}

function stageOf(id){ return C[id]?C[id].stage:0; }

/* core per-second simulation (also used for offline catch-up) */
function simulate(seconds){
  if(!S.alive) return;
  for(let s=0;s<seconds;s++){
    S.ageSec++; S.stageSec++;
    if(S.species==='egg') continue;

    if(S.asleep){
      // sleeping: needs barely change, recover a little
      if(S.ageSec%5===0 && S.hp<S.maxhp) S.hp++;
      continue;
    }

    // hunger depletion
    S.hungerOwe++;
    if(S.hungerOwe>=CFG.hungerDrop){ S.hungerOwe=0; if(S.hunger>0) S.hunger--; }
    // strength depletion
    S.strOwe++;
    if(S.strOwe>=CFG.strDrop){ S.strOwe=0; if(S.strength>0) S.strength--; }
    // weight slowly drifts toward healthy when not fed
    if(S.ageSec%200===0 && S.weight>10) S.weight--;
    // poop
    if(S.ageSec%CFG.poopEvery===0 && S.poop<6) S.poop++;
    // sickness from neglect
    if(S.poop>=4 && !S.sick && Math.random()<0.01) S.sick=true;
    if(S.hunger<=0 && S.strength<=0 && !S.sick && Math.random()<0.008) S.sick=true;

    // care-mistake accounting: a need unmet for callCheck sec = 1 mistake
    if(needsAttention()){
      S.needTimer++;
      if(S.needTimer>=CFG.callCheck){ S.needTimer=0; S.careMistakes++; }
    } else { S.needTimer=0; }

    // health damage from prolonged sickness/starvation -> death
    if(S.sick && S.poop>=4){ if(Math.random()<0.004 && S.hp>0) S.hp--; }
    if(S.hunger<=0 && S.strength<=0 && S.sick){ if(Math.random()<0.006 && S.hp>0) S.hp--; }
    if(S.hp<=0){ die(); return; }

    // evolution check
    tryEvolve();
  }
}

function die(){
  S.alive=false; S.hp=0;
  view='dead'; sfx.no();
}

function maxHpFor(id){ return C[id]?C[id].hp:10; }

function tryEvolve(){
  const cur = C[S.species];
  if(!cur || !cur.evolve || cur.stage>=6) return;
  const need = CFG.stageDur[cur.stage];
  if(need===undefined || S.stageSec < need) return;

  // pick first matching branch
  let chosen=null;
  for(const rule of cur.evolve){
    if(rule.minWins!==undefined && S.wins<rule.minWins) continue;
    if(rule.maxMistakes!==undefined && S.careMistakes>rule.maxMistakes) continue;
    if(rule.minTrain!==undefined && S.trainCount<rule.minTrain) continue;
    chosen=rule.to; break;
  }
  if(!chosen) chosen = cur.evolve[cur.evolve.length-1].to;
  evolveTo(chosen);
}

function evolveTo(id){
  S.species=id; S.stageSec=0;
  S.maxhp=maxHpFor(id); S.hp=S.maxhp;
  S.hunger=CFG.maxStat; S.strength=Math.max(S.strength, Math.floor(CFG.maxStat/2));
  S.sick=false; S.injured=false;
  sfx.evo(); evoFlash=60;
  toast('DIGIVOLVE!');
  hint(C[id].name + ' digivolved!');
  save();
}
let evoFlash=0;

/* ---------- care actions ------------------------------------------------- */
function ensureAwake(){
  if(S.asleep){ toast('SHHH... ASLEEP'); sfx.no(); return false; }
  return true;
}
function feed(kind){
  if(S.species==='egg'){ toast('NOT YET'); return; }
  if(!ensureAwake()) return;
  if(kind==='meat'){
    if(S.items.meat<=0){ toast('NO MEAT'); sfx.no(); return; }
    S.items.meat--;
    if(S.hunger>=CFG.maxStat){ S.weight+=2; S.overfeed++; toast('TOO FULL!'); }
    else { S.hunger=Math.min(CFG.maxStat,S.hunger+1); S.weight+=1; }
    sfx.eat();
  } else { // vita / protein -> strength
    if(S.items.vita<=0){ toast('NO VITA'); sfx.no(); return; }
    S.items.vita--;
    S.strength=Math.min(CFG.maxStat,S.strength+1); S.weight+=2; sfx.eat();
    toast('STRENGTH UP');
  }
  closeTray(); save(); refreshIcons();
}
function toggleLight(){
  if(S.species==='egg'){ toast('NOT YET'); return; }
  S.lightOn=!S.lightOn;
  if(!S.lightOn){ S.asleep=true; toast('LIGHTS OFF'); beep(300,.1); }
  else { S.asleep=false; toast('LIGHTS ON'); beep(600,.1); }
  save(); refreshIcons();
}
function clean(){
  if(S.poop<=0){ toast('ALL CLEAN'); return; }
  S.poop=0; toast('CLEANED!'); sfx.ok();
  // cleaning quickly can cure poop-induced risk
  save(); refreshIcons();
}
function heal(){
  if(S.species==='egg'){ toast('NOT YET'); return; }
  if(!S.sick && !S.injured && S.hp>=S.maxhp){ toast('NOT SICK'); return; }
  if(S.items.potion<=0){ toast('NO POTION'); sfx.no(); return; }
  S.items.potion--; S.sick=false; S.injured=false;
  S.hp=S.maxhp; toast('HEALED!'); sfx.ok();
  save(); refreshIcons();
}
function train(){
  if(S.species==='egg'){ toast('NOT YET'); return; }
  if(!ensureAwake()) return;
  if(S.strength<=0){ toast('TOO TIRED'); sfx.no(); return; }
  view='train'; startTraining();
}

/* ---------- training mini-game (timing press) ---------------------------- */
let trainState=null;
function startTraining(){
  trainState={ round:0, score:0, barX:0, dir:1, done:false };
  hint('TAP when the bar is in the centre! (3 rounds)');
}
function trainTap(){
  if(!trainState||trainState.done) return;
  const center = SCREEN_W/2;
  const dist = Math.abs(trainState.barX - center);
  const good = dist < 14;
  if(good){ trainState.score++; sfx.ok(); } else { sfx.no(); }
  trainState.round++;
  if(trainState.round>=3){
    trainState.done=true;
    const gained = trainState.score;
    S.effort += gained; S.trainCount++;
    S.strength=Math.max(0,S.strength-1);
    S.weight=Math.max(8,S.weight-2);
    S.hunger=Math.max(0,S.hunger-1);
    if(S.hp<S.maxhp) S.hp=Math.min(S.maxhp,S.hp+gained); // condition up
    toast('EFFORT +'+gained);
    setTimeout(()=>{ view='main'; trainState=null; hint(''); save(); },1100);
  }
}
function renderTrain(){
  clearLCD();
  drawTextCenter('TRAINING', 8, 1);
  drawTextCenter('ROUND '+(Math.min(trainState.round+1,3))+'/3', 22, 1, MID);
  // target zone
  ctx.fillStyle=MID; ctx.fillRect(SCREEN_W/2-14, 56, 28, 16);
  ctx.fillStyle=DARK; ctx.fillRect(SCREEN_W/2-1, 50, 2, 28);
  // moving bar
  ctx.fillStyle=DARK; ctx.fillRect(trainState.barX-2, 50, 4, 28);
  drawTextCenter('SCORE '+trainState.score, 92, 1);
  if(!trainState.done){
    trainState.barX += trainState.dir*4;
    if(trainState.barX>SCREEN_W-8){trainState.dir=-1;} if(trainState.barX<8){trainState.dir=1;}
  }
}

/* ---------- battle system ------------------------------------------------ */
let battle=null;
function startBattle(enemyId){
  if(S.species==='egg' || stageOf(S.species)<3){ toast('TOO YOUNG'); sfx.no(); return; }
  if(!ensureAwake()) return;
  if(S.strength<=0){ toast('TOO WEAK'); sfx.no(); return; }
  const e = C[enemyId];
  battle={
    enemy:enemyId,
    pHp:S.hp, pMax:S.maxhp,
    eHp:e.hp, eMax:e.hp,
    phase:'intro', timer:60, proj:null, log:'', turn:'p',
    pPow: C[S.species].pow + S.strength*2 + Math.floor(S.effort/2),
    ePow: e.pow,
    result:null
  };
  view='battle'; closeTray(); hint('');
  beep(440,.1); setTimeout(()=>beep(550,.1),120);
}
function battleStep(){
  const b=battle; if(!b) return;
  if(b.timer>0){ b.timer--; }

  if(b.phase==='intro' && b.timer<=0){ b.phase='turn'; b.timer=20; }
  else if(b.phase==='turn' && b.timer<=0){
    // launch attack from whoever's turn
    b.phase='attack'; b.timer=30;
    b.proj={ from:b.turn, x: b.turn==='p'?40:120 };
  }
  else if(b.phase==='attack'){
    if(b.proj){ b.proj.x += (b.proj.from==='p'?6:-6); }
    if(b.timer<=0){
      // resolve damage
      if(b.proj.from==='p'){
        const dmg = Math.max(3, b.pPow + rand(-3,4));
        b.eHp=Math.max(0,b.eHp-dmg); sfx.hit(); b.log=C[S.species].name+' '+dmg;
      } else {
        const dmg = Math.max(2, b.ePow + rand(-3,3));
        b.pHp=Math.max(0,b.pHp-dmg); sfx.hit(); b.log=C[b.enemy].name+' '+dmg;
      }
      b.proj=null;
      if(b.eHp<=0){ b.phase='end'; b.result='win'; b.timer=80; onBattleEnd(true); }
      else if(b.pHp<=0){ b.phase='end'; b.result='lose'; b.timer=80; onBattleEnd(false); }
      else { b.turn = b.turn==='p'?'e':'p'; b.phase='turn'; b.timer=18; }
    }
  }
  else if(b.phase==='end' && b.timer<=0){
    finishBattle();
  }
}
let battleSettled=false;
function onBattleEnd(win){
  if(battleSettled) return; battleSettled=true;
  S.battles++;
  S.hp = Math.max(1, battle.pHp);
  if(win){ S.wins++; S.effort+=2; S.strength=Math.max(0,S.strength-1); sfx.win();
    if(adventure){ adventureReward(); } }
  else { S.injured=true; S.hp=Math.max(1,Math.floor(S.maxhp*0.2)); sfx.no(); }
  S.strength=Math.max(0,S.strength-1);
  save();
}
function finishBattle(){
  const wasAdv = !!adventure;
  battle=null; battleSettled=false;
  if(wasAdv){ view='adventure'; advNext(); }
  else { view='main'; refreshIcons(); }
}
function renderBattle(){
  const b=battle; clearLCD();
  ctx.fillStyle=MID; ctx.fillRect(0,86,SCREEN_W,1);
  // HP bars
  drawText('YOU',4,4,1); drawBar(28,4,40,b.pHp/b.pMax);
  drawText('FOE',SCREEN_W-66,4,1); drawBar(SCREEN_W-42,4,40,b.eHp/b.eMax);

  const myArt=speciesArt(S.species), foeArt=speciesArt(b.enemy);
  const lunge = (b.phase==='attack'&&b.proj) ? (b.proj.from==='p'?4:-4) : 0;
  const py=46, ey=46;
  drawSpriteScaled(myArt, 18 + (lunge>0?lunge:0), py, 2.5, false);
  drawSpriteScaled(foeArt, SCREEN_W-18-16*2.5 + (lunge<0?lunge:0), ey, 2.5, true);

  // projectile
  if(b.proj){
    const py2=64;
    ctx.fillStyle=DARK;
    for(let i=0;i<3;i++) ctx.fillRect(b.proj.x - (b.proj.from==='p'?i*4:-i*4), py2+rand(-2,2), 4,4);
  }
  if(b.phase==='intro') drawTextCenter('BATTLE START', 96, 1);
  else if(b.phase==='end'){
    drawTextCenter(b.result==='win'?'YOU WIN!':'YOU LOSE...', 96, 1);
  } else if(b.log){ drawTextCenter('HIT '+b.log, 96, 1, MID); }
}
function drawSpriteScaled(art, px, py, scale, flip){
  for(let y=0;y<art.length;y++) for(let x=0;x<art[y].length;x++){
    const c=art[y][x]; if(c===' '||c==='.')continue;
    ctx.fillStyle=(c==='o')?MID:DARK;
    const dx=flip?(15-x):x;
    ctx.fillRect(Math.round(px+dx*scale), Math.round(py+y*scale), Math.ceil(scale), Math.ceil(scale));
  }
}
function drawBar(x,y,w,frac){
  frac=Math.max(0,Math.min(1,frac));
  ctx.fillStyle=MID; ctx.fillRect(x,y,w,6);
  ctx.fillStyle=DARK; ctx.fillRect(x,y,Math.round(w*frac),6);
  ctx.fillStyle=MID; ctx.fillRect(x,y,w,1); ctx.fillRect(x,y+5,w,1);
}

/* ---------- adventure mode ---------------------------------------------- */
const AREAS=[
  { name:'FILE ISLAND', steps:5, foes:['mushy','mushy','kuwa'], boss:'kuwa' },
  { name:'DARK CAVE',   steps:6, foes:['mushy','kuwa','devil'], boss:'devil' },
];
let adventure=null;
function startAdventure(areaIdx){
  if(stageOf(S.species)<3){ toast('TOO YOUNG'); sfx.no(); return; }
  if(!ensureAwake()) return;
  if(S.strength<=0){ toast('TOO WEAK'); sfx.no(); return; }
  const a=AREAS[areaIdx];
  adventure={ area:a, step:0, msg:'ENTERING '+a.name, timer:70, x:0, foundLog:[] };
  view='adventure'; closeTray(); hint('');
  beep(500,.1);
}
function advNext(){
  const a=adventure.area;
  adventure.step++;
  if(adventure.step>a.steps){
    // boss fight then finish
    if(!adventure.bossDone){ adventure.bossDone=true; adventure.msg='BOSS!'; adventure.timer=50;
      setTimeout(()=>startBattle(a.boss),900); return; }
    adventure.msg='AREA CLEAR!'; adventure.timer=120; adventure.finished=true; sfx.win();
    return;
  }
  // random event
  const roll=Math.random();
  if(roll<0.45){
    const foe = a.foes[rand(0,a.foes.length-1)];
    adventure.msg='WILD '+C[foe].name+'!'; adventure.timer=40;
    setTimeout(()=>startBattle(foe),700);
  } else if(roll<0.7){
    const items=['meat','vita','potion'];
    const it=items[rand(0,items.length-1)];
    S.items[it]=(S.items[it]||0)+1; adventure.msg='FOUND '+it.toUpperCase()+'!';
    adventure.timer=60; sfx.ok(); save();
  } else if(roll<0.85){
    S.hp=Math.max(1,S.hp-rand(2,6)); adventure.msg='TRAP! -HP'; adventure.timer=60; sfx.hit();
  } else {
    adventure.msg='...NOTHING HERE'; adventure.timer=50;
  }
}
function adventureReward(){
  S.items.meat=(S.items.meat||0)+1;
}
function renderAdventure(){
  const ad=adventure; clearLCD();
  drawTextCenter(ad.area.name, 6, 1);
  drawText('STEP '+Math.min(ad.step+1,ad.area.steps+1)+'/'+(ad.area.steps+1), 4, 18, 1, MID);
  // walking pet
  ad.x=(ad.x+1)%SCREEN_W;
  ctx.fillStyle=MID; ctx.fillRect(0,82,SCREEN_W,1);
  const bob=petBob();
  drawSpriteScaled(speciesArt(S.species), 60, 46+bob, 2.5, false);
  // simple scenery dots scrolling
  for(let i=0;i<6;i++){ const sx=(i*30 - ad.x*0.7)%SCREEN_W; ctx.fillStyle=MID; ctx.fillRect((sx+SCREEN_W)%SCREEN_W,80,2,2);}
  drawTextCenter(ad.msg, 96, 1);
  if(ad.timer>0) ad.timer--;
  else if(ad.finished){ /* wait for tap */ }
  else if(!battle){ advNext(); }
}

/* ---------- main draw loop ----------------------------------------------- */
function draw(){
  anim++;
  if(evoFlash>0){ evoFlash--; if(evoFlash%6<3){ ctx.fillStyle=BG; ctx.fillRect(0,0,SCREEN_W,SCREEN_H);
    drawTextCenter('DIGIVOLVING', 50, 1); requestAnimationFrame(draw); return; } }

  switch(view){
    case 'main': renderMain(); break;
    case 'stats': renderStats(); break;
    case 'battle': battleStep(); renderBattle(); break;
    case 'adventure': renderAdventure(); break;
    case 'train': renderTrain(); break;
    case 'dead': renderDead(); break;
    default: renderMain();
  }
  requestAnimationFrame(draw);
}

/* ---------- per-second tick ---------------------------------------------- */
function tick(){
  if(view==='battle' || view==='train') return; // pause world sim during these
  const now=Date.now();
  let elapsed=Math.floor((now - S.lastTick)/1000);
  if(elapsed<=0) return;
  if(elapsed>CFG.offlineCap) elapsed=CFG.offlineCap;
  S.lastTick = now - ((now-S.lastTick)%1000);
  simulate(elapsed);
  updateAgeLabel();
  refreshIcons();
  save();
}
function updateAgeLabel(){
  document.getElementById('ageLabel').textContent =
    S.alive ? (['EGG','BABY','IN-TRAIN','ROOKIE','CHAMPION','ULTIMATE','MEGA'][stageOf(S.species)]+' · '+fmtAge(S.ageSec)) : 'R.I.P.';
}

  {id:'train',label:'TRAIN',svg:'<path d="M6 6v12M18 6v12M6 12h12M2 9v6M22 9v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>'},
  {id:'battle',label:'BATTLE',svg:'<path d="M4 20l8-8M14 6l4-4 2 2-4 4M14 6l4 4M20 20l-8-8M10 6L6 2 4 4l4 4" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>'},
  {id:'adventure',label:'QUEST',svg:'<path d="M12 2l2.5 7H22l-6 4.5 2.3 7L12 16l-6.3 4.5L8 13.5 2 9h7.5z" stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round"/>'},
  {id:'clean',label:'CLEAN',svg:'<path d="M3 21h18M6 21l1-9h10l1 9M9 12V7a3 3 0 016 0v5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>'},
  {id:'heal', label:'HEAL', svg:'<path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>'},
  {id:'stats',label:'STATS',svg:'<path d="M4 20V10M10 20V4M16 20v-8M22 20H2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>'},
];
function buildIcons(){
  const bar=document.getElementById('iconbar'); bar.innerHTML='';
  for(const ic of ICONS){
    const b=document.createElement('button'); b.className='ico'; b.dataset.id=ic.id;
    b.innerHTML='<svg viewBox="0 0 24 24">'+ic.svg+'</svg><span>'+ic.label+'</span><i class="badge">!</i>';
    b.addEventListener('click',()=>handleIcon(ic.id));
    bar.appendChild(b);
  }
}
function refreshIcons(){
  updateAgeLabel();
  const get=id=>document.querySelector('.ico[data-id="'+id+'"]');
  // light toggle visual
  const lb=get('light'); if(lb) lb.classList.toggle('on', !S.lightOn);
  // alert badges
  const setAlert=(id,on)=>{ const e=get(id); if(e) e.classList.toggle('alert',!!on); };
  setAlert('feed', S.hunger<=1);
  setAlert('train', S.strength<=1 && stageOf(S.species)>=1);
  setAlert('clean', S.poop>0);
  setAlert('heal', S.sick||S.injured);
}

function handleIcon(id){
  if(!S.alive){ toast('NO PET'); return; }
  if(view==='battle'||view==='train'){ return; }
  if(view==='adventure'){ toast('ON QUEST'); return; }
  if(view==='stats' && id!=='stats'){ view='main'; }
  closeTray();
  switch(id){
    case 'feed': openTray([
        {label:'🍖 MEAT ('+S.items.meat+')', fn:()=>feed('meat')},
        {label:'💊 VITA ('+S.items.vita+')', fn:()=>feed('vita')},
        {label:'CLOSE', fn:closeTray}
      ]); break;
    case 'light': toggleLight(); break;
    case 'train': train(); break;
    case 'clean': clean(); break;
    case 'heal': heal(); break;
    case 'stats': view = view==='stats'?'main':'stats'; break;
    case 'battle': openTray([
        {label:'⚔ '+C.mushy.name, fn:()=>startBattle('mushy')},
        {label:'⚔ '+C.kuwa.name, fn:()=>startBattle('kuwa')},
        {label:'⚔ '+C.devil.name, fn:()=>startBattle('devil')},
        {label:'CLOSE', fn:closeTray}
      ]); break;
    case 'adventure': openTray(
        AREAS.map((a,i)=>({label:'➤ '+a.name, fn:()=>startAdventure(i)}))
          .concat([{label:'CLOSE',fn:closeTray}])
      ); break;
  }
}
function openTray(opts){
  const tray=document.getElementById('tray'); tray.innerHTML='';
  for(const o of opts){
    const btn=document.createElement('button'); btn.textContent=o.label;
    btn.addEventListener('click',o.fn); tray.appendChild(btn);
  }
  tray.classList.add('show');
}
function closeTray(){ const t=document.getElementById('tray'); t.classList.remove('show'); t.innerHTML=''; }

/* ---------- canvas tap handling ------------------------------------------ */
cv.addEventListener('click',()=>{
  if(!S.alive){ S=freshPet(); view='main'; save(); refreshIcons(); toast('NEW EGG!'); return; }
  if(S.species==='egg'){ hatch(); return; }
  if(view==='stats'){ view='main'; return; }
  if(view==='train'){ trainTap(); return; }
  if(view==='adventure'){ if(adventure&&adventure.finished){ adventure=null; view='main'; refreshIcons(); } return; }
  if(view==='dead'){ S=freshPet(); view='main'; save(); return; }
  // petting: small happiness / wake check
  if(view==='main'){
    if(S.asleep){ toast('ZZZ...'); }
    else { beep(700,.05); toast('♥'); }
  }
});
function hatch(){
  S.species='botari'; S.hatched=true; S.stageSec=0;
  S.maxhp=maxHpFor('botari'); S.hp=S.maxhp;
  sfx.evo(); toast('IT HATCHED!'); hint('Care for your DigiPet!');
  save(); refreshIcons();
}

/* ---------- footer buttons ----------------------------------------------- */
document.getElementById('soundBtn').addEventListener('click',function(){
  sound=!sound; this.textContent='♪ Sound: '+(sound?'On':'Off'); save();
});
document.getElementById('resetBtn').addEventListener('click',()=>{
  if(confirm('Reset your DigiPet to a new egg? This erases progress.')){
    S=freshPet(); view='main'; closeTray(); save(); refreshIcons();
    hint('Tap the egg to begin.'); toast('RESET');
  }
});

/* ---------- boot --------------------------------------------------------- */
load();
buildIcons();
// catch up offline time immediately
(function init(){
  const now=Date.now();
  let elapsed=Math.floor((now-S.lastTick)/1000);
  if(elapsed>0){ if(elapsed>CFG.offlineCap) elapsed=CFG.offlineCap; simulate(elapsed); }
  S.lastTick=now;
  if(!S.alive) view='dead';
  refreshIcons(); save();
  document.getElementById('soundBtn').textContent='♪ Sound: '+(sound?'On':'Off');
  if(S.species==='egg') hint('Tap the egg to hatch your DigiPet!');
  else hint('');
})();
setInterval(tick,1000);
requestAnimationFrame(draw);
</script>
</body>
</html>
