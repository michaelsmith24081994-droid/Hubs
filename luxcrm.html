<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0b0c">
<title>LUX — Cleaning CRM</title>
<style>
  :root{
    --void:#0a0b0c; --char:#131517; --char-2:#191c1f; --raised:#22272e;
    --steel:#262b32; --steel-soft:#1e2228;
    --txt:#e9edf0; --muted:#8b939b; --faint:#5f676e;
    --cyan:#01b0df; --cyan-2:#46cdf5; --cyan-deep:#0a7ba0;
    --cyan-ghost:rgba(1,176,223,.13); --cyan-ghost-2:rgba(1,176,223,.24);
    --green:#3ddc8a; --amber:#f0b73f; --red:#ff5d52; --slate:#7c93a8;
    --r:13px; --r-sm:9px;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --cond:"Arial Narrow","Helvetica Neue",var(--sans);
  }
  *{box-sizing:border-box}
  /* unify every icon: one outline family, round caps + joins, consistent weight */
  svg{stroke-linecap:round;stroke-linejoin:round}
  html,body{margin:0;min-height:100%}
  body{
    background:
      radial-gradient(900px 500px at 50% -8%, #16191d 0%, transparent 70%),
      var(--void);
    color:var(--txt);font-family:var(--sans);font-size:14px;line-height:1.5;
    -webkit-font-smoothing:antialiased;padding-bottom:96px;
  }
  ::selection{background:var(--cyan-ghost-2)}
  button{font-family:inherit}
  input,select,textarea{font-family:inherit;font-size:14px}
  .eyebrow{font-family:var(--cond);text-transform:uppercase;letter-spacing:2.5px;font-size:11px;color:var(--faint);font-weight:700}

  /* ---------- BANNER ---------- */
  .banner{
    position:sticky;top:0;z-index:30;
    background:linear-gradient(180deg,#1b1e22 0%,#141619 100%);
    border-bottom:1px solid var(--steel-soft);
    display:flex;align-items:center;justify-content:center;
    padding:0 16px;height:76px;
    box-shadow:0 1px 0 0 rgba(255,255,255,.02),0 8px 24px -18px rgba(0,0,0,.9);
  }
  .banner::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
    background:linear-gradient(90deg,transparent,rgba(1,176,223,.35),transparent)}
  .banner .logo{height:46px;width:auto;display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.55))}
  .banner .b-left,.banner .b-right{position:absolute;display:flex;gap:8px;align-items:center}
  .banner .b-left{left:14px}.banner .b-right{right:14px}
  .icon-btn{
    width:40px;height:40px;border-radius:11px;border:1px solid var(--steel);
    background:var(--char);color:var(--muted);display:grid;place-items:center;cursor:pointer;transition:.16s ease;
  }
  .icon-btn:hover{color:var(--cyan-2);border-color:var(--cyan-deep);background:var(--char-2);transform:translateY(-1px)}
  .icon-btn:active{transform:translateY(0)}
  .icon-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9}
  .quote-pill{display:inline-flex;align-items:center;gap:7px;
    background:linear-gradient(150deg,var(--cyan-2),var(--cyan-deep));
    color:#03141a;font-size:13px;font-weight:700;padding:8px 16px;
    border:none;border-radius:20px;cursor:pointer;
    box-shadow:0 4px 16px -6px var(--cyan);transition:.16s ease;white-space:nowrap;font-family:inherit}
  .quote-pill:hover{filter:brightness(1.1);transform:translateY(-1px);box-shadow:0 7px 20px -6px var(--cyan)}
  .quote-pill:active{transform:translateY(0)}
  .quote-pill svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;flex-shrink:0}

  /* ---------- shell ---------- */
  .wrap{max-width:1140px;margin:0 auto;padding:22px 20px 40px}
  .page-head{display:flex;align-items:flex-end;gap:14px;margin-bottom:20px;flex-wrap:wrap}
  .page-head .titles h1{font-size:23px;margin:0;font-weight:700;letter-spacing:-.4px}
  .page-head .titles .sub{color:var(--faint);font-size:12.5px;margin-top:2px}
  .page-head .actions{margin-left:auto;display:flex;gap:9px;flex-wrap:wrap}

  /* ---------- buttons ---------- */
  .btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--steel);
    background:var(--char-2);color:var(--txt);padding:9px 15px;border-radius:var(--r-sm);
    cursor:pointer;font-size:13px;font-weight:600;transition:.16s ease;white-space:nowrap}
  .btn:hover{border-color:#39404a;background:var(--raised);transform:translateY(-1px)}
  .btn:active{transform:translateY(0)}
  .btn.primary{background:linear-gradient(150deg,var(--cyan-2),var(--cyan-deep));border-color:transparent;color:#03141a;font-weight:700;
    box-shadow:0 6px 18px -8px var(--cyan)}
  .btn.primary:hover{filter:brightness(1.08);box-shadow:0 9px 22px -8px var(--cyan)}
  .btn.ghost{background:none}
  .btn.danger{color:var(--red);border-color:transparent;background:none}
  .btn.danger:hover{background:rgba(255,93,82,.1)}
  .btn .ico{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9}
  .btn.sm{padding:6px 11px;font-size:12px}

  /* ---------- stats ---------- */
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:13px;margin-bottom:22px}
  .stat{background:linear-gradient(160deg,var(--char) 0%,var(--char-2) 100%);border:1px solid var(--steel-soft);
    border-radius:var(--r);padding:15px 16px;position:relative;overflow:hidden}
  .stat .lbl{font-family:var(--cond);text-transform:uppercase;letter-spacing:1.4px;color:var(--muted);font-size:11px;font-weight:700}
  .stat .val{font-size:27px;font-weight:750;margin-top:8px;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
  .stat .meta{color:var(--faint);font-size:11.5px;margin-top:3px}
  .stat.accent::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(var(--cyan-2),var(--cyan-deep))}

  /* ---------- panel ---------- */
  .panel{background:var(--char);border:1px solid var(--steel-soft);border-radius:var(--r);overflow:hidden;margin-bottom:18px}
  .panel-head{padding:13px 17px;border-bottom:1px solid var(--steel-soft);display:flex;align-items:center;gap:10px}
  .panel-head h2{font-size:13px;margin:0;font-weight:700;font-family:var(--cond);text-transform:uppercase;letter-spacing:1.2px}
  .panel-head h2::before{content:"";display:inline-block;width:14px;height:2px;background:var(--cyan);margin-right:9px;vertical-align:middle}
  .panel-head .count{color:var(--faint);font-size:12px;font-family:var(--mono)}
  .panel-head .right{margin-left:auto;display:flex;gap:8px}

  table{width:100%;border-collapse:collapse}
  th{text-align:left;color:var(--faint);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;
    font-family:var(--cond);padding:10px 17px;border-bottom:1px solid var(--steel-soft);white-space:nowrap}
  td{padding:12px 17px;border-bottom:1px solid var(--steel-soft);font-size:13.5px;vertical-align:middle}
  tr:last-child td{border-bottom:0}
  tbody tr{transition:.1s}
  tbody tr:hover{background:var(--char-2)}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono)}
  .row-click{cursor:pointer}
  .strong{font-weight:650}.dim{color:var(--muted)}.faint{color:var(--faint)}

  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;
    font-family:var(--cond);text-transform:uppercase;letter-spacing:.5px}
  .pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .p-green{color:var(--green);background:rgba(61,220,138,.13)}
  .p-amber{color:var(--amber);background:rgba(240,183,63,.13)}
  .p-red{color:var(--red);background:rgba(255,93,82,.13)}
  .p-blue{color:var(--cyan-2);background:var(--cyan-ghost)}
  .p-slate{color:var(--slate);background:rgba(124,147,168,.13)}
  .tag{display:inline-block;font-size:11px;color:var(--muted);background:var(--char-2);border:1px solid var(--steel);padding:2px 8px;border-radius:6px;margin:2px 4px 2px 0}

  .empty{text-align:center;padding:42px 20px;color:var(--faint)}
  .empty .ico{width:34px;height:34px;stroke:var(--steel);fill:none;stroke-width:1.6;margin-bottom:12px}
  .empty p{margin:0 0 4px;color:var(--muted);font-size:14px}.empty span{font-size:12.5px}

  /* ---------- modal ---------- */
  .scrim{position:fixed;inset:0;background:rgba(2,3,4,.66);backdrop-filter:blur(3px);z-index:50;display:none;
    align-items:flex-start;justify-content:center;padding:30px 14px 100px;overflow-y:auto}
  .scrim.show{display:flex}
  .modal{background:var(--char);border:1px solid var(--steel);border-radius:15px;width:100%;max-width:560px;
    box-shadow:0 26px 70px -22px rgba(0,0,0,.8),0 0 0 1px rgba(1,176,223,.06);animation:pop .18s ease}
  @keyframes pop{from{transform:translateY(8px) scale(.99);opacity:0}to{transform:none;opacity:1}}
  .modal-head{padding:17px 21px;border-bottom:1px solid var(--steel-soft);display:flex;align-items:center}
  .modal-head h3{margin:0;font-size:16px;font-weight:700}
  .modal-head .x{margin-left:auto;background:none;border:0;color:var(--faint);cursor:pointer;width:30px;height:30px;
    border-radius:8px;display:grid;place-items:center;font-size:20px}
  .modal-head .x:hover{background:var(--char-2);color:var(--txt)}
  .modal-body{padding:19px 21px;display:flex;flex-direction:column;gap:14px;max-height:64vh;overflow-y:auto}
  .modal-foot{padding:14px 21px;border-top:1px solid var(--steel-soft);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:11px;color:var(--muted);font-weight:700;font-family:var(--cond);text-transform:uppercase;letter-spacing:1px}
  .field input,.field select,.field textarea{background:var(--void);border:1px solid var(--steel);color:var(--txt);
    padding:9px 11px;border-radius:var(--r-sm);width:100%;transition:.14s}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px var(--cyan-ghost)}
  .field textarea{resize:vertical;min-height:62px}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .field-row-3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:11px}
  @media (max-width:560px){.field-row,.field-row-3{grid-template-columns:1fr}}

  .line-item{display:grid;grid-template-columns:1fr 64px 88px 28px;gap:8px;align-items:center}
  .line-item input{padding:7px 9px}
  .li-x{background:none;border:0;color:var(--faint);cursor:pointer;font-size:18px;padding:3px;border-radius:6px}
  .li-x:hover{color:var(--red);background:rgba(255,93,82,.1)}

  /* pipeline */
  .pipe{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}
  @media (max-width:760px){.pipe{grid-template-columns:1fr 1fr}}
  .pipe-col{background:var(--char);border:1px solid var(--steel-soft);border-radius:var(--r);min-height:120px}
  .pipe-col h3{font-size:11px;margin:0;padding:11px 13px;border-bottom:1px solid var(--steel-soft);display:flex;align-items:center;gap:8px;
    font-family:var(--cond);text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:700}
  .pipe-col h3 .dot{width:8px;height:8px;border-radius:50%}
  .pipe-col h3 .n{margin-left:auto;font-family:var(--mono);color:var(--faint)}
  .pipe-body{padding:9px;display:flex;flex-direction:column;gap:8px;min-height:60px}
  .lead-card{background:var(--char-2);border:1px solid var(--steel);border-radius:10px;padding:11px 12px;cursor:pointer;transition:.13s}
  .lead-card:hover{border-color:var(--cyan-deep);transform:translateY(-1px)}
  .lead-card .nm{font-weight:650;font-size:13px}
  .lead-card .dt{color:var(--faint);font-size:11px;margin-top:4px;display:flex;justify-content:space-between;align-items:center}
  .lead-card .amt{color:var(--cyan-2);font-family:var(--mono);font-weight:700}

  .two-col{display:grid;grid-template-columns:1.55fr 1fr;gap:18px;align-items:start}
  @media (max-width:820px){.two-col{grid-template-columns:1fr}}

  .mini-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--steel-soft);font-size:13px}
  .mini-row:last-child{border-bottom:0}
  .bar-track{height:7px;background:var(--void);border-radius:20px;overflow:hidden;margin-top:7px}
  .bar-fill{height:100%;border-radius:20px;background:linear-gradient(90deg,var(--cyan-deep),var(--cyan-2))}

  .search{display:flex;align-items:center;gap:8px;background:var(--void);border:1px solid var(--steel);border-radius:var(--r-sm);padding:0 11px;max-width:280px;flex:1}
  .search input{background:none;border:0;color:var(--txt);padding:9px 0;width:100%}
  .search input:focus{outline:none}
  .search .ico{width:15px;height:15px;stroke:var(--faint);fill:none;stroke-width:1.8;flex-shrink:0}

  .seg{display:inline-flex;background:var(--void);border:1px solid var(--steel);border-radius:9px;padding:2px}
  .seg button{background:none;border:0;color:var(--muted);padding:6px 13px;border-radius:7px;cursor:pointer;font-size:12.5px;font-weight:600}
  .seg button.on{background:var(--raised);color:var(--cyan-2)}

  /* revenue chart */
  .chart{display:flex;align-items:flex-end;gap:10px;height:150px;padding:16px 18px 8px}
  .chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
  .chart .bar{width:100%;max-width:42px;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,var(--cyan-2),var(--cyan-deep));
    min-height:3px;transition:height .5s ease;position:relative}
  .chart .bar:hover::after{content:attr(data-v);position:absolute;top:-22px;left:50%;transform:translateX(-50%);
    background:var(--raised);border:1px solid var(--steel);padding:2px 7px;border-radius:6px;font-size:11px;white-space:nowrap;font-family:var(--mono)}
  .chart .cl{font-size:10px;color:var(--faint);font-family:var(--cond);text-transform:uppercase;letter-spacing:.5px}

  /* photos */
  .photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}
  .photo-thumb{position:relative;aspect-ratio:1;border-radius:9px;overflow:hidden;border:1px solid var(--steel);cursor:pointer}
  .photo-thumb img{width:100%;height:100%;object-fit:cover}
  .photo-thumb .tag-c{position:absolute;top:4px;left:4px;font-size:9px;background:rgba(0,0,0,.6);color:#fff;padding:1px 5px;border-radius:5px;text-transform:uppercase;letter-spacing:.5px}
  .photo-thumb .del{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.6);color:#fff;border:0;width:18px;height:18px;border-radius:5px;cursor:pointer;font-size:12px;line-height:1}
  .add-photo{aspect-ratio:1;border:1px dashed var(--steel);border-radius:9px;display:grid;place-items:center;cursor:pointer;color:var(--faint)}
  .add-photo:hover{border-color:var(--cyan-deep);color:var(--cyan-2)}
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:90;display:none;align-items:center;justify-content:center;padding:20px}
  .lightbox.show{display:flex}.lightbox img{max-width:100%;max-height:100%;border-radius:8px}

  /* calendar */
  .cal-nav{background:var(--char-2);border:1px solid var(--steel);color:var(--muted);border-radius:7px;padding:4px 11px;cursor:pointer;font-size:12px;font-weight:600;font-family:var(--cond);text-transform:uppercase;letter-spacing:.5px}
  .cal-nav:hover{color:var(--cyan-2);border-color:var(--cyan-deep)}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;padding:14px}
  .cal-dow{text-align:center;font-family:var(--cond);text-transform:uppercase;letter-spacing:.5px;font-size:10px;color:var(--faint);font-weight:700;padding-bottom:2px}
  .cal-cell{aspect-ratio:1.15;border:1px solid var(--steel-soft);border-radius:9px;padding:6px 7px;display:flex;flex-direction:column;cursor:pointer;transition:.12s;background:var(--char-2);min-height:44px;overflow:hidden}
  .cal-cell.empty{border:0;background:none;cursor:default}
  .cal-cell:not(.empty):hover{border-color:var(--cyan-deep);background:var(--raised)}
  .cal-cell .cd{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1}
  .cal-cell.has .cd{color:var(--txt);font-weight:650}
  .cal-cell.today{border-color:var(--cyan);box-shadow:inset 0 0 0 1px var(--cyan)}
  .cal-cell.today .cd{color:var(--cyan-2);font-weight:750}
  .cal-dots{display:flex;gap:3px;margin-top:auto;flex-wrap:wrap;align-items:center}
  .cal-dot{width:6px;height:6px;border-radius:50%;background:var(--cyan)}
  .cal-dot.done{background:var(--green)}
  .cal-more{font-size:9px;color:var(--faint);font-family:var(--mono)}
  @media (max-width:560px){.cal-grid{gap:3px;padding:10px}.cal-cell{padding:4px;min-height:38px}.cal-cell .cd{font-size:11px}}
  /* stock stepper */
  .stock-ctl{display:flex;align-items:center;gap:7px}
  .stock-ctl button{width:26px;height:26px;border:1px solid var(--steel);background:var(--char-2);color:var(--txt);border-radius:7px;cursor:pointer;font-size:15px;line-height:1;flex-shrink:0}
  .stock-ctl button:hover{border-color:var(--cyan-deep);color:var(--cyan-2)}
  .stock-ctl .sval{font-family:var(--mono);font-size:13px;min-width:56px;text-align:center}
  .stock-ctl .sval small{color:var(--faint)}
  .stock-ctl .sval.low{color:var(--amber)}
  .paybox-preview{background:var(--void);border:1px solid var(--steel);border-radius:10px;padding:13px 15px;
    font-family:var(--mono);font-size:13px;line-height:1.7;color:var(--txt);white-space:pre-wrap;word-break:break-word}

  /* bottom nav */
  .botnav{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:40;
    display:flex;gap:2px;background:rgba(19,21,23,.9);backdrop-filter:blur(14px);
    border:1px solid var(--steel);border-radius:18px;padding:6px;
    box-shadow:0 14px 40px -12px rgba(0,0,0,.7),0 0 0 1px rgba(1,176,223,.05);max-width:calc(100% - 20px)}
  .botnav button{background:none;border:0;color:var(--faint);display:flex;flex-direction:column;align-items:center;gap:3px;
    font-size:9.5px;cursor:pointer;padding:7px 13px;border-radius:13px;transition:.14s;font-family:var(--cond);
    text-transform:uppercase;letter-spacing:.5px;font-weight:700;min-width:56px;position:relative}
  .botnav button .ico{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8}
  .botnav button:hover{color:var(--muted)}
  .botnav button.active{color:var(--cyan-2);background:var(--cyan-ghost)}
  .botnav button.active::before{content:"";position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:18px;height:3px;border-radius:3px;background:var(--cyan)}
  @media (max-width:600px){
    .botnav{left:0;right:0;bottom:0;transform:none;border-radius:0;max-width:100%;justify-content:space-around;
      border-left:0;border-right:0;border-bottom:0;padding:6px 2px env(safe-area-inset-bottom)}
    .botnav button{padding:6px 4px;min-width:0;flex:1}
    .botnav button .ico{width:20px;height:20px}
  }

  .toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--raised);
    border:1px solid var(--steel);color:var(--txt);padding:11px 18px;border-radius:11px;font-size:13px;font-weight:600;z-index:80;
    opacity:0;transition:.25s;box-shadow:0 12px 30px -10px rgba(0,0,0,.6);display:flex;align-items:center;gap:9px;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast .dot{width:8px;height:8px;border-radius:50%;background:var(--cyan)}
  .hide{display:none!important}
  .quote-total{display:flex;justify-content:space-between;align-items:baseline;padding:13px 16px;background:var(--void);border:1px solid var(--steel);border-radius:11px;margin-top:4px}
  .quote-total .big{font-size:24px;font-weight:750;font-family:var(--mono);color:var(--cyan-2)}
  .svc-row{display:grid;grid-template-columns:1fr 80px 56px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--steel-soft)}
  .svc-row:last-child{border-bottom:0}
  .svc-row .nm{font-size:13px}.svc-row .pr{font-size:11px;color:var(--faint)}
  .qty-ctl{display:flex;align-items:center;gap:0;border:1px solid var(--steel);border-radius:8px;overflow:hidden}
  .qty-ctl button{width:28px;height:30px;background:var(--char-2);border:0;color:var(--txt);cursor:pointer;font-size:15px}
  .qty-ctl button:hover{background:var(--raised);color:var(--cyan-2)}
  .qty-ctl input{width:40px;text-align:center;background:var(--void);border:0;border-left:1px solid var(--steel);border-right:1px solid var(--steel);color:var(--txt);padding:6px 0}
  /* quick-action links */
  a.tel{color:var(--cyan-2);text-decoration:none;transition:.12s}
  a.tel:hover{text-decoration:underline}
  .wa-btn{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:7px;
    background:rgba(37,211,102,.13);color:#25d166;border:1px solid rgba(37,211,102,.28);cursor:pointer;
    text-decoration:none;margin-left:5px;transition:.14s;vertical-align:middle;flex-shrink:0}
  .wa-btn:hover{background:rgba(37,211,102,.26)}
  .wa-btn svg{width:14px;height:14px;fill:currentColor}
  .qbtn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;
    border:1px solid var(--steel);background:var(--char-2);color:var(--muted);border-radius:8px;
    cursor:pointer;transition:.14s;flex-shrink:0;text-decoration:none;vertical-align:middle}
  .qbtn:hover{border-color:var(--green);color:var(--green);background:rgba(61,220,138,.1)}
  .qbtn.call:hover{border-color:var(--cyan);color:var(--cyan-2);background:var(--cyan-ghost)}
  .qbtn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
  .drive-status{font-size:12px;padding:8px 12px;border-radius:8px;border:1px solid var(--steel);background:var(--char-2)}
</style>
</head>

/* ============================================================
   LUX — single-file cleaning CRM. Data layer isolated in DB
   so a Supabase sync target slots in later without UI changes.
   ============================================================ */
const DB=(()=>{
  const NAME='lux_crm',VER=2;
  const STORES=['customers','leads','appointments','invoices','expenses','services','inventory','settings','funds'];
  let db=null;
  function open(){return new Promise((res,rej)=>{const r=indexedDB.open(NAME,VER);
    r.onupgradeneeded=e=>{const d=e.target.result;STORES.forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'});});};
    r.onsuccess=e=>{db=e.target.result;res(db);};r.onerror=e=>rej(e.target.error);});}
  const tx=(s,m)=>db.transaction(s,m).objectStore(s);
  const all=s=>new Promise((res,rej)=>{const o=[];const c=tx(s,'readonly').openCursor();
    c.onsuccess=e=>{const cur=e.target.result;if(cur){o.push(cur.value);cur.continue();}else res(o);};c.onerror=e=>rej(e.target.error);});
  const put=(s,v)=>new Promise((res,rej)=>{const r=tx(s,'readwrite').put(v);r.onsuccess=()=>res(v);r.onerror=e=>rej(e.target.error);});
  const del=(s,id)=>new Promise((res,rej)=>{const r=tx(s,'readwrite').delete(id);r.onsuccess=()=>res();r.onerror=e=>rej(e.target.error);});
  return {open,all,put,del,STORES};
})();

const uid=()=>crypto.randomUUID();
const now=()=>new Date().toISOString();
const $=s=>document.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
let CFG={business:'LUX',taxRate:20,currency:'£'};
const money=n=>CFG.currency+(Number(n||0)).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function waNum(p){return(p||'').replace(/\D/g,'').replace(/^0/,'44').replace(/^44\+/,'44');}

  const r=await Promise.all(keys.map(k=>DB.all(k)));
  keys.forEach((k,i)=>{if(k!=='settings')S[k]=r[i];});

    inv:{draft:['p-slate','Draft'],sent:['p-amber','Sent'],paid:['p-green','Paid'],overdue:['p-red','Overdue']}};

}

/* ---------- dashboard calendar ---------- */
let calMonth=null;
function buildCalendar(){
  if(!calMonth){const t=new Date();calMonth=new Date(t.getFullYear(),t.getMonth(),1);}
  const p=el('div','panel');
  const head=el('div','panel-head');
  head.innerHTML=`<h2>Calendar</h2><span class="count">${calMonth.toLocaleDateString('en-GB',{month:'long',year:'numeric'})}</span>`;
  const right=el('div','right');
  const prev=el('button','cal-nav','‹');prev.onclick=()=>{calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()-1,1);go('dashboard');};
  const tdy=el('button','cal-nav','Today');tdy.onclick=()=>{const t=new Date();calMonth=new Date(t.getFullYear(),t.getMonth(),1);go('dashboard');};
  const next=el('button','cal-nav','›');next.onclick=()=>{calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+1,1);go('dashboard');};
  right.appendChild(prev);right.appendChild(tdy);right.appendChild(next);head.appendChild(right);p.appendChild(head);
  const grid=el('div','cal-grid');
  ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach(d=>grid.appendChild(el('div','cal-dow',d)));
  const offset=(new Date(calMonth).getDay()+6)%7;
  const dim=new Date(calMonth.getFullYear(),calMonth.getMonth()+1,0).getDate();
  const todayStr=new Date().toDateString();
  for(let i=0;i<offset;i++)grid.appendChild(el('div','cal-cell empty'));
  for(let d=1;d<=dim;d++){
    const date=new Date(calMonth.getFullYear(),calMonth.getMonth(),d);
    const cell=el('div','cal-cell');
    if(date.toDateString()===todayStr)cell.classList.add('today');
    const jobs=S.appointments.filter(a=>new Date(a.start).toDateString()===date.toDateString()&&a.status!=='cancelled');
    cell.innerHTML=`<span class="cd">${d}</span>`;
    if(jobs.length){cell.classList.add('has');const dots=el('div','cal-dots');
      jobs.slice(0,4).forEach(j=>dots.appendChild(el('span','cal-dot'+(j.status==='done'?' done':''))));
      if(jobs.length>4)dots.appendChild(el('span','cal-more','+'+(jobs.length-4)));
      cell.appendChild(dots);}
    cell.onclick=()=>dayModal(date);
    grid.appendChild(cell);
  }
  p.appendChild(grid);return p;
}
function dayModal(date){
  const jobs=S.appointments.filter(a=>new Date(a.start).toDateString()===date.toDateString()&&a.status!=='cancelled').sort((a,b)=>new Date(a.start)-new Date(b.start));
  const body=el('div');
  if(jobs.length){jobs.forEach(a=>{const r=el('div','mini-row');r.style.cursor='pointer';
    r.innerHTML=`<span><span class="strong">${new Date(a.start).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</span> · ${esc(custName(a.customerId))} <span class="faint">${esc(a.service||'')}</span></span>${statusPill(a.status,'appt')}`;
    r.onclick=()=>{closeModal();apptModal(a);};body.appendChild(r);});}
  else body.appendChild(emptyState('calendar','No jobs this day','You\u2019re free for a booking.'));
  const foot=footRow();foot.appendChild(spacer());
  foot.appendChild(actionBtn('Cancel',closeModal,'ghost'));
  foot.appendChild(actionBtn('+ Book job',()=>{closeModal();const d=new Date(date);d.setHours(9,0,0,0);
    apptModal({id:uid(),customerId:'',start:d.toISOString(),duration:90,price:'',status:'scheduled',service:'',notes:'',recurrence:'none',photos:[]});},'primary'));
  modal({title:date.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'}),bodyEl:body,footEl:foot});
}

        </td>`;
      tr.querySelector('td:nth-child(2)').onclick=()=>apptModal(a);tb.querySelector('tbody').appendChild(tr);});

function nextStart(iso,rec){const d=new Date(iso);
  if(rec==='weekly')d.setDate(d.getDate()+7);else if(rec==='fortnightly')d.setDate(d.getDate()+14);
  else if(rec==='4weekly')d.setDate(d.getDate()+28);else if(rec==='monthly')d.setMonth(d.getMonth()+1);
  return d.toISOString();}
function apptModal(a){
  const isNew=!a;a=a||{id:uid(),customerId:'',start:now(),duration:90,price:'',status:'scheduled',service:'',notes:'',recurrence:'none',photos:[]};
  a.photos=a.photos||[];
  const custOpts=S.customers.map(c=>`<option value="${c.id}" ${c.id===a.customerId?'selected':''}>${esc(c.name)}</option>`).join('');
  const svcOpts=S.services.map(s=>`<option value="${esc(s.name)}" ${s.name===a.service?'selected':''}>${esc(s.name)}</option>`).join('');
  const body=el('div');
  body.innerHTML=
    field('Customer',`<select id="f-cust"><option value="">Select customer…</option>${custOpts}</select>`)+
    field('Service',`<select id="f-svc"><option value="">— pick or type below —</option>${svcOpts}</select>`)+
    `<div class="field-row">${field('Date & time',`<input type="datetime-local" id="f-start" value="${toLocalInput(a.start)}">`)}${field('Duration (mins)',`<input type="number" id="f-dur" value="${a.duration||90}" step="15">`)}</div>`+
    `<div class="field-row">${field('Price',`<input type="number" id="f-price" value="${a.price||''}" placeholder="0.00" step="0.01">`)}${field('Repeat',`<select id="f-rec">${Object.entries(RECUR).map(([k,l])=>`<option value="${k}" ${k===a.recurrence?'selected':''}>${l}</option>`).join('')}</select>`)}</div>`+
    `<div class="field-row">${field('Status',`<select id="f-status">${['scheduled','done','cancelled','no-show'].map(s=>`<option ${s===a.status?'selected':''}>${s}</option>`).join('')}</select>`)}<div></div></div>`+
    field('Notes',`<textarea id="f-notes" placeholder="Carpet type, rooms, access, parking, focus areas…">${esc(a.notes||'')}</textarea>`);
  // photos
  const photoWrap=el('div','field');photoWrap.innerHTML='<label>Before / after photos</label>';
  const grid=el('div','photo-grid');photoWrap.appendChild(grid);body.appendChild(photoWrap);
  function renderPhotos(){grid.innerHTML='';

      const exists=S.appointments.some(x=>x.seriesId===(a.seriesId||a.id)&&new Date(x.start)>new Date(a.start));
      if(!exists){const next={...a,id:uid(),start:ns,status:'scheduled',photos:[],seriesId:a.seriesId||a.id,createdAt:now()};

  },'primary'));

function downscale(file,max=1200,q=0.7){return new Promise(res=>{const img=new Image();const fr=new FileReader();
  fr.onload=()=>{img.onload=()=>{let{width:w,height:h}=img;if(w>h&&w>max){h=h*max/w;w=max;}else if(h>max){w=w*max/h;h=max;}
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);
    res(cv.toDataURL('image/jpeg',q));};img.src=fr.result;};fr.readAsDataURL(file);});}

function quoteModal(presetCustomer){
  const sel={};// serviceId -> qty
  const body=el('div');
  const custOpts=S.customers.map(c=>`<option value="${c.id}" ${c.id===presetCustomer?'selected':''}>${esc(c.name)}</option>`).join('');
  body.innerHTML=
    field('Customer (optional — or name below)',`<select id="q-cust"><option value="">— new enquiry —</option>${custOpts}</select>`)+
    field('Name for quote',`<input id="q-name" placeholder="If new: who's it for?">`);
  const list=el('div','panel');list.style.margin='2px 0';
  list.innerHTML='<div class="panel-head"><h2>Services</h2></div>';
  const lb=el('div');lb.style.padding='6px 16px';
  S.services.forEach(s=>{const row=el('div','svc-row');
    row.innerHTML=`<div><div class="nm">${esc(s.name)}</div><div class="pr">${money(s.price)} / ${esc(s.unit)}</div></div>`;
    const ctl=el('div','qty-ctl');ctl.innerHTML=`<button type="button">−</button><input type="number" value="0" min="0">`;
    const plusB=el('button','','+');plusB.type='button';ctl.appendChild(plusB);
    const inp=ctl.querySelector('input');const minus=ctl.querySelector('button');
    const upd=()=>{sel[s.id]=Math.max(0,+inp.value||0);calc();};
    minus.onclick=()=>{inp.value=Math.max(0,(+inp.value||0)-1);upd();};
    plusB.onclick=()=>{inp.value=(+inp.value||0)+1;upd();};
    inp.oninput=upd;
    const wrap=el('div');wrap.style.cssText='display:flex;justify-content:flex-end';wrap.appendChild(ctl);
    row.appendChild(wrap);row.appendChild(el('div','',''));lb.appendChild(row);});
  list.appendChild(lb);body.appendChild(list);
  // custom one-off amount
  const customBox=el('div');customBox.style.cssText='display:grid;grid-template-columns:1fr 110px;gap:10px;margin:2px 0';
  customBox.innerHTML=field('Custom item (optional)',`<input id="q-custom-desc" placeholder="e.g. Leather sofa, rug, special job">`)+
    field('Amount',`<input id="q-custom-amt" type="number" min="0" step="0.01" placeholder="0.00">`);
  body.appendChild(customBox);
  const totalBox=el('div','quote-total','<span class="dim">Quote total</span><span class="big" id="q-total">'+money(0)+'</span>');
  body.appendChild(totalBox);
  function calc(){let t=0;S.services.forEach(s=>{t+=(sel[s.id]||0)*s.price;});t+=Math.max(0,+($('#q-custom-amt')||{}).value||0);$('#q-total').textContent=money(t);return t;}
  body.querySelector('#q-custom-amt').oninput=calc;
  const foot=footRow();foot.appendChild(spacer());
  foot.appendChild(actionBtn('Cancel',closeModal,'ghost'));
  foot.appendChild(actionBtn('Save quote',async()=>{
    const total=calc();if(total<=0){toast('Add a service or custom amount');return;}
    const items=S.services.filter(s=>sel[s.id]>0).map(s=>({desc:s.name,qty:sel[s.id],price:s.price}));
    const customAmt=Math.max(0,+$('#q-custom-amt').value||0);
    const customDesc=$('#q-custom-desc').value.trim();
    if(customAmt>0)items.push({desc:customDesc||'Custom item',qty:1,price:customAmt});
    const custId=$('#q-cust').value;const nm=$('#q-name').value.trim()||(custId?custName(custId):'');
    if(!nm){toast('Add a name or pick a customer');return;}
    const lead={id:uid(),name:nm,phone:'',email:'',source:'quote',status:'quoted',amount:total,
      notes:'Quote:\n'+items.map(i=>`${i.qty}× ${i.desc} — ${money(i.qty*i.price)}`).join('\n'),
      quoteItems:items,convertedTo:custId||null,createdAt:now()};
    if(custId){const c=S.customers.find(x=>x.id===custId);if(c){lead.phone=c.phone;lead.email=c.email;}}
    await DB.put('leads',lead);S.leads.push(lead);closeModal();go('leads');toast('Quote saved to pipeline');
  },'primary'));
  modal({title:'Build a quote',bodyEl:body,footEl:foot,wide:true});
}

function payText(){
  const name=CFG.accName||CFG.business||'LUX';
  const sort=CFG.sortCode||'';const acc=CFG.accNumber||'';
  return `Payment details — ${name}\nSort code: ${sort}\nAccount no: ${acc}\nReference: your name / invoice no.`;
}
function buildPayBox(){
  const p=el('div','panel');p.appendChild(el('div','panel-head','<h2>Payment details</h2><span class="count">tap copy to send to a customer</span>'));
  const b=el('div');b.style.cssText='padding:16px';
  b.innerHTML=`<div class="field-row-3" style="margin-bottom:12px">
    ${field('Account name',`<input id="pay-name" value="${esc(CFG.accName||CFG.business||'')}" placeholder="LUX Cleaning">`)}
    ${field('Sort code',`<input id="pay-sort" value="${esc(CFG.sortCode||'')}" placeholder="12-34-56">`)}
    ${field('Account number',`<input id="pay-acc" value="${esc(CFG.accNumber||'')}" placeholder="12345678">`)}</div>`;
  const preview=el('div','paybox-preview');preview.id='payPreview';preview.textContent=payText();
  b.appendChild(preview);
  const row=el('div');row.style.cssText='display:flex;gap:10px;margin-top:12px;flex-wrap:wrap';
  const saveSync=async()=>{CFG.accName=$('#pay-name').value;CFG.sortCode=$('#pay-sort').value;CFG.accNumber=$('#pay-acc').value;
    await DB.put('settings',{id:'config',...CFG});$('#payPreview').textContent=payText();};
  b.querySelectorAll('input').forEach(inp=>inp.oninput=()=>{
    CFG.accName=$('#pay-name').value;CFG.sortCode=$('#pay-sort').value;CFG.accNumber=$('#pay-acc').value;
    $('#payPreview').textContent=payText();});
  const copyBtn=actionBtn('<svg class="ico" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy details',async()=>{
    await saveSync();
    try{await navigator.clipboard.writeText(payText());toast('Payment details copied');}
    catch{const t=$('#payPreview');const r=document.createRange();r.selectNodeContents(t);const sel=getSelection();sel.removeAllRanges();sel.addRange(r);
      try{document.execCommand('copy');toast('Payment details copied');}catch{toast('Select & copy the box');}sel.removeAllRanges();}
  },'primary');
  const saveBtn=actionBtn('Save',saveSync,'ghost');
  row.appendChild(copyBtn);row.appendChild(saveBtn);b.appendChild(row);
  p.appendChild(b);return p;
}

  </div>`;
  v.appendChild(fPanel);

  S.invoices.filter(i=>i.status==='paid'&&i.paidDate).forEach(i=>years.add(ukYear(i.paidDate)));
  S.expenses.forEach(e=>years.add(ukYear(e.date)));
  const yearList=[...years].sort((a,b)=>b-a);
  const inRange=d=>taxYear==='all'||ukYear(d)===+taxYear;
  const income=S.invoices.filter(i=>i.status==='paid'&&i.paidDate&&inRange(i.paidDate)).reduce((s,i)=>s+invTotal(i),0);
  const expenses=S.expenses.filter(e=>inRange(e.date));

  const profit=income-expTotal;const setAside=Math.max(0,profit)*(CFG.taxRate/100);

  const sel=el('div');sel.style.cssText='display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap';
  sel.innerHTML='<span class="eyebrow">Tax year</span>';
  const seg=el('div','seg');

  two.appendChild(p1);
  const right=el('div');const cat=el('div','panel');cat.appendChild(el('div','panel-head','<h2>By category</h2>'));

  const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);

  else cb.innerHTML='<div class="faint" style="font-size:13px">No expenses to summarise.</div>';

function renderStockList(){

  let list=S.inventory.filter(it=>!q||[it.name,it.category,it.supplier].some(f=>(f||'').toLowerCase().includes(q)));
  list.sort((a,b)=>(a.category||'').localeCompare(b.category||'')||a.name.localeCompare(b.name));
  const low=S.inventory.filter(it=>it.reorder!=null&&Number(it.qty)<=Number(it.reorder)).length;
  const stockVal=S.inventory.reduce((s,it)=>s+(Number(it.qty)||0)*(Number(it.cost)||0),0);
  const p=el('div','panel');
  p.appendChild(el('div','panel-head',`<h2>Inventory</h2><span class="count">${list.length} item${list.length===1?'':'s'}${low?` · ${low} low`:''} · ${money(stockVal)} on hand</span>`));
  if(!list.length)p.appendChild(emptyState('box','No products yet','Add stock to track what you have.'));
  else{const tb=el('table',null,'<thead><tr><th>Product</th><th>Category</th><th>On hand</th><th class="num">Reorder at</th><th class="num">Unit cost</th></tr></thead><tbody></tbody>');
    list.forEach(it=>{const isLow=it.reorder!=null&&Number(it.qty)<=Number(it.reorder);
      const tr=el('tr','row-click');
      tr.innerHTML=`<td class="strong">${esc(it.name)}</td><td class="dim">${esc(it.category||'—')}</td><td></td>
        <td class="num dim">${it.reorder!=null&&it.reorder!==''?it.reorder:'—'}</td><td class="num">${it.cost?money(it.cost):'—'}</td>`;
      const ctl=el('div','stock-ctl');
      ctl.innerHTML=`<button class="sdec" type="button">−</button><span class="sval${isLow?' low':''}">${it.qty} <small>${esc(it.unit||'')}</small></span><button class="sinc" type="button">+</button>${isLow?'<span class="pill p-amber" style="margin-left:4px">Low</span>':''}`;
      ctl.querySelector('.sdec').onclick=async e=>{e.stopPropagation();it.qty=Math.max(0,(Number(it.qty)||0)-1);await DB.put('inventory',it);renderStockList();};
      ctl.querySelector('.sinc').onclick=async e=>{e.stopPropagation();it.qty=(Number(it.qty)||0)+1;await DB.put('inventory',it);renderStockList();};
      tr.children[2].appendChild(ctl);
      tr.onclick=()=>stockModal(it);tb.querySelector('tbody').appendChild(tr);});
    p.appendChild(tb);}
  wrap.appendChild(p);
}
const STOCK_CATS=['Chemicals','Equipment','Consumables','PPE','Other'];
function stockModal(it){

  const body=el('div');
  body.innerHTML=
    field('Product name',`<input id="k-name" value="${esc(it.name)}">`)+
    `<div class="field-row">${field('Category',`<select id="k-cat">${STOCK_CATS.map(c=>`<option ${c===it.category?'selected':''}>${c}</option>`).join('')}</select>`)}${field('Supplier',`<input id="k-sup" value="${esc(it.supplier||'')}">`)}</div>`+
    `<div class="field-row-3">${field('On hand',`<input id="k-qty" type="number" value="${it.qty||0}">`)}${field('Unit',`<input id="k-unit" value="${esc(it.unit||'')}" placeholder="L, bottle…">`)}${field('Reorder at',`<input id="k-re" type="number" value="${it.reorder!=null?it.reorder:''}">`)}</div>`+
    field('Unit cost',`<input id="k-cost" type="number" value="${it.cost||''}" step="0.01">`)+
    field('Notes',`<textarea id="k-notes">${esc(it.notes||'')}</textarea>`);
  const foot=footRow();
  if(!isNew)foot.appendChild(actionBtn('Delete',async()=>{await DB.del('inventory',it.id);S.inventory=S.inventory.filter(x=>x.id!==it.id);closeModal();go('inventory');toast('Product removed');},'danger'));
  foot.appendChild(spacer());foot.appendChild(actionBtn('Cancel',closeModal,'ghost'));

    it.name=$('#k-name').value.trim();if(!it.name){toast('Name required');return;}
    it.category=$('#k-cat').value;it.supplier=$('#k-sup').value;it.qty=Number($('#k-qty').value)||0;it.unit=$('#k-unit').value;
    it.reorder=$('#k-re').value===''?null:Number($('#k-re').value);it.cost=$('#k-cost').value;it.notes=$('#k-notes').value;
    it.updatedAt=now();if(isNew)it.createdAt=now();await DB.put('inventory',it);
    if(isNew)S.inventory.push(it);else S.inventory=S.inventory.map(x=>x.id===it.id?it:x);
    closeModal();go('inventory');toast(isNew?'Product added':'Updated');},'primary'));
  modal({title:isNew?'New product':esc(it.name),bodyEl:body,footEl:foot});
}

function exportData(){
  const data=getExportData();
  const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
  const a=el('a');a.href=URL.createObjectURL(blob);a.download=`lux-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();toast('Backup exported');

function importData(ev){const file=ev.target.files[0];if(!file)return;const r=new FileReader();
  r.onload=async()=>{try{const d=JSON.parse(r.result);if(!confirm('Merge this backup into current data?'))return;
    if(d.config){CFG={...CFG,...d.config};await DB.put('settings',{id:'config',...CFG});}
    for(const st of ['customers','leads','appointments','invoices','expenses','services','inventory','funds'])for(const rec of (d[st]||[]))await DB.put(st,rec);
    await loadAll();go('dashboard');toast('Backup imported');}catch(e){toast('Could not read that file');}};
  r.readAsText(file);ev.target.value='';
}

/* ============================================================
   GOOGLE DRIVE BACKUP
   ============================================================ */
let _driveToken=null;
function getExportData(){return{version:2,exported:now(),config:CFG,customers:S.customers,leads:S.leads,appointments:S.appointments,invoices:S.invoices,expenses:S.expenses,services:S.services,inventory:S.inventory,funds:S.funds};}

function getDriveToken(){
  return new Promise(resolve=>{
    if(_driveToken){resolve(_driveToken);return;}
    const clientId=CFG.googleClientId;
    if(!clientId){toast('Enter your Google Client ID in Settings → Backup first');resolve(null);return;}
    const go=()=>{
      const client=window.google.accounts.oauth2.initTokenClient({
        client_id:clientId,
        scope:'https://www.googleapis.com/auth/drive.file',
        callback:resp=>{if(resp.access_token){_driveToken=resp.access_token;setTimeout(()=>{_driveToken=null;},3500000);resolve(resp.access_token);}else{toast('Google auth failed');resolve(null);}}});
      client.requestAccessToken();};
    if(window.google&&window.google.accounts){go();}
    else{const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=go;s.onerror=()=>{toast('Could not load Google auth');resolve(null);};document.head.appendChild(s);}
  });
}
async function driveBackup(){
  const token=await getDriveToken();if(!token)return;
  const json=JSON.stringify(getExportData());
  // find existing backup file
  const q=encodeURIComponent("name='lux-crm-backup.json' and trashed=false");
  const search=await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,name)`,{headers:{Authorization:`Bearer ${token}`}}).then(r=>r.json()).catch(()=>({files:[]}));
  const existing=search.files&&search.files[0];
  const meta={name:'lux-crm-backup.json',mimeType:'application/json'};
  const form=new FormData();
  form.append('metadata',new Blob([JSON.stringify(meta)],{type:'application/json'}));
  form.append('file',new Blob([json],{type:'application/json'}));
  const url=existing?`https://www.googleapis.com/upload/drive/v3/files/${existing.id}?uploadType=multipart`:'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart';
  const method=existing?'PATCH':'POST';
  const r=await fetch(url,{method,headers:{Authorization:`Bearer ${token}`},body:form});
  if(r.ok){CFG.lastDriveBackup=now();await DB.put('settings',{id:'config',...CFG});toast('Backed up to Google Drive ✓');if(document.getElementById('drive-last'))document.getElementById('drive-last').textContent='Last backup: '+fmtDateTime(CFG.lastDriveBackup);}
  else{const err=await r.json().catch(()=>({}));toast('Drive backup failed: '+(err.error&&err.error.message||r.status));}
}
async function driveRestore(){
  const token=await getDriveToken();if(!token)return;
  const q=encodeURIComponent("name='lux-crm-backup.json' and trashed=false");
  const search=await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,name,modifiedTime)`,{headers:{Authorization:`Bearer ${token}`}}).then(r=>r.json()).catch(()=>({files:[]}));
  const file=search.files&&search.files[0];
  if(!file){toast('No backup found in Google Drive');return;}
  if(!confirm(`Restore from Drive backup?\n(Modified: ${new Date(file.modifiedTime).toLocaleString('en-GB')})\nThis will merge data — existing records are kept.`))return;
  const content=await fetch(`https://www.googleapis.com/drive/v3/files/${file.id}?alt=media`,{headers:{Authorization:`Bearer ${token}`}}).then(r=>r.text());
  try{const d=JSON.parse(content);
    if(d.config){CFG={...CFG,...d.config};await DB.put('settings',{id:'config',...CFG});}
    for(const st of ['customers','leads','appointments','invoices','expenses','services','inventory'])for(const rec of(d[st]||[]))await DB.put(st,rec);
    await loadAll();go('dashboard');toast('Restored from Google Drive ✓');}
  catch(e){toast('Could not parse backup file');}
}
